{x:"N",c:"Contracts",q:"Which is NOT required for a valid real estate sales contract?",o:["Competent parties","Earnest money","Lawful purpose","Consideration"],a:1,r:"Validity",e:"Essentials: competent parties, offer and acceptance (mutual assent), consideration, legal purpose, and for real estate a writing signed by the parties. Earnest money is customary, not required; the promises are the consideration."},
{x:"N",c:"Contracts",q:"A 16-year-old signs a contract to buy a condo. The contract is:",o:["Void","Voidable by the minor","Unenforceable by anyone","Valid and binding on both"],a:1,r:"Void vs voidable",e:"Voidable: valid unless the protected party cancels (minors, duress, fraud, undue influence). Void: no legal effect from the start, such as an illegal purpose."},
{x:"N",c:"Contracts",q:"A contract to sell a house so it can be used as an illegal gambling parlor is:",o:["Voidable","Void","Unenforceable","Executory"],a:1,r:"Void vs voidable",e:"No legal purpose means no contract at all."},
{x:"N",c:"Contracts",q:"Two friends shake hands on the sale of a lot and the buyer later refuses to close. The agreement is:",o:["Void","Valid but unenforceable under the statute of frauds","Fully enforceable","Voidable by the seller only"],a:1,r:"Statute of frauds",e:"The statute of frauds requires contracts for the sale of real estate, and leases over one year, to be in writing to be enforced in court. An oral deal is not illegal; it just cannot be enforced."},
{x:"N",c:"Contracts",q:"A purchase agreement in which the buyer promises to pay and the seller promises to convey is:",o:["Unilateral","Bilateral","Implied","Executed"],a:1,r:"Contract types",e:"Bilateral: a promise for a promise. Unilateral: a promise for an act, such as an option or an open listing."},
{x:"N",c:"Contracts",q:"A signed purchase contract that has not yet closed is:",o:["Executed","Executory","Void","Discharged"],a:1,r:"Contract types",e:"Executory: something remains to be done. Executed: fully performed. (Executed can also mean signed; read the question.)"},
{x:"N",c:"Contracts",q:"A seller receives an offer at $400,000 and replies with $415,000. The original $400,000 offer is:",o:["Still open for acceptance","Terminated by the counteroffer","Binding on the buyer for 24 hours","Converted to an option"],a:1,r:"Offer and acceptance",e:"A counteroffer rejects the original offer and becomes a new offer. The seller cannot go back and accept $400,000 unless the buyer renews it."},
{x:"N",c:"Contracts",q:"A buyer makes an offer and, before hearing back, calls to withdraw it. The seller had signed but not yet communicated acceptance. The result:",o:["A binding contract exists","No contract; an offer may be revoked any time before acceptance is communicated","The buyer forfeits earnest money","The seller may sue for specific performance"],a:1,r:"Offer and acceptance",e:"Acceptance is effective when communicated to the offeror or their agent as the offer requires. Until then the offeror can revoke."},
{x:"N",c:"Contracts",q:"An offer terminates on all of these EXCEPT:",o:["Rejection by the offeree","Death of the offeror before acceptance","Expiration of the time stated","The offeree asking a question about the closing date"],a:3,r:"Offer and acceptance",e:"Offers end by rejection, counteroffer, revocation, lapse of time, death or insanity, or destruction of the property. A mere inquiry is not a rejection."},
{x:"N",c:"Contracts",q:"An owner gives a buyer the right to purchase at $500,000 within 90 days in exchange for $5,000. During the 90 days:",o:["Both must perform","Only the owner is bound; the buyer may choose whether to buy","Only the buyer is bound","Neither is bound"],a:1,r:"Options",e:"An option is unilateral: the optionor must sell if the optionee exercises. The option fee is the consideration and is usually nonrefundable."},
{x:"N",c:"Contracts",q:"A tenant has the right to match any offer the landlord receives before the building is sold. This is:",o:["An option to purchase","A right of first refusal","A lease-purchase","A contingency"],a:1,r:"Options",e:"A right of first refusal only arises if the owner decides to sell. An option lets the holder force the sale."},
{x:"N",c:"Contracts",q:"A contract is conditioned on the buyer obtaining financing. If the buyer, acting in good faith, is denied a loan within the deadline:",o:["The buyer is in default","The buyer may terminate and recover the earnest money","The seller must finance the sale","The price is reduced"],a:1,r:"Contingencies",e:"A contingency is a condition that must be satisfied or waived. Failure of the condition is not a breach; it lets the protected party out."},
{x:"N",c:"Contracts",q:"A buyer assigns her purchase contract to an investor. The original buyer:",o:["Is released from all liability","Remains secondarily liable unless the seller releases her","Becomes the seller's agent","Has voided the contract"],a:1,r:"Assignment vs novation",e:"Assignment transfers rights but the assignor stays liable. Novation substitutes a new party or contract and releases the original party."},
{x:"N",c:"Contracts",q:"Replacing an existing contract with a new one that releases the original party is:",o:["Assignment","Novation","Rescission","Subordination"],a:1,r:"Assignment vs novation",e:"Novation needs everyone's consent and extinguishes the old obligation."},
{x:"N",c:"Contracts",q:"A seller refuses to close and the buyer wants the house, not money. The buyer sues for:",o:["Liquidated damages","Specific performance","Rescission","Partition"],a:1,r:"Remedies",e:"Specific performance: a court orders the party to perform, available because every parcel of land is unique."},
{x:"N",c:"Contracts",q:"The contract says that if the buyer defaults the seller keeps the earnest money as the seller's only remedy. This amount is:",o:["Punitive damages","Liquidated damages","Compensatory damages","A penalty"],a:1,r:"Remedies",e:"Liquidated damages are agreed in advance as a reasonable estimate of loss."},
{x:"N",c:"Contracts",q:"Rescission of a contract means:",o:["One party is forced to perform","The contract is canceled and the parties are returned to their original positions","Damages are tripled","The contract is assigned"],a:1,r:"Remedies",e:"Rescind = undo. Money and documents go back as if the contract never existed."},
{x:"N",c:"Contracts",q:"After a contract is signed but before closing, the buyer holds:",o:["Legal title","Equitable title","No interest","A leasehold"],a:1,r:"Purchase agreements",e:"Equitable title is the right to obtain legal title on performance. Legal title passes with the deed."},
{x:"N",c:"Contracts",q:"A change agreed to after the contract is signed is an ___; an attachment that is part of the contract from the start is an ___.",o:["Addendum; amendment","Amendment; addendum","Assignment; addendum","Amendment; assignment"],a:1,r:"Addenda and amendments",e:"Addendum: added at formation. Amendment: modifies an existing contract and needs all parties' signatures."},
{x:"N",c:"Contracts",q:"A listing broker receives three offers on the same day. The broker must:",o:["Present only the highest","Present them in order received, one at a time","Present all offers to the seller promptly","Tell each buyer the others' terms to raise the price"],a:2,r:"Multiple offers",e:"All offers are presented. The seller decides. Terms of one buyer's offer are not shared with other buyers without the seller's direction and as the law allows."},
{x:"N",c:"Contracts",q:"A seller with three offers wants to counter two of them at once. The main risk is:",o:["Violating fair housing","Being bound to sell the same property to two buyers if both accept","Losing the listing","Violating RESPA"],a:1,r:"Multiple offers",e:"Two accepted counters mean two contracts for one property. Sellers should counter one at a time or use language making counters subject to the seller's final acceptance."},
{x:"N",c:"Contracts",q:"Under the federal E-SIGN Act and UETA, an electronic signature on a real estate contract is:",o:["Invalid","As legally effective as an ink signature if the parties agree to transact electronically","Valid only for leases","Valid only if notarized"],a:1,r:"Electronic signatures",e:"Electronic records and signatures cannot be denied effect just because they are electronic. The risk is identity and wire fraud, so verify parties and instructions."},
{x:"N",c:"Contracts",q:"A lease for a fixed term that ends automatically with no notice is an:",o:["Estate for years","Estate from period to period","Estate at will","Estate at sufferance"],a:0,r:"Leasehold estates",e:"Estate (tenancy) for years: definite start and end, even if it is three months. Periodic: renews automatically until notice. At will: indefinite, ends on notice or death. At sufferance: holdover without consent."},
{x:"N",c:"Contracts",q:"A tenant stays after the lease expires without the landlord's consent. The tenant holds an:",o:["Estate for years","Periodic tenancy","Estate at will","Estate at sufferance"],a:3,r:"Leasehold estates",e:"Tenancy at sufferance. If the landlord accepts rent it usually becomes a periodic tenancy."},
{x:"N",c:"Contracts",q:"A landlord sells a building that has tenants with two years left on their leases. The leases:",o:["Terminate at closing","Remain binding on the new owner","Convert to month-to-month","Are voidable by the buyer"],a:1,r:"Leases",e:"A sale does not terminate a lease. The buyer takes subject to it."},
{x:"N",c:"Contracts",q:"A tenant pays a fixed rent and the landlord pays taxes, insurance and maintenance. This is a:",o:["Net lease","Gross lease","Percentage lease","Ground lease"],a:1,r:"Types of leases",e:"Gross: landlord pays operating expenses. Net: tenant pays some or all (triple net = taxes, insurance, maintenance). Percentage: base rent plus a share of sales, common in retail."},
{x:"N",c:"Contracts",q:"A retail tenant pays base rent plus 5% of gross sales over $500,000. This is a:",o:["Graduated lease","Index lease","Percentage lease","Net lease"],a:2,r:"Types of leases",e:"Percentage leases tie rent to the tenant's sales. Graduated leases step up on a schedule. Index leases adjust with an index such as CPI."},
{x:"N",c:"Contracts",q:"A tenant transfers the entire remaining term of the lease to another person. This is:",o:["A sublease","An assignment","A novation","A surrender"],a:1,r:"Leases",e:"Assignment: the whole remaining interest. Sublease: part of the space or part of the term, with the original tenant keeping a reversion. Either way the original tenant stays liable unless released."},
{x:"N",c:"Contracts",q:"The heat fails in January, the landlord ignores repeated requests, and the tenant moves out. The tenant may claim:",o:["Actual eviction","Constructive eviction","Abandonment","Novation"],a:1,r:"Leases",e:"Constructive eviction: the landlord's failure makes the premises unusable and the tenant leaves. Actual eviction is the landlord's legal action to remove the tenant."},
{x:"N",c:"Contracts",q:"In a lease-purchase agreement the tenant:",o:["May choose whether to buy","Is obligated to buy at the end of the lease term","Receives title at lease signing","Pays no rent"],a:1,r:"Lease-purchase",e:"Lease-purchase: both a lease and a binding purchase contract. Lease-option: the tenant has the right but not the obligation.",n:"Colorado CP-23: brokers do not draft lease options or lease-purchase agreements. Refer to an attorney."},
{x:"N",c:"Contracts",q:"Under the parol evidence rule:",o:["Oral agreements always control","A complete written contract cannot be contradicted by earlier oral statements","Contracts must be recorded","Minors can sign with parental consent"],a:1,r:"General principles",e:"If it is not in the written contract, do not rely on it. Put every promise in writing."},
{x:"N",c:"Contracts",q:"A contract signed because one party threatened the other is:",o:["Void","Voidable by the threatened party","Enforceable","Illegal"],a:1,r:"Enforceability",e:"Duress, undue influence, misrepresentation and fraud make a contract voidable by the victim."},
{x:"N",c:"Contracts",q:"The time within which a lawsuit for breach must be filed is set by the:",o:["Statute of frauds","Statute of limitations","Parol evidence rule","Doctrine of laches only"],a:1,r:"Enforceability",e:"After the limitation period runs the contract is unenforceable in court even though it was valid."},
{x:"N",c:"Contracts",q:"A purchase contract has been signed by both parties and all contingencies are removed. The buyer dies before closing. Generally the contract:",o:["Is void","Is binding on the buyer's estate","Converts to an option","Is voidable by the seller only"],a:1,r:"Rights and obligations",e:"Death terminates an offer and an agency, but a binding purchase contract generally survives and binds the estate unless it calls for personal services."},
{x:"N",c:"Contracts",q:"A contract may be discharged by all of these EXCEPT:",o:["Full performance","Mutual agreement to cancel","Impossibility of performance","One party simply changing their mind"],a:3,r:"Termination",e:"Discharge: performance, mutual rescission, novation, impossibility, operation of law. Unilaterally walking away is a breach."},
{x:"N",c:"Contracts",q:"A ground lease is typically:",o:["A short residential lease","A long-term lease of land on which the tenant builds improvements","A lease of farm equipment","A month-to-month parking lease"],a:1,r:"Types of leases",e:"Ground leases often run 50 years or more and are usually net leases."},

// ================= NATIONAL · VI. AGENCY (13%) =================
{x:"N",c:"Agency",q:"In a listing agreement, the seller is the ___ and the brokerage is the ___.",o:["Agent; principal","Principal; agent","Customer; client","Fiduciary; trustee"],a:1,r:"Agency basics",e:"The principal (client) hires the agent. The agent owes fiduciary duties to the principal. A customer is the other party, owed honesty and fair dealing."},
{x:"N",c:"Agency",q:"The fiduciary duties an agent owes a principal are commonly remembered as:",o:["Obedience, loyalty, disclosure, confidentiality, accounting, reasonable care","Honesty, speed, price, marketing, service","Offer, acceptance, consideration, legality","Title, time, interest, possession"],a:0,r:"OLD CAR",e:"OLD CAR: Obedience (to lawful instructions), Loyalty, Disclosure, Confidentiality, Accounting, Reasonable care.",n:"Colorado replaces common-law fiduciary duties with statutory uniform duties, and adds transaction-brokerage as the default non-agency relationship."},
{x:"N",c:"Agency",q:"A seller tells the listing agent not to show the home to families with children. The agent should:",o:["Obey the principal","Refuse; the duty of obedience covers only lawful instructions","Obey but notify HUD","Show it only to couples"],a:1,r:"Fiduciary duties",e:"Obedience never extends to illegal instructions. The agent should explain the law and decline the listing if the seller insists."},
{x:"N",c:"Agency",q:"A listing agent learns the buyer is pre-approved for $40,000 more than the offer. The duty that requires telling the seller is:",o:["Confidentiality","Disclosure","Accounting","Obedience"],a:1,r:"Fiduciary duties",e:"An agent discloses to the principal everything material to the transaction, including what is learned about the other side.",n:"A Colorado transaction-broker working with both sides could not share this; it is the buyer's confidential information."},
{x:"N",c:"Agency",q:"A real estate broker hired to sell one specific property is a:",o:["Universal agent","General agent","Special agent","Agent coupled with an interest"],a:2,r:"Types of agents",e:"Special (limited) agent: one transaction, no power to bind the principal. General agent: ongoing range of duties, such as a property manager or an associate to the firm. Universal: all matters, under a broad power of attorney."},
{x:"N",c:"Agency",q:"A property manager who handles all day-to-day matters for an owner's building is a:",o:["Special agent","General agent","Universal agent","Subagent"],a:1,r:"Types of agents",e:"General agent: broad, continuing authority within one business."},
{x:"N",c:"Agency",q:"Under which listing does the broker earn a commission no matter who sells the property?",o:["Open listing","Exclusive agency listing","Exclusive right-to-sell listing","Net listing"],a:2,r:"Listing types",e:"Exclusive right to sell: broker paid regardless. Exclusive agency: one broker, but the owner can sell personally and owe nothing. Open: any number of brokers, only the procuring cause is paid."},
{x:"N",c:"Agency",q:"A seller says: get me $300,000 and keep anything over that. This is a:",o:["Net listing","Open listing","Multiple listing","Exclusive agency"],a:0,r:"Listing types",e:"Net listings create a conflict of interest between broker and seller and are illegal or discouraged in many states."},
{x:"N",c:"Agency",q:"An owner signs open listings with three brokers and then sells the home herself. She owes:",o:["A commission to all three","A commission to the first broker","No commission","Half a commission"],a:2,r:"Listing types",e:"Open listing: unilateral. Only the broker who is the procuring cause is paid, and the owner keeps the right to sell."},
{x:"N",c:"Agency",q:"In many states, a broker representing both buyer and seller in one transaction is a dual agent, which is lawful only with:",o:["The employing broker's approval","Informed written consent of both parties","A reduced commission","A court order"],a:1,r:"Dual agency",e:"Undisclosed dual agency is a breach everywhere. Disclosed dual agency is allowed in many states with informed written consent.",n:"Colorado prohibits dual agency outright. The broker would be a transaction-broker for both, or agent for one with the other as a customer."},
{x:"N",c:"Agency",q:"A relationship in which the broker assists the parties without representing either as an agent is known as:",o:["Subagency","Transaction brokerage (facilitator)","Universal agency","Agency by estoppel"],a:1,r:"Non-agency",e:"A transaction broker or facilitator owes honesty, skill and care, and accounting, but not loyalty or advocacy.",n:"This is the default relationship in Colorado."},
{x:"N",c:"Agency",q:"An agency relationship created by the parties' conduct rather than a written agreement is:",o:["Express agency","Implied agency","Agency coupled with an interest","Void"],a:1,r:"Creation of agency",e:"Agency can be express (written or oral) or implied from actions. Acting like someone's agent can create duties and liability.",n:"In Colorado, agency with the public requires a written agreement; without one the broker is a transaction-broker."},
{x:"N",c:"Agency",q:"Which terminates a listing agreement?",o:["The seller's receipt of an offer","Death of the seller or destruction of the property","A change in mortgage rates","The broker taking a second listing nearby"],a:1,r:"Termination of agency",e:"Agency ends by performance, expiration, mutual agreement, revocation or renunciation, death or incapacity of either party, destruction of the property, or bankruptcy."},
{x:"N",c:"Agency",q:"A person authorized in writing to sign documents for another is an:",o:["Attorney at law","Attorney-in-fact under a power of attorney","Executor","Escrow agent"],a:1,r:"Powers of attorney",e:"A power of attorney names an attorney-in-fact. For real estate it must be in writing and is typically recorded. It ends at the principal's death."},
{x:"N",c:"Agency",q:"A listing agent tells a buyer: this is the best view in the county. This statement is:",o:["Fraud","Puffing","Negligent misrepresentation","A warranty"],a:1,r:"Duties to customers",e:"Puffing is obvious opinion or exaggeration. Stating a false fact, such as the roof is new when it is not, is misrepresentation."},
{x:"N",c:"Agency",q:"A listing agent knows the basement floods every spring and says nothing to buyers. This is:",o:["Permissible loyalty to the seller","Fraud by concealment (failure to disclose a known material defect)","Puffing","Caveat emptor"],a:1,r:"Duties to customers",e:"Agents owe customers honesty and disclosure of known material defects. Silence about a known latent defect can be fraud."},
{x:"N",c:"Agency",q:"A buyer's agent wants to buy a client's dream home for himself. The agent must:",o:["Proceed quietly","Disclose the conflict and his interest and get informed consent, or step aside","Refer the client to the seller","Reduce his commission"],a:1,r:"Conflict of interest",e:"Self-dealing violates loyalty. Any personal interest must be disclosed in writing before the party acts."},
{x:"N",c:"Agency",q:"When must a licensee disclose whom the licensee represents?",o:["At closing","At the first substantive contact, before confidential information is discussed","Only if asked","When the offer is accepted"],a:1,r:"Agency disclosure",e:"Early disclosure lets consumers decide what to share. State law sets the exact trigger.",n:"Colorado Rule 6.5: in writing, before eliciting or discussing confidential information."},
{x:"N",c:"Agency",q:"A buyer representation agreement:",o:["Makes the broker the seller's subagent","Makes the buyer the broker's client, with the broker owing the buyer fiduciary duties","Guarantees the buyer a loan","Is the same as a purchase contract"],a:1,r:"Buyer brokerage",e:"It sets the relationship, term, compensation and duties between buyer and brokerage."},
{x:"N",c:"Agency",q:"A cooperating broker who works with a buyer but owes fiduciary duties to the seller through the listing broker is a:",o:["Buyer's agent","Subagent","Dual agent","Designated agent"],a:1,r:"Subagency",e:"Subagency: the cooperating broker is the agent of the listing broker and so of the seller. It has largely been replaced by buyer agency."},
{x:"N",c:"Agency",q:"A broker holds an agency coupled with an interest when the broker:",o:["Has a listing on the property","Has an ownership or financial interest in the property that is the subject of the agency","Represents two buyers","Is a member of the MLS"],a:1,r:"Termination of agency",e:"Agency coupled with an interest cannot be revoked by the principal and does not end at the principal's death."},
{x:"N",c:"Agency",q:"The amount of a broker's commission is:",o:["Set by state law","Set by the local association","Negotiable between the broker and the client","Fixed at 6%"],a:2,r:"Compensation",e:"Commissions are always negotiable. Any suggestion of a standard rate invites an antitrust problem."},
{x:"N",c:"Agency",q:"A seller's agent may tell a buyer:",o:["The lowest price the seller will take","Why the seller is moving","Known material defects in the property","The seller's financial trouble"],a:2,r:"Duties to customers",e:"Defects must be disclosed. Price flexibility, motivation and personal finances are confidential."}
);

// ================= NATIONAL · VII. PROPERTY DISCLOSURES (7%) =================
{x:"N",c:"Property Disclosures",q:"A defect that a reasonable inspection would not reveal, such as a cracked foundation hidden behind paneling, is a:",o:["Patent defect","Latent defect","Curable defect","Cosmetic defect"],a:1,r:"Material defects",e:"Latent = hidden. Patent = obvious. Sellers and licensees must disclose known latent material defects."},
{x:"N",c:"Property Disclosures",q:"A material fact is one that:",o:["Appears in the public record","A reasonable person would consider important in deciding whether to buy or what to pay","Relates only to the structure","The seller chooses to disclose"],a:1,r:"Material facts",e:"Materiality is judged from the buyer's side: would it affect the decision or the price."},
{x:"N",c:"Property Disclosures",q:"Federal lead-based paint disclosure rules apply to most housing built before:",o:["1968","1978","1988","1998"],a:1,r:"Lead-based paint",e:"Pre-1978 target housing. Seller or landlord discloses known hazards, gives available reports and the EPA pamphlet. Lead paint was banned for residential use in 1978."},
{x:"N",c:"Property Disclosures",q:"Under the federal lead-based paint rule, a buyer of pre-1978 housing must be given:",o:["A lead-free certificate","A 10-day opportunity to conduct a lead inspection, unless waived","A price reduction","A seller-paid abatement"],a:1,r:"Lead-based paint",e:"Ten days, or another agreed period, to test. The seller is not required to test or remove lead. Agents must ensure compliance and keep the signed disclosure for three years."},
{x:"N",c:"Property Disclosures",q:"A colorless, odorless radioactive gas that enters through foundation cracks is:",o:["Carbon monoxide","Radon","Formaldehyde","Asbestos"],a:1,r:"Environmental",e:"Radon comes from decaying uranium in soil and is a leading cause of lung cancer. It is found by testing and reduced with a mitigation system.",n:"Colorado's residential contract carries a radon disclosure, and sellers must disclose known test results and mitigation."},
{x:"N",c:"Property Disclosures",q:"Asbestos is most dangerous when it is:",o:["Encapsulated","Friable, meaning it crumbles and releases fibers","Painted","Buried"],a:1,r:"Environmental",e:"Intact asbestos is often best left alone or encapsulated. Disturbed, friable material releases fibers that cause lung disease."},
{x:"N",c:"Property Disclosures",q:"Under CERCLA (Superfund), liability for cleaning up hazardous waste is:",o:["Limited to the party who dumped it","Strict, joint and several, and retroactive, and can reach current owners","Capped at the purchase price","Covered by title insurance"],a:1,r:"CERCLA",e:"A current owner can be liable for contamination caused by a prior owner. Buyers of commercial sites use a Phase I environmental site assessment to establish the innocent landowner defense."},
{x:"N",c:"Property Disclosures",q:"An old gas station site most likely raises concern about:",o:["Radon","Leaking underground storage tanks","Lead paint","Urea formaldehyde"],a:1,r:"Environmental",e:"Underground storage tanks can leak petroleum into soil and groundwater."},
{x:"N",c:"Property Disclosures",q:"A lender requires flood insurance when a home securing a federally related loan is located in a:",o:["Wetland","Special flood hazard area","Coastal county","Riparian zone"],a:1,r:"Government disclosures",e:"FEMA maps special flood hazard areas (100-year floodplain). The National Flood Insurance Program makes coverage available."},
{x:"N",c:"Property Disclosures",q:"A listing agent sees a new bedroom addition and the assessor's record shows one fewer bedroom. The agent should:",o:["Ignore it","Treat it as a red flag and ask about permits and recommend the buyer verify","Change the listing to match the assessor","Have the seller remove the addition"],a:1,r:"Red flags",e:"Mismatched square footage or room counts suggest unpermitted work. Licensees are expected to notice red flags and recommend the right expert."},
{x:"N",c:"Property Disclosures",q:"A fence appears to sit well inside the neighbor's yard. The broker should recommend:",o:["A home inspection","A survey","A new appraisal","Title insurance only"],a:1,r:"Inspections and surveys",e:"Boundary and encroachment questions are answered by a survey."},
{x:"N",c:"Property Disclosures",q:"A property sold as is means:",o:["The seller need not disclose known defects","The seller will not make repairs, but known material defects must still be disclosed","The buyer may not inspect","No warranty of title is given"],a:1,r:"Seller disclosure",e:"As is addresses repairs, not honesty. Concealing a known latent defect is still misrepresentation."},
{x:"N",c:"Property Disclosures",q:"A buyer asks a licensee whether registered sex offenders live nearby. The appropriate response is to:",o:["Say there are none","Direct the buyer to the public registry or local law enforcement","Refuse to discuss it and end the showing","Check and report personally"],a:1,r:"Megan's Law",e:"Megan's Law makes registry information publicly available. Licensees point buyers to the source."},
{x:"N",c:"Property Disclosures",q:"Mold problems in a home are most often a sign of:",o:["Radon","A moisture or water intrusion problem","Lead in pipes","Faulty wiring"],a:1,r:"Environmental",e:"Mold needs moisture. A known water intrusion or mold history is a material fact."},

// ================= NATIONAL · VIII. PROPERTY MANAGEMENT (5%) =================
{x:"N",c:"Property Management",q:"A property manager's primary obligation to the owner is to:",o:["Keep rents as low as possible","Generate the highest net return while preserving the value of the property","Sell the building","Minimize the number of tenants"],a:1,r:"PM duties",e:"Maximize net income over the long run and protect the asset, within the law."},
{x:"N",c:"Property Management",q:"The document that creates the agency between an owner and a property manager is the:",o:["Lease","Management agreement","Rent roll","Operating budget"],a:1,r:"Management contract",e:"It names the parties and property, the term, the manager's authority and duties, reporting, fees and how funds are handled. The manager is usually a general agent."},
{x:"N",c:"Property Management",q:"A tenant in a wheelchair asks permission to install a ramp at the entry of a privately owned rental house at her own expense. The landlord:",o:["May refuse any alteration","Must permit the reasonable modification, and may require restoration of the interior at move-out where reasonable","Must pay for the ramp","May raise the rent"],a:1,r:"Fair housing in PM",e:"Fair Housing Act: reasonable modifications are at the tenant's expense in private housing; reasonable accommodations are changes in rules or policies, such as allowing an assistance animal despite a no-pets rule."},
{x:"N",c:"Property Management",q:"A building has a no-pets policy. A tenant with a disability requests to keep an assistance animal. The landlord must:",o:["Charge a pet deposit","Make a reasonable accommodation and may not charge pet fees","Deny the request","Require special training certificates"],a:1,r:"Fair housing in PM",e:"Assistance animals are not pets. The landlord can verify the disability-related need when it is not apparent, but cannot charge pet rent or deposits."},
{x:"N",c:"Property Management",q:"To set rents on a vacant building, a manager should first:",o:["Use last year's rents","Survey rents and vacancy for comparable properties in the market","Ask the owner's mortgage payment","Charge the maximum the law allows"],a:1,r:"Rent setting",e:"A market analysis of comparable space, vacancy rates and demand drives the rent schedule."},
{x:"N",c:"Property Management",q:"Screening rental applicants lawfully requires:",o:["Different income standards by household type","The same written criteria applied to every applicant","Preference for applicants without children","Asking about national origin"],a:1,r:"Tenant qualification",e:"Consistent, documented criteria (income, credit, rental history) are the defense against discrimination claims."},
{x:"N",c:"Property Management",q:"A property manager who buys insurance to cover a liability risk is using which risk management technique?",o:["Avoid","Control","Transfer","Retain"],a:2,r:"Risk management",e:"ACTOR: Avoid, Control, Transfer (insurance), Or Retain."},
{x:"N",c:"Property Management",q:"Tenant security deposits held by a property manager belong to:",o:["The manager until move-out","The tenants, and must be kept in a trust account separate from the manager's funds","The owner's operating account","The lender"],a:1,r:"Trust funds",e:"Deposits and rents are other people's money. Commingling or converting them is the fastest route to losing a license.",n:"Colorado: rents and security deposits go in separate trust accounts, deposited within five business days."},
{x:"N",c:"Property Management",q:"Which is an operating expense in a property's budget?",o:["Mortgage principal","Depreciation","Maintenance and repairs","The owner's income tax"],a:2,r:"Budgets and reports",e:"Operating expenses: management, utilities, repairs, taxes, insurance. Debt service, depreciation and income tax are not."},
{x:"N",c:"Property Management",q:"A landlord's implied promise that a residential unit is fit to live in is the:",o:["Covenant of quiet enjoyment","Warranty of habitability","Covenant of seisin","Right of reentry"],a:1,r:"Landlord and tenant",e:"Habitability: working heat, plumbing, safe structure. Quiet enjoyment: the tenant's possession will not be disturbed by the landlord or someone with superior title."},
{x:"N",c:"Property Management",q:"Under the ADA, a property manager of an office building must:",o:["Do nothing for buildings built before 1990","Remove architectural barriers in public areas where readily achievable","Rebuild to current code at once","Provide accommodations only for employees"],a:1,r:"ADA",e:"Title III covers public accommodations and commercial facilities. Existing buildings remove barriers when readily achievable; new construction and alterations must be accessible."},
{x:"N",c:"Property Management",q:"A landlord may lawfully remove a tenant who has not paid rent by:",o:["Changing the locks","Shutting off utilities","Following the court eviction process after proper notice","Removing the tenant's belongings"],a:2,r:"Landlord and tenant",e:"Self-help eviction is illegal. Notice, then a court action, then the sheriff."},

// ================= NATIONAL · IX. TRANSFER OF TITLE (6%) =================
{x:"N",c:"Transfer of Title",q:"Title to real property passes when the deed is:",o:["Signed by the grantor","Recorded","Delivered to and accepted by the grantee","Notarized"],a:2,r:"Deeds",e:"Delivery and acceptance during the grantor's lifetime transfer title. Recording gives notice to the world but is not what passes title."},
{x:"N",c:"Transfer of Title",q:"A valid deed must be signed by the:",o:["Grantee","Grantor","Both parties","Broker"],a:1,r:"Deeds",e:"Requirements: competent grantor, identifiable grantee, consideration, words of conveyance (granting clause), legal description, grantor's signature, delivery and acceptance. The grantee does not sign."},
{x:"N",c:"Transfer of Title",q:"Which deed gives the grantee the greatest protection?",o:["Quitclaim deed","Special warranty deed","General warranty deed","Bargain and sale deed"],a:2,r:"Types of deeds",e:"General warranty: the grantor warrants title against all defects, back to the beginning. Special warranty: only against defects arising during the grantor's ownership. Bargain and sale: implies ownership, no warranties. Quitclaim: no warranties at all."},
{x:"N",c:"Transfer of Title",q:"A deed that conveys whatever interest the grantor may have, if any, with no warranties, is a:",o:["Quitclaim deed","General warranty deed","Trustee's deed","Grant deed"],a:0,r:"Types of deeds",e:"Quitclaims are used to clear clouds on title, fix errors and transfer between family members or spouses."},
{x:"N",c:"Transfer of Title",q:"In a special warranty deed the grantor warrants title:",o:["Against all claims ever","Only against defects arising during the grantor's period of ownership","Not at all","Only against tax liens"],a:1,r:"Types of deeds",e:"Common from banks, relocation companies and fiduciaries."},
{x:"N",c:"Transfer of Title",q:"Recording a deed in the public records provides:",o:["Actual notice","Constructive notice","Marketable title","Title insurance"],a:1,r:"Recording",e:"Constructive (legal) notice: the world is deemed to know. Actual notice is what a person really knows. Possession also gives notice of the occupant's rights."},
{x:"N",c:"Transfer of Title",q:"A summary of every recorded document affecting a parcel is an:",o:["Abstract of title","Title policy","Affidavit of title","Chain letter"],a:0,r:"Title evidence",e:"The chain of title is the succession of owners. The abstract summarizes the chain plus liens and encumbrances. An attorney's opinion or a title policy interprets it."},
{x:"N",c:"Transfer of Title",q:"An owner's title insurance policy:",o:["Is paid monthly","Is paid once at closing and protects the owner as long as the owner or heirs have an interest","Covers defects that arise after closing","Protects only the lender"],a:1,r:"Title insurance",e:"Title insurance looks backward: it covers defects existing at the policy date. The lender's policy covers the loan balance and declines as the loan is paid."},
{x:"N",c:"Transfer of Title",q:"A standard owner's title policy typically does NOT cover:",o:["Forged deeds in the chain","Unrecorded liens and matters a survey would show","Improperly delivered deeds","Recording errors"],a:1,r:"Title insurance",e:"Standard coverage: record defects, forgery, incompetent grantors. Extended coverage adds unrecorded matters such as parties in possession, survey issues and unrecorded mechanic's liens."},
{x:"N",c:"Transfer of Title",q:"Title that is free of reasonable doubt, so that a prudent buyer would accept it, is:",o:["Insurable title","Marketable title","Equitable title","Color of title"],a:1,r:"Marketable title",e:"Marketable: no serious defects or litigation risk. Insurable: a title company will insure it, perhaps with exceptions."},
{x:"N",c:"Transfer of Title",q:"The court action used to remove a cloud and establish ownership is a suit to:",o:["Partition","Quiet title","Foreclose","Condemn"],a:1,r:"Title problems",e:"Quiet title settles competing claims. A partition suit divides or sells co-owned property."},
{x:"N",c:"Transfer of Title",q:"A person who dies with a valid will has died ___; real property left by will is a ___.",o:["Intestate; bequest","Testate; devise","Testate; legacy","Intestate; devise"],a:1,r:"Probate",e:"Testate = with a will. Intestate = without, so property passes by the state's laws of descent. Devise = real property by will; bequest or legacy = personal property."},
{x:"N",c:"Transfer of Title",q:"A person occupies another's land openly, continuously and without permission for the statutory period and gains title. This is:",o:["Escheat","Adverse possession","Accretion","Dedication"],a:1,r:"Involuntary alienation",e:"Open, notorious, hostile, exclusive and continuous. It is involuntary alienation, like foreclosure, eminent domain and escheat.",n:"Colorado: 18 years, or 7 with color of title and payment of taxes, plus a good faith belief of ownership."},
{x:"N",c:"Transfer of Title",q:"A lender approves a sale for less than the mortgage balance and releases its lien. This is a:",o:["Deed in lieu","Short sale","Foreclosure","Strict foreclosure"],a:1,r:"Special processes",e:"Short sales need lender approval, take time, and may leave the seller owing a deficiency or tax. Deed in lieu: the owner gives the deed to the lender to avoid foreclosure."},
{x:"N",c:"Transfer of Title",q:"Property a lender acquires at its own foreclosure sale and then markets is called:",o:["REO","HUD-1","PUD","FSBO"],a:0,r:"Special processes",e:"Real estate owned. REO sales are typically as is, with bank addenda and limited disclosures."},
{x:"N",c:"Transfer of Title",q:"For a deed to be recorded, in most states it must be:",o:["Witnessed by the broker","Acknowledged before a notary or authorized officer","Signed by the grantee","Approved by the lender"],a:1,r:"Recording",e:"Acknowledgment confirms the grantor signed voluntarily. An unacknowledged deed can be valid between the parties but generally cannot be recorded."},
{x:"N",c:"Transfer of Title",q:"A home warranty purchased at closing on a resale home typically covers:",o:["Structural defects for 10 years","Repair or replacement of major systems and appliances for about one year","Title defects","Flood damage"],a:1,r:"Warranties",e:"Home warranties are service contracts, usually one year. New construction comes with builder warranties on workmanship and structure."},

// ================= NATIONAL · X. PRACTICE OF REAL ESTATE (12%) =================
{x:"N",c:"Practice of Real Estate",q:"The federal Fair Housing Act protects against discrimination based on:",o:["Race, color, religion, national origin, sex, familial status and disability","Age, marital status and occupation","Source of income and military status","Race and religion only"],a:0,r:"Fair Housing Act",e:"Seven federal classes. Sex includes sexual orientation and gender identity. Age and marital status are ECOA classes, not federal fair housing classes.",n:"Colorado adds marital status, ancestry and creed, among others."},
{x:"N",c:"Practice of Real Estate",q:"The Civil Rights Act of 1866:",o:["Prohibits all racial discrimination in real and personal property, with no exceptions","Applies only to federally funded housing","Protects seven classes","Exempts owner-occupied duplexes"],a:0,r:"Civil Rights Act of 1866",e:"Race only, no exemptions, upheld in Jones v. Mayer (1968). Complaints go to federal court."},
{x:"N",c:"Practice of Real Estate",q:"Familial status protects:",o:["Married couples only","Households with a child under 18, pregnant women and people securing custody","People over 55","Single adults"],a:1,r:"Protected classes",e:"A landlord cannot refuse families with children or steer them to certain buildings, except in qualifying housing for older persons (55+ or 62+)."},
{x:"N",c:"Practice of Real Estate",q:"An agent tells homeowners that people of a certain ethnicity are moving in and they should sell before values drop. This is:",o:["Steering","Blockbusting","Redlining","Puffing"],a:1,r:"Prohibited conduct",e:"Blockbusting (panic selling): inducing sales by claiming a protected class is entering the area."},
{x:"N",c:"Practice of Real Estate",q:"A buyer's agent shows a family homes only in neighborhoods where people of their religion already live, without being asked. This is:",o:["Steering","Blockbusting","Redlining","Good service"],a:0,r:"Prohibited conduct",e:"Steering: channeling buyers toward or away from areas based on a protected class. Let the buyer set the criteria."},
{x:"N",c:"Practice of Real Estate",q:"A lender refuses to make loans in a neighborhood because of its racial makeup. This is:",o:["Steering","Redlining","Blockbusting","Underwriting"],a:1,r:"Prohibited conduct",e:"Redlining is refusing or limiting loans or insurance by area for discriminatory reasons."},
{x:"N",c:"Practice of Real Estate",q:"Which owner may be exempt from the federal Fair Housing Act?",o:["An owner-occupant of a four-unit building who rents the other units without a broker and without discriminatory advertising","A corporation renting 20 apartments","A broker renting her own duplex through her firm","Any owner who asks the tenant's religion"],a:0,r:"Exemptions",e:"The Mrs. Murphy exemption: owner-occupied, four units or fewer. Exemptions vanish if a broker is used or advertising is discriminatory, and none applies to race (1866 Act).",n:"Colorado's act is stricter and narrows these exemptions."},
{x:"N",c:"Practice of Real Estate",q:"A policy that looks neutral but disproportionately harms a protected class, without a legitimate business justification, is:",o:["Disparate treatment","Disparate impact","Steering","Lawful"],a:1,r:"Prohibited conduct",e:"Disparate treatment: treating people differently because of a protected class. Disparate impact: neutral rule, discriminatory effect."},
{x:"N",c:"Practice of Real Estate",q:"Which advertisement is most likely to violate the Fair Housing Act?",o:["Three-bedroom ranch near parks","Walk to St. Mary's church, ideal for Christian couple","Fenced yard, pets considered","Wheelchair accessible unit"],a:1,r:"Fair housing advertising",e:"Describe the property, not the people. Words indicating a preference for or against a protected class are prohibited. Describing accessibility features is fine."},
{x:"N",c:"Practice of Real Estate",q:"A fair housing complaint is filed with HUD within ___ of the alleged act; a private suit in federal court within ___.",o:["90 days; one year","One year; two years","Two years; one year","Six months; six months"],a:1,r:"Enforcement",e:"HUD: one year. Federal court: two years."},
{x:"N",c:"Practice of Real Estate",q:"Under the ADA, a real estate brokerage office open to the public is:",o:["Exempt as a small business","A place of public accommodation that must be accessible","Covered only if it has 50 employees","Covered only for employees"],a:1,r:"ADA",e:"Title III: public accommodations. Title I: employers with 15 or more employees."},
{x:"N",c:"Practice of Real Estate",q:"Two competing brokers agree over lunch to charge no less than 6%. This is:",o:["Market allocation","Price fixing","A tie-in","Legal if not written down"],a:1,r:"Antitrust",e:"Sherman Act violations: price fixing, group boycotts, market allocation, tying arrangements. Never discuss fees with competitors."},
{x:"N",c:"Practice of Real Estate",q:"Several brokers agree not to cooperate with a discount brokerage. This is a:",o:["Group boycott","Market allocation","Tying arrangement","Lawful business decision"],a:0,r:"Antitrust",e:"A group boycott is an agreement among competitors to refuse to deal with another."},
{x:"N",c:"Practice of Real Estate",q:"Two firms agree that one will work only north of the river and the other only south. This is:",o:["Price fixing","Market allocation","Steering","Redlining"],a:1,r:"Antitrust",e:"Dividing customers or territories among competitors is market allocation."},
{x:"N",c:"Practice of Real Estate",q:"For federal tax purposes a real estate licensee is treated as an independent contractor when the licensee is licensed, is paid based on sales output rather than hours, and:",o:["Works from home","Has a written contract stating the licensee is not treated as an employee for tax purposes","Pays the broker a desk fee","Works fewer than 30 hours a week"],a:1,r:"Employment status",e:"The IRS statutory nonemployee test: license, output-based pay, written agreement. The broker still supervises compliance with license law either way."},
{x:"N",c:"Practice of Real Estate",q:"Under the National Do Not Call rules, a licensee may call a number on the registry if:",o:["The call is made before 9 p.m.","The licensee has an established business relationship, within 18 months of the last transaction","The owner's listing has expired with another firm","The number is a cell phone"],a:1,r:"Do Not Call",e:"Exceptions: established business relationship (18 months after a transaction, 3 months after an inquiry) or written permission. Calling a FSBO to solicit a listing is not exempt; calling on behalf of an actual buyer is. Firms scrub lists against the registry every 31 days."},
{x:"N",c:"Practice of Real Estate",q:"Commercial email sent by a licensee must, under CAN-SPAM, include:",o:["The recipient's consent form","A working opt-out method and the sender's physical postal address","A fair housing logo","The licensee's commission rate"],a:1,r:"Internet communication",e:"No deceptive subject lines, identify the message as an ad, include a postal address and honor opt-outs promptly."},
{x:"N",c:"Practice of Real Estate",q:"A licensee posts a listing on social media. The post must:",o:["Be approved by the MLS","Be truthful, current, and identify the brokerage as state rules require","Include the seller's name","Avoid mentioning price"],a:1,r:"Social media advertising",e:"Online advertising is still advertising: accurate, not misleading, firm identified, and with the owner's permission.",n:"Colorado Rule 6.10: firm name on every viewable page or within one click."},
{x:"N",c:"Practice of Real Estate",q:"A client's Social Security number and bank statements in a transaction file must be:",o:["Shared with cooperating brokers on request","Safeguarded and disposed of securely","Posted to the MLS","Kept on the licensee's personal phone unprotected"],a:1,r:"Confidential information",e:"Licensees must protect personal information in any form and follow the firm's data security and disposal policy. Wire fraud warnings belong in every transaction."},
{x:"N",c:"Practice of Real Estate",q:"A licensee uses a buyer's earnest money to cover an office bill, intending to replace it Friday. This is:",o:["Commingling","Conversion","A permitted advance","Novation"],a:1,r:"Handling funds",e:"Conversion: using trust money for any purpose other than its own. Commingling: mixing it with business or personal funds. Both are grounds for discipline."},
{x:"N",c:"Practice of Real Estate",q:"A broker's responsibility for unlicensed assistants and affiliated licensees is to:",o:["Pay them on time only","Supervise them and ensure compliance with license law","Let each work independently","Review only closed files"],a:1,r:"Supervision",e:"The supervising broker answers for the firm's licensees, teams and unlicensed staff. Unlicensed assistants may not do anything requiring a license."},
{x:"N",c:"Practice of Real Estate",q:"A licensee is asked about roof condition and has no knowledge. The licensee should:",o:["Say it looks fine","Say they do not know and recommend an inspection by a qualified professional","Guess its age","Repeat what a neighbor said as fact"],a:1,r:"Due diligence",e:"Do not guess and do not act outside your expertise. Recommend the right expert and verify what you can."},
{x:"N",c:"Practice of Real Estate",q:"Protections against housing discrimination based on sexual orientation and gender identity are enforced by HUD under the Fair Housing Act's protected class of:",o:["Familial status","Sex","Disability","National origin"],a:1,r:"Protected classes",e:"HUD treats discrimination because of sexual orientation or gender identity as sex discrimination."}
);

// ================= NATIONAL · XI. REAL ESTATE CALCULATIONS (6%) =================
{x:"N",c:"Calculations",m:1,q:"A home sells for $425,000 at a 6% commission. The listing firm and selling firm split it 50/50. The listing agent receives 70% of her firm's share. She earns:",o:["$8,925","$12,750","$17,850","$25,500"],a:0,r:"Commission splits",e:"$425,000 x 0.06 = $25,500 total. Half to the listing firm = $12,750. 70% of that = $8,925. Work the chain one step at a time."},
{x:"N",c:"Calculations",m:1,q:"A seller wants to net $300,000 after paying a 6% commission and $4,200 in closing costs. The minimum sale price, to the nearest dollar, is:",o:["$318,000","$322,452","$323,617","$324,200"],a:2,r:"Net to seller · price needed",e:"Add the fixed costs to the net, then divide by (1 - commission rate): ($300,000 + $4,200) / 0.94 = $323,617. Multiplying by 1.06 is the classic wrong answer."},
{x:"N",c:"Calculations",m:1,q:"Sale price $350,000. Commission 6%. Loan payoff $198,000. Other seller costs $2,800. Seller's net proceeds:",o:["$128,200","$131,000","$149,200","$152,000"],a:0,r:"Seller net",e:"$350,000 - $21,000 - $198,000 - $2,800 = $128,200."},
{x:"N",c:"Calculations",m:1,q:"A buyer pays $360,000 with 10% down. Closing costs are 3% of the loan amount. The buyer already paid $5,000 earnest money. Additional cash needed at closing:",o:["$36,000","$40,720","$41,800","$45,720"],a:1,r:"Buyer funds at closing",e:"Down payment $36,000. Loan $324,000 x 0.03 = $9,720 costs. $36,000 + $9,720 - $5,000 already deposited = $40,720."},
{x:"N",c:"Calculations",m:1,q:"The first month's interest on a $280,000 loan at 6.5% annual interest is:",o:["$1,516.67","$1,820.00","$18,200.00","$1,400.00"],a:0,r:"Interest",e:"Annual interest = $280,000 x 0.065 = $18,200. Divide by 12 = $1,516.67."},
{x:"N",c:"Calculations",m:1,q:"A $240,000 loan at 6% has a monthly principal and interest payment of $1,438.92. After the first payment the loan balance is:",o:["$238,561.08","$238,800.00","$239,761.08","$239,981.08"],a:2,r:"Amortization",e:"First month interest = $240,000 x 0.06 / 12 = $1,200. Principal = $1,438.92 - $1,200 = $238.92. New balance = $239,761.08."},
{x:"N",c:"Calculations",m:1,q:"Principal and interest are $1,650 per month. Annual property taxes are $3,900 and annual homeowner's insurance is $1,500. The monthly PITI payment is:",o:["$1,975","$2,100","$2,150","$7,050"],a:1,r:"PITI",e:"Taxes $3,900 / 12 = $325. Insurance $1,500 / 12 = $125. $1,650 + $325 + $125 = $2,100."},
{x:"N",c:"Calculations",m:1,q:"A home is under contract for $400,000 and appraises at $410,000. The lender will loan 90%. The required down payment is:",o:["$36,000","$40,000","$41,000","$50,000"],a:1,r:"LTV",e:"Lenders use the lower of price or appraised value: 90% x $400,000 = $360,000 loan, so $40,000 down."},
{x:"N",c:"Calculations",m:1,q:"On a $320,000 loan the lender charges a 1% origination fee and 1.5 discount points. Total charge:",o:["$3,200","$4,800","$8,000","$80,000"],a:2,r:"Points and fees",e:"2.5% of the loan amount: $320,000 x 0.025 = $8,000."},
{x:"N",c:"Calculations",m:1,q:"An investor pays $900,000 for a building with net operating income of $63,000. The capitalization rate is:",o:["6%","7%","8%","14.3%"],a:1,r:"Cap rate · IRV",e:"Rate = Income / Value = $63,000 / $900,000 = 7%."},
{x:"N",c:"Calculations",m:1,q:"Potential gross income is $150,000, vacancy and collection loss is 5%, and operating expenses are $52,500. At an 8% cap rate the value is:",o:["$1,125,000","$1,218,750","$1,781,250","$1,875,000"],a:0,r:"Income approach",e:"EGI = $150,000 - $7,500 = $142,500. NOI = $142,500 - $52,500 = $90,000. Value = $90,000 / 0.08 = $1,125,000."},
{x:"N",c:"Calculations",m:1,q:"A home is worth $520,000 and has a loan balance of $337,500. The owner's equity is:",o:["$182,500","$337,500","$520,000","$857,500"],a:0,r:"Equity",e:"Equity = value - debt."},
{x:"N",c:"Calculations",m:1,q:"A property has an assessed value of $60,000 and the tax rate is 72 mills. Annual taxes are:",o:["$432","$4,320","$43,200","$8,333"],a:1,r:"Property tax",e:"A mill is one-thousandth of a dollar. 72 mills = 0.072. $60,000 x 0.072 = $4,320."},
{x:"N",c:"Calculations",m:1,q:"A state charges a transfer tax of $1.10 per $1,000 of price or fraction thereof. On a $287,300 sale the tax is:",o:["$315.70","$316.03","$316.80","$3,160.30"],a:2,r:"Transfer fees",e:"Or fraction thereof means round up: 287.3 becomes 288 units. 288 x $1.10 = $316.80.",n:"Colorado's documentary fee is $0.01 per $100 of consideration."},
{x:"N",c:"Calculations",m:1,q:"Annual taxes of $4,320 are paid in arrears. Closing is April 15, the seller is charged through the day of closing, and a 360-day year is used. The seller owes:",o:["$1,080","$1,248","$1,260","$1,440"],a:2,r:"Proration",e:"$4,320 / 360 = $12 per day. January through March = 90 days, plus 15 = 105 days. 105 x $12 = $1,260, debit seller and credit buyer. Read who owns the day of closing and which calendar every time."},
{x:"N",c:"Calculations",m:1,q:"A rectangular lot measures 120 feet by 150 feet and is priced at $6.50 per square foot. The price is:",o:["$11,700","$117,000","$175,500","$1,170,000"],a:1,r:"Area",e:"120 x 150 = 18,000 sq ft. 18,000 x $6.50 = $117,000."},
{x:"N",c:"Calculations",m:1,q:"A 2.5-acre parcel sells for $2.00 per square foot. The price is:",o:["$87,120","$108,900","$217,800","$435,600"],a:2,r:"Land measurement",e:"2.5 x 43,560 = 108,900 sq ft. x $2.00 = $217,800."},
{x:"N",c:"Calculations",m:1,q:"A home bought for $300,000 is now worth $345,000. It has appreciated by:",o:["13%","15%","45%","115%"],a:1,r:"Percent change",e:"Change / original = $45,000 / $300,000 = 15%."},
{x:"N",c:"Calculations",m:1,q:"An owner sold for $414,000, which was 15% more than she paid. She paid:",o:["$351,900","$360,000","$399,000","$476,100"],a:1,r:"Percent change",e:"Sale price = cost x 1.15, so cost = $414,000 / 1.15 = $360,000. Do not take 15% off the sale price."},
{x:"N",c:"Calculations",m:1,q:"An investor pays $200,000 cash for a property that produces $17,000 of annual net income. The rate of return is:",o:["8.5%","11.8%","17%","85%"],a:0,r:"Rate of return",e:"Return = income / investment = $17,000 / $200,000 = 8.5%."},
{x:"N",c:"Calculations",m:1,q:"A house is 40 ft by 30 ft with a 20 ft by 15 ft addition. At $210 per square foot its value is:",o:["$252,000","$294,000","$315,000","$378,000"],a:2,r:"Measuring structures",e:"1,200 + 300 = 1,500 sq ft. 1,500 x $210 = $315,000. Break odd shapes into rectangles."},
{x:"N",c:"Calculations",m:1,q:"A lender allows a housing expense ratio of 28%. A borrower with gross monthly income of $7,500 qualifies for a maximum PITI payment of:",o:["$1,875","$2,100","$2,700","$5,400"],a:1,r:"Qualifying ratios",e:"$7,500 x 0.28 = $2,100. The total debt ratio adds car loans, cards and other monthly debt."},
{x:"N",c:"Calculations",m:1,q:"A broker received $19,950 on a $285,000 sale. The commission rate was:",o:["6%","6.5%","7%","7.5%"],a:2,r:"Commission",e:"Rate = part / whole = $19,950 / $285,000 = 7%."},
{x:"N",c:"Calculations",m:1,q:"Office space of 2,400 square feet rents for $18 per square foot per year. The monthly rent is:",o:["$1,800","$3,600","$4,320","$43,200"],a:1,r:"Rent",e:"2,400 x $18 = $43,200 per year, / 12 = $3,600 per month. Commercial rent is quoted per square foot per year unless stated."},
