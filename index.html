  if(S.topic&&S.mode==="practice"){el.innerHTML=`<button class="chip" aria-pressed="true" data-cleartopic="1">Section: ${esc(TOPIC[S.topic].t)} <b>clear</b></button>`;return}
  el.innerHTML=`<button class="chip" aria-pressed="${ui.cat==="All"}" data-cat="All">All <b>${S.mode==="guide"?GUIDE.filter(t=>ui.exam==="B"||t.x===ui.exam).length+" sections":pool.length}</b></button>`+
    (S.mode==="guide"?"":`<button class="chip" aria-pressed="${ui.math}" data-math="1">Math only <b>${pool.filter(q=>q.m).length}</b></button>`)+
    catList().map(c=>`<button class="chip" aria-pressed="${ui.cat===c.name}" data-cat="${esc(c.name)}">${esc(c.name)} <b>${c.w}</b></button>`).join("");
}
$("#chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cleartopic){S.topic=null}else if(b.dataset.math){ui.math=!ui.math}else{ui.cat=b.dataset.cat}
  saveUi();start(S.mode)});
$("#examSeg").addEventListener("click",e=>{const b=e.target.closest("[data-exam]");if(!b)return;ui.exam=b.dataset.exam;
  if(ui.cat!=="All"&&!catList().some(c=>c.name===ui.cat))ui.cat="All";saveUi();start(S.mode)});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b)return;S.topic=null;go(b.dataset.mode)});
function go(mode){try{history.replaceState(null,"","#"+mode)}catch(e){}start(mode)}

function start(mode){
  clearInterval(S.timer);Object.assign(S,{mode,i:0,ans:{},flags:{},done:false,stats:{c:0,n:0},wrong:[],mock:null});
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  document.querySelectorAll("#examSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.exam===ui.exam));
  renderChips();
  if(mode==="practice"){S.pool=nextSet();renderPractice()}
  else if(mode==="missed"){S.pool=shuffle(BANK.filter(q=>missed.has(q.id)&&(ui.exam==="B"||q.x===ui.exam))).map(withOrder);renderPractice()}
  else if(mode==="mock")renderMockSetup();
  else if(mode==="progress")renderProgress();
  else if(mode==="guide")renderGuide();
  else renderSheet();
  window.scrollTo({top:0});

// ---------- PRACTICE ----------
// Unseen questions first, then ones last answered wrong, then the ones seen longest ago.
function nextSet(){
  const rank=q=>{const s=stats[q.id];if(!s)return 0;if(!s[2])return 1;return 2};
  const list=shuffle(filtered()).sort((a,b)=>rank(a)-rank(b)||((stats[a.id]||[0,0,0,0])[3]-(stats[b.id]||[0,0,0,0])[3]));
  return shuffle(list.slice(0,ui.size)).map(withOrder);
}
function qCard(q,chosen,reveal){
  const letters="ABCD";
  return `<article class="card">
    <div class="cat"><span>${esc(q.c)}</span><span class="badge ${q.x==="S"?"":"nat"}">${q.x==="S"?"COLORADO":"NATIONAL"}</span>${q.m?`<span class="badge math">MATH</span>`:""}</div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.ord.map((oi,k)=>{
      let cls="opt";
      if(reveal){if(oi===q.a)cls+=" right";else if(oi===chosen)cls+=" wrong"}
      else if(oi===chosen)cls+=" sel";
      return `<button class="${cls}" data-o="${oi}" ${reveal?"disabled":""}><span class="k">${letters[k]}</span><span>${esc(q.o[oi])}</span></button>`}).join("")}
    </div>
    ${reveal?`<div class="explain"><div class="line"><span class="ref">${esc(q.r)}</span><div><span class="verdict ${chosen===q.a?"ok":"no"}">${chosen===q.a?"Correct.":"Not quite."}</span> ${esc(q.e)}</div></div>${q.n?`<div class="conote"><b>Colorado</b>${esc(q.n)}</div>`:""}${studyLink(q,chosen!==q.a)}</div>`:""}
  </article>`;
}
function renderPractice(){
  if(!S.pool.length){main.innerHTML=`<div class="card empty">${S.mode==="missed"?"No missed questions saved. Miss one in Practice or a Mock and it lands here until you get it right.":"No questions match this filter."}</div>`;return}
  if(S.i>=S.pool.length){
    const pct=Math.round(S.stats.c/S.stats.n*100)||0;
    const left=filtered().filter(q=>!stats[q.id]).length;
    main.innerHTML=`<div class="card"><div class="cat">Set complete</div><p class="score ${pct>=75?"pass":"fail"}">${S.stats.c} / ${S.stats.n}</p>
      <p class="note">${pct}% this set. ${S.mode==="practice"?`${left} question${left===1?"":"s"} in this filter you have not seen yet. `:""}${missed.size} in your Missed pile.</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="again">${S.mode==="missed"?"Run missed again":"Next set"}</button>${missed.size&&S.mode!=="missed"?`<button class="btn ghost" id="toMissed">Drill missed</button>`:""}<button class="btn ghost" id="toProg">See weak spots</button></div></div>
      ${S.wrong.length?`<div class="card"><div class="cat">Review what you missed (${S.wrong.length})</div>${S.wrong.map(missRow).join("")}</div>`:""}`;
    $("#again").onclick=()=>start(S.mode);const tm=$("#toMissed");if(tm)tm.onclick=()=>go("missed");$("#toProg").onclick=()=>go("progress");return;
  }
  const q=S.pool[S.i],ch=S.ans[q.id],rev=ch!==undefined;
  main.innerHTML=`<div class="meta"><span class="num">Q ${S.i+1} / ${S.pool.length}</span>
    ${S.mode==="practice"?`<span>Set size <select id="size" class="inline-select" aria-label="Set size">${[5,10,20].map(n=>`<option ${ui.size===n?"selected":""}>${n}</option>`).join("")}</select></span>`:""}
    <span class="num">${S.stats.c} / ${S.stats.n} correct</span></div>
  ${qCard(q,ch,rev)}
  <div class="row"><span class="note">Keys: A to D to answer, Enter for next</span><span class="spacer"></span><button class="btn" id="next" ${rev?"":"disabled"}>${S.i+1===S.pool.length?"Finish set":"Next question"}</button></div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q,+b.dataset.o));
  const sz=$("#size");if(sz)sz.onchange=()=>{ui.size=+sz.value;saveUi();start("practice")};
  $("#next").onclick=nextQ;
}
function answer(q,o){if(S.ans[q.id]!==undefined)return;S.ans[q.id]=o;S.stats.n++;const ok=o===q.a;if(ok)S.stats.c++;else S.wrong.push({q,o});record(q,ok);renderPractice();$("#next").focus()}
function nextQ(){S.i++;renderPractice();window.scrollTo({top:0})}
const missRow=({q,o})=>`<div class="miss"><p><strong>${esc(q.q)}</strong></p><p class="note">You: ${o!==undefined?esc(q.o[o]):"no answer"} · Correct: <strong>${esc(q.o[q.a])}</strong></p><p><span class="ref">${esc(q.r)}</span> ${esc(q.e)}</p>${q.n?`<div class="conote"><b>Colorado</b>${esc(q.n)}</div>`:""}${studyLink(q,true)}</div>`;
const studyLink=(q,wrong)=>{const t=TOPIC[q.t];if(!t)return"";return `<div class="study ${wrong?"miss-it":""}"><span class="lbl">${wrong?"Read up before the next one":"Study guide"}</span><button class="linkbtn" data-topic="${t.id}">${esc(t.t)}</button></div>`};
document.addEventListener("keydown",e=>{
  if(!$("#drawer").hidden){if(e.key==="Escape")closeTopic();return}
  if(e.target.matches("input,select,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.mode!=="practice"&&S.mode!=="missed"&&!(S.mode==="mock"&&S.mock&&!S.done))return;
  const q=S.pool[S.i];if(!q)return;
  const k=e.key.toLowerCase(),idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);
  if(idx>=0&&idx<q.ord.length&&k.length===1){if(S.mode==="mock"){S.ans[q.id]=q.ord[idx];renderMock()}else answer(q,q.ord[idx])}
  else if(e.key==="Enter"&&S.mode!=="mock"&&S.ans[q.id]!==undefined){e.preventDefault();nextQ()}
});

// ---------- MOCK ----------
function quota(x,n){ // weight the draw like the real outline
  const cats=EX[x].cats,tot=EX[x].q;let rows=cats.map(c=>({c:c[0],f:c[1]*n/tot}));rows.forEach(r=>r.k=Math.floor(r.f));
  let rem=n-rows.reduce((a,r)=>a+r.k,0);rows.slice().sort((a,b)=>(b.f-b.k)-(a.f-a.k)).slice(0,rem).forEach(r=>r.k++);return rows}
function drawMock(x,n){let out=[];quota(x,n).forEach(r=>{out=out.concat(shuffle(BANK.filter(q=>q.x===x&&q.c===r.c)).slice(0,r.k))});return shuffle(out).map(withOrder)}
function renderMockSetup(){
  const opts=[];["N","S"].forEach(x=>{if(ui.exam!=="B"&&ui.exam!==x)return;const e=EX[x];
    opts.push({x,n:e.q,min:e.min,label:`${e.name} · full exam · ${e.q} questions · ${e.min} min`});
    const h=Math.round(e.q/2);opts.push({x,n:h,min:Math.round(e.min/2),label:`${e.name} · half exam · ${h} questions · ${Math.round(e.min/2)} min`})});
  main.innerHTML=`<div class="card"><div class="cat">Timed mock</div>
  <p class="q">Closed book, no feedback until you submit, and the clock runs at the real pace of 90 seconds a question. Questions are drawn in the same proportions as the PSI outline.</p>
  <label class="fld" for="mockPick">Exam<select id="mockPick">${opts.map((o,i)=>`<option value="${i}">${o.label}</option>`).join("")}</select></label>
  <div class="row" style="margin-top:14px"><button class="btn" id="go">Start the clock</button></div>
  <p class="note" style="margin-top:12px">Passing is 60 of 80 on the national portion and 53 of 74 on the Colorado portion. The real exam adds 5 to 10 unscored trial questions that still use your time, so finish these with minutes to spare.</p></div>
  ${mocks.length?`<div class="card"><div class="cat" style="margin-bottom:6px">Mock history</div><div class="tbl"><table><thead><tr><th>Date</th><th>Exam</th><th>Score</th><th>Needed</th><th>Result</th></tr></thead><tbody>${mocks.slice(-10).reverse().map(m=>`<tr><td class="n">${esc(m.d)}</td><td>${EX[m.x].name}</td><td class="n">${m.c}/${m.n}</td><td class="n">${m.p}</td><td class="${m.c>=m.p?"pass":"fail"}"><strong>${m.c>=m.p?"Pass":"Short by "+(m.p-m.c)}</strong></td></tr>`).join("")}</tbody></table></div></div>`:""}`;
  $("#go").onclick=()=>{const o=opts[+$("#mockPick").value];S.mock=o;S.pool=drawMock(o.x,o.n);S.total=o.min*60000;S.end=Date.now()+S.total;S.timer=setInterval(tick,1000);renderMock()};
}
function tick(){const left=S.end-Date.now();const t=$("#clock");if(t){t.textContent=fmt(left);
  const un=S.pool.length-Object.keys(S.ans).length;t.classList.toggle("behind",left<un*(S.total/S.pool.length)*0.85)}
  if(left<=0)submitMock()}
function renderMock(){
  const q=S.pool[S.i],ch=S.ans[q.id],answered=Object.keys(S.ans).length;
  main.innerHTML=`<div class="meta"><span class="num">Q ${S.i+1} / ${S.pool.length} · ${answered} answered</span><span class="timer" id="clock">${fmt(S.end-Date.now())}</span></div>
  ${qCard(q,ch,false)}
  <div class="row"><button class="btn ghost" id="prev" ${S.i?"":"disabled"}>Back</button><button class="btn ghost" id="flag">${S.flags[q.id]?"Unflag":"Flag for review"}</button><span class="spacer"></span>${S.i+1<S.pool.length?`<button class="btn" id="nx">Next</button>`:`<button class="btn" id="sub">Submit exam</button>`}</div>
  <div class="card"><div class="cat" style="margin-bottom:8px">Answer sheet</div><div class="grid">${S.pool.map((p,k)=>`<button class="cell ${S.ans[p.id]!==undefined?"done":""} ${k===S.i?"cur":""} ${S.flags[p.id]?"flag":""}" data-k="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
  ${S.i+1<S.pool.length?`<div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" id="sub2">Submit early</button></div>`:""}</div>`;
  tick();
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[q.id]=+b.dataset.o;renderMock()});
  main.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;renderMock()});
  $("#prev").onclick=()=>{S.i--;renderMock()};
  $("#flag").onclick=()=>{S.flags[q.id]=!S.flags[q.id];renderMock()};
  const nx=$("#nx");if(nx)nx.onclick=()=>{S.i++;renderMock()};
  const sb=$("#sub")||$("#sub2");if(sb)sb.onclick=confirmSubmit;
}
function confirmSubmit(){
  const un=S.pool.length-Object.keys(S.ans).length;if(!un)return submitMock();
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<p class="q">${un} question${un>1?"s are":" is"} unanswered and will be marked wrong. Submit anyway?</p><div class="row"><button class="btn" id="yes">Submit</button><button class="btn ghost" id="no">Keep working</button></div>`;
  main.prepend(card);card.scrollIntoView({block:"start"});$("#yes").onclick=submitMock;$("#no").onclick=renderMock;
}
function submitMock(){
  clearInterval(S.timer);if(S.done)return;S.done=true;
  const x=S.mock.x,by={};let c=0;const wrong=[];
  S.pool.forEach(q=>{by[q.c]=by[q.c]||{c:0,n:0};by[q.c].n++;const ok=S.ans[q.id]===q.a;if(ok){c++;by[q.c].c++}else wrong.push({q,o:S.ans[q.id]});if(S.ans[q.id]!==undefined)record(q,ok)});
  const n=S.pool.length,need=passMark(x,n),used=Math.min(S.total,S.total-(S.end-Date.now()));
  mocks.push({d:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),x,c,n,p:need});mocks=mocks.slice(-30);store.set("cobx-mocks",mocks);
  main.innerHTML=`<div class="card"><div class="cat">${EX[x].name} mock result</div>
   <p class="score ${c>=need?"pass":"fail"}">${c} / ${n}</p>
   <p class="note">${c>=need?`Pass. You needed ${need}.`:`Not yet. You needed ${need}, so you are ${need-c} short.`} Time used ${fmt(used)} of ${fmt(S.total)}.</p></div>
  <div class="card"><div class="cat" style="margin-bottom:6px">By outline area, weakest first</div><div class="tbl"><table><thead><tr><th>Area</th><th>Score</th><th style="width:34%"></th></tr></thead><tbody>
   ${Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.c}/${v.n}</td><td><div class="meter"><i class="${v.c/v.n<.7?"low":"ok"}" style="width:${v.c/v.n*100}%"></i></div></td></tr>`).join("")}
   </tbody></table></div></div>
  <div class="card"><div class="cat">Missed (${wrong.length})</div>${wrong.length?wrong.map(missRow).join(""):`<p class="note">Clean sheet.</p>`}
   <div class="row" style="margin-top:12px"><button class="btn" id="re">New mock</button>${wrong.length?`<button class="btn ghost" id="dm">Drill missed</button>`:""}</div></div>`;
  $("#re").onclick=()=>start("mock");const dm=$("#dm");if(dm)dm.onclick=()=>go("missed");window.scrollTo({top:0});
}

// ---------- WEAK SPOTS ----------
function domainRows(x){
  return EX[x].cats.map(c=>{const qs=BANK.filter(q=>q.x===x&&q.c===c[0]);let seen=0,right=0;
    qs.forEach(q=>{const s=stats[q.id];if(s){seen++;if(s[2])right++}});
    return {x,name:c[0],w:c[1],label:c[2],total:qs.length,seen,right,pct:seen?right/seen:null}});
}
function renderProgress(){
  const xs=exams();let html="";
  const answered=Object.keys(stats).filter(id=>BYID[id]).length;
  if(!answered){main.innerHTML=`<div class="card"><div class="cat">Weak spots</div><p class="q">Nothing to score yet.</p><p class="note">This page tracks your most recent answer on every question and ranks the outline areas by how you are doing. Run a few practice sets across all areas and your weakest two or three will show up here.</p><div class="row" style="margin-top:12px"><button class="btn" id="st">Start practicing</button></div></div>${xferCard()}`;$("#st").onclick=()=>go("practice");bindXfer();return}
  xs.forEach(x=>{
    const rows=domainRows(x),e=EX[x],passPct=e.pass/e.q;
    const scored=rows.filter(r=>r.seen>=3);
    const wsum=scored.reduce((a,r)=>a+r.w,0);
    const est=wsum?scored.reduce((a,r)=>a+r.w*r.pct,0)/wsum:null;
    const seen=rows.reduce((a,r)=>a+r.seen,0),total=rows.reduce((a,r)=>a+r.total,0);
    const weak=scored.slice().sort((a,b)=>a.pct-b.pct).filter(r=>r.pct<0.8).slice(0,3);
    html+=`<section class="card"><h2>${e.name} portion</h2>
      <div class="tiles" style="margin:10px 0 14px">
        <div class="tile"><div class="big ${est===null?"":est>=passPct?"pass":"fail"}">${est===null?"n/a":Math.round(est*e.q)+" / "+e.q}</div><div class="lbl">Projected score, weighted like the exam. Need ${e.pass}.</div></div>
        <div class="tile"><div class="big">${seen} / ${total}</div><div class="lbl">Questions you have seen</div></div>
        <div class="tile"><div class="big">${wsum}/${e.q}</div><div class="lbl">Exam weight covered by areas with 3+ answers</div></div>
      </div>
      ${weak.length?`<p><strong>Work on these first:</strong> ${weak.map(r=>`${esc(r.name)} (${Math.round(r.pct*100)}%)`).join(", ")}.</p>`:scored.length?`<p><strong>No area is under 80% on what you have seen.</strong> Keep covering unseen questions.</p>`:""}
      <div class="tbl"><table><thead><tr><th>Outline area</th><th>Weight</th><th>Seen</th><th>Right now</th><th style="width:24%"></th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.label}</td><td class="n">${r.seen}/${r.total}</td><td class="n">${r.pct===null?"n/a":Math.round(r.pct*100)+"%"}</td>
        <td><div class="meter">${r.pct===null?"":`<i class="${r.pct<passPct?"low":"ok"}" style="width:${r.pct*100}%"></i>`}<u style="left:${passPct*100}%"></u></div></td>
        <td class="n"><button class="btn ghost small" data-drill="${esc(r.name)}" data-x="${x}">Drill</button> <button class="btn ghost small" data-study="${esc(r.name)}" data-x="${x}">Study</button></td></tr>`).join("")}
      </tbody></table></div>
      <p class="note" style="margin-top:8px">Right now = share of seen questions whose latest answer was correct. The tick on each bar is the passing line (${Math.round(passPct*100)}%).</p></section>`;
  });
  html+=`<div class="card"><div class="row"><span class="note">Progress is saved in this browser on this device only.</span><span class="spacer"></span><button class="btn ghost small" id="reset">Reset all progress</button></div><div id="resetBox"></div></div>`+xferCard();
  main.innerHTML=html;bindXfer();
  main.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>{ui.exam=b.dataset.x;ui.cat=b.dataset.drill;ui.math=false;saveUi();go("practice")});
  main.querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>{ui.exam=b.dataset.x;ui.cat=b.dataset.study;saveUi();go("guide")});
  $("#reset").onclick=()=>{$("#resetBox").innerHTML=`<div class="row" style="margin-top:10px"><span>Erase answers, missed pile and mock history?</span><button class="btn small" id="ry">Erase</button><button class="btn ghost small" id="rn">Cancel</button></div>`;
    $("#ry").onclick=()=>{stats={};missed=new Set();mocks=[];store.set("cobx-stats",stats);store.set("cobx-mocks",mocks);saveMissed();renderProgress()};$("#rn").onclick=()=>{$("#resetBox").innerHTML=""}};
}

// ---------- CHEAT SHEET ----------
function renderSheet(){
  main.innerHTML=`<input type="search" id="find" placeholder="Search a number, rule or term: 3 business days, Rule 6.10, earnest money, cap rate" aria-label="Search the cheat sheet"><div id="sheet"></div>`;
  const draw=()=>{const t=$("#find").value.trim().toLowerCase(),hit=s=>!t||s.toLowerCase().includes(t);let html="";

      KEY.filter(k=>ui.exam==="B"||k.x===ui.exam).forEach(k=>{const it=k.items.filter(i=>hit(i[0]+" "+i[1]+" "+k.g));
        if(it.length)html+=`<section class="card"><h2>${esc(k.g)}</h2><dl class="kv">${it.map(i=>`<dt>${esc(i[0])}</dt><dd>${esc(i[1])}</dd>`).join("")}</dl></section>`});
    }
    if(ui.cat==="All"||ui.math||["Calculations","Closing","Valuation","Financing"].includes(ui.cat)){
      const f=FORMULAS.filter(i=>hit(i[0]+" "+i[1]));if(f.length)html+=`<section class="card"><h2>Formulas</h2><dl class="kv">${f.map(i=>`<dt>${esc(i[0])}</dt><dd>${esc(i[1])}</dd>`).join("")}</dl></section>`;

    const groups={};list.forEach(q=>(groups[q.x+"|"+q.c]=groups[q.x+"|"+q.c]||[]).push(q));
    catList().forEach(c=>{const v=groups[c.x+"|"+c.name];if(!v)return;
      html+=`<section class="card"><h2>${esc(c.name)} <span class="badge ${c.x==="S"?"":"nat"}">${c.x==="S"?"COLORADO":"NATIONAL"}</span></h2>${v.slice().sort((a,b)=>a.r.localeCompare(b.r,undefined,{numeric:true})).map(q=>`<div class="fact"><span class="ref">${esc(q.r)}</span><span>${esc(q.e)}${q.n?` <em class="note">Colorado: ${esc(q.n)}</em>`:""}</span></div>`).join("")}</section>`});

// ---------- MOVE PROGRESS BETWEEN DEVICES ----------
const xferCard=()=>`<div class="card"><h2>Move progress between devices</h2><p class="note">Progress is saved separately in each browser and in each downloaded copy. To carry it over, show the code on one device and load it on the other. Loading merges; it keeps your newest answer on every question.</p>
  <div class="row" style="margin-top:8px"><button class="btn ghost small" id="xExp">Show my progress code</button><button class="btn ghost small" id="xImp">Load a progress code</button></div><div id="xferBox"></div></div>`;
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dec=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,"")))));
function bindXfer(){
  const box=$("#xferBox");
  $("#xExp").onclick=()=>{box.innerHTML=`<textarea id="xOut" readonly rows="4" aria-label="Your progress code" style="width:100%;margin-top:10px;font:500 .72rem var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn small" id="xCopy">Copy code</button><span class="note" id="xMsg">${Object.keys(stats).length} answered questions, ${missed.size} in the missed pile.</span></div>`;
    const ta=$("#xOut");ta.value=enc({v:1,stats,missed:[...missed],mocks});ta.onfocus=()=>ta.select();
    $("#xCopy").onclick=()=>{ta.select();const done=()=>$("#xMsg").textContent="Copied. Paste it into Load a progress code on the other device.";
      try{navigator.clipboard.writeText(ta.value).then(done,()=>{$("#xMsg").textContent="Select the code above and copy it by hand."})}catch(e){$("#xMsg").textContent="Select the code above and copy it by hand."}}};
  $("#xImp").onclick=()=>{box.innerHTML=`<textarea id="xIn" rows="4" placeholder="Paste a progress code here" aria-label="Paste a progress code" style="width:100%;margin-top:10px;font:500 .72rem var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn small" id="xLoad">Load and merge</button><span class="note" id="xMsg"></span></div>`;
    $("#xLoad").onclick=()=>{let d;try{d=dec($("#xIn").value);if(!d||typeof d.stats!=="object")throw 0}catch(e){$("#xMsg").textContent="That code did not load. Copy the whole code and try again.";return}
      let n=0;const theirs=new Set(d.missed||[]);
      Object.keys(d.stats).forEach(id=>{const a=d.stats[id],b=stats[id];if(!BYID[id]||!Array.isArray(a))return;
        if(!b||a[3]>b[3]){stats[id]=a;n++;if(theirs.has(id))missed.add(id);else missed.delete(id)}});
      const seen=new Set(mocks.map(m=>JSON.stringify(m)));(d.mocks||[]).forEach(m=>{if(m&&EX[m.x]&&!seen.has(JSON.stringify(m)))mocks.push(m)});mocks=mocks.slice(-30);
      store.set("cobx-stats",stats);store.set("cobx-mocks",mocks);saveMissed();renderProgress();
      const m=$("#xMsg")||document.createElement("span");$("#xferBox").innerHTML=`<p class="note" style="margin-top:10px">Loaded. ${n} newer answer${n===1?"":"s"} merged into this device.</p>`}};
}

// ---------- STUDY GUIDE ----------
function topicMastery(t){const qs=BANK.filter(q=>q.t===t.id);let seen=0,right=0;qs.forEach(q=>{const s=stats[q.id];if(s){seen++;if(s[2])right++}});return {n:qs.length,seen,right}}
function topicHTML(t,inDrawer){
  const m=topicMastery(t),qs=BANK.filter(q=>q.t===t.id);
  return `<div class="cat"><span>${esc(t.c)}</span><span class="badge ${t.x==="S"?"":"nat"}">${t.x==="S"?"COLORADO":"NATIONAL"}</span><span class="mastery">${m.seen?`${m.right}/${m.seen} right on your latest answers · ${m.n} questions`:`${m.n} questions, none answered yet`}</span></div>
  <h2 ${inDrawer?'id="drawerTitle"':""}>${esc(t.t)}</h2>
  <ul>${t.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
  ${t.trap?`<div class="trap"><b>Exam trap</b>${esc(t.trap)}</div>`:""}
  <h3>Where this is in your course text</h3>
  <ul class="srcs">${t.src.map(s=>`<li><span class="path">${esc(s.d)} › ${esc(s.ch)} › Page ${s.p} of ${s.of}</span>Find the heading <span class="find">“${esc(s.h)}”</span></li>`).join("")}</ul>
  <details class="rules"><summary>Every rule the question bank tests from this section (${qs.length})</summary>${qs.slice().sort((a,b)=>a.r.localeCompare(b.r,undefined,{numeric:true})).map(q=>`<div class="fact"><span class="ref">${esc(q.r)}</span><span>${esc(q.e)}${q.n?` <em class="note">Colorado: ${esc(q.n)}</em>`:""}</span></div>`).join("")}</details>
  <div class="row" style="margin-top:14px"><button class="btn ${inDrawer?"ghost":""} small" data-drilltopic="${t.id}">Drill these ${qs.length} questions</button></div>`;
}
function renderGuide(){
  main.innerHTML=`<input type="search" id="gfind" placeholder="Search the guide: earnest money, joint tenancy, proration, Rule 6.10" aria-label="Search the study guide">
  <p class="note">Each section teaches the rules behind a group of questions and tells you where to read more. Page numbers are the course's own markers inside each chapter (Page 5 of 9), so open that section's PDF and search for the quoted heading.</p><div id="glist"></div>`;
  const draw=()=>{const tq=$("#gfind").value.trim().toLowerCase();
    const list=GUIDE.filter(t=>(ui.exam==="B"||t.x===ui.exam)&&(ui.cat==="All"||t.c===ui.cat)&&(!tq||(t.t+" "+t.c+" "+t.notes.join(" ")+" "+t.trap+" "+t.src.map(s=>s.h+" "+s.ch).join(" ")+" "+BANK.filter(q=>q.t===t.id).map(q=>q.r+" "+q.e).join(" ")).toLowerCase().includes(tq)));
    $("#glist").innerHTML=list.length?list.map(t=>`<section class="card topic" id="t-${t.id}">${topicHTML(t,false)}</section>`).join(""):`<div class="card empty">No section matches "${esc(tq)}".</div>`};
  $("#gfind").addEventListener("input",draw);draw();
}
let lastFocus=null;
function openTopic(id){const t=TOPIC[id];if(!t)return;lastFocus=document.activeElement;
  $("#drawerBody").innerHTML=`<div class="drawer-top"><span class="note">Study guide</span><button class="btn small" id="drawerClose">${S.mode==="practice"||S.mode==="missed"?"Back to the question":"Close"}</button></div><div class="topic">${topicHTML(t,true)}</div>`;
  $("#drawer").hidden=false;document.body.style.overflow="hidden";const box=document.querySelector(".drawer-in");box.scrollTop=0;$("#drawerClose").focus()}
function closeTopic(){$("#drawer").hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-topic]");if(tb){openTopic(tb.dataset.topic);return}
  const dt=e.target.closest("[data-drilltopic]");if(dt){closeTopic();S.topic=dt.dataset.drilltopic;go("practice");return}
  if(e.target.id==="drawerClose"||e.target.id==="drawer")closeTopic();
});

// ---------- BOOT ----------
saveMissed();
const first=(location.hash||"").slice(1);
start(["practice","mock","missed","progress","guide","sheet"].includes(first)?first:"practice");
window.addEventListener("hashchange",()=>{const m=(location.hash||"").slice(1);if(["practice","mock","missed","progress","guide","sheet"].includes(m)&&m!==S.mode)start(m)});

</script>
