<style>
/* Layout: one study column; sticky bar with exam switch, mode tabs and domain chips; one card per question; statute and rule refs set like book tabs */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --ink:#1a2230; --muted:#5b6676; --line:#d6dae1;
  --accent:#234a84; --accent-ink:#ffffff; --tab:#e3eaf5;
  --good:#2f7a4a; --good-bg:#e6f2ea; --bad:#b03a2e; --bad-bg:#f8e6e3; --flag:#a8690f; --flag-bg:#fbf1dd;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --ink:#e6eaf0; --muted:#98a3b3; --line:#2b3544;
  --accent:#86b2ee; --accent-ink:#0d1420; --tab:#1e2a3d;
  --good:#6cc28c; --good-bg:#183224; --bad:#ec8576; --bad-bg:#3a1f1b; --flag:#e3b25a; --flag-bg:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --ink:#e6eaf0; --muted:#98a3b3; --line:#2b3544;
  --accent:#86b2ee; --accent-ink:#0d1420; --tab:#1e2a3d;
  --good:#6cc28c; --good-bg:#183224; --bad:#ec8576; --bad-bg:#3a1f1b; --flag:#e3b25a; --flag-bg:#33290f; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.facts{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.rowbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{font:600 .86rem var(--body);border:0;background:transparent;color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:3px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tab);color:var(--ink);border-color:var(--accent)}
.chip b{font-family:var(--mono);font-weight:500;font-size:.72rem;opacity:.8}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px}
.cat{font-family:var(--display);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;padding:1px 7px;border-radius:3px;background:var(--flag-bg);color:var(--flag);border:1px solid var(--flag)}
.badge.nat{background:var(--tab);color:var(--accent);border-color:var(--accent)}
.badge.math{background:transparent;color:var(--muted);border-color:var(--line)}
.q{font-size:1.1rem;font-weight:500;margin:8px 0 16px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:11px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px;min-width:1.2em}
.opt.sel{border-color:var(--accent);background:var(--tab)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}

.grid{display:flex;flex-wrap:wrap;gap:4px}

.tbl{overflow-x:auto}

h2{font-family:var(--display);font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
h3{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 4px;color:var(--accent)}

.linkbtn{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.topic h2{font-size:1.35rem;line-height:1.15;text-transform:none;letter-spacing:.01em;text-wrap:balance}

.trap{margin-top:12px;background:var(--flag-bg);border-left:3px solid var(--flag);padding:8px 12px;border-radius:0 3px 3px 0;max-width:68ch}
.trap b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--flag);margin-right:6px}
.srcs{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.srcs li{border-left:3px solid var(--accent);background:var(--tab);padding:7px 10px;font-size:.9rem}
.srcs .path{font-family:var(--mono);font-size:.76rem;color:var(--muted);display:block}
.srcs .find{font-weight:600}
details.rules{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.rules summary{cursor:pointer;font-weight:600;color:var(--accent)}
.mastery{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.55);display:flex;justify-content:flex-end}
.drawer-in{width:min(680px,100%);height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));outline:none}
.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:calc(-18px - env(safe-area-inset-top,0px));background:var(--surface);padding-block:10px;border-bottom:1px solid var(--line)}
@media (max-width:520px){.explain .line,.fact{flex-direction:column;gap:6px} h1{font-size:1.8rem} .ref{max-width:none} .kv{grid-template-columns:1fr} .kv dt{margin-top:6px}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}

<script>
const BANK=[];
BANK.push(
// ================= STATE · DUTIES AND POWERS OF THE COMMISSION (2 items) =================
{x:"S",c:"Commission",q:"The Colorado Real Estate Commission is made up of:",o:["Three members elected by licensees","Five members appointed by the governor","Seven members appointed by the Division director","Five members appointed by the legislature"],a:1,r:"C.R.S. 12-10-206",e:"Five commissioners, appointed by the governor, serving three-year terms. Do not confuse the Commission (appointed policy body) with the Division of Real Estate (civil-service staff inside DORA)."},
{x:"S",c:"Commission",q:"Which describes the required makeup of the Real Estate Commission?",o:["Five brokers with at least two years of experience","Three brokers with five-plus years of experience and two members of the public","Four brokers and one attorney","Two brokers, two public members and one appraiser"],a:1,r:"C.R.S. 12-10-206",e:"Three brokers with at least five years of experience (one must have property management experience) plus two public members who are not in real estate."},
{x:"S",c:"Commission",q:"Commissioners serve terms of:",o:["Two years","Three years","Four years","Six years"],a:1,r:"C.R.S. 12-10-206",e:"Three-year terms. Easy pairing: licenses renew on a three-year cycle, commissioners serve three-year terms."},
{x:"S",c:"Commission",q:"The maximum fine the Commission may assess for a license law violation is:",o:["$500 per offense","$1,000 per offense","$2,500 per offense","$10,000 per offense"],a:2,r:"C.R.S. 12-10-217",e:"Up to $2,500 per offense, and fines can be stacked for multiple offenses. The Commission can also censure, place on probation, suspend or revoke."},
{x:"S",c:"Commission",q:"A broker facing revocation is entitled to a hearing. Who conducts the hearing, and who makes the final decision to revoke?",o:["The Division director conducts it and decides","An administrative law judge conducts it; only the Commission may revoke","A district court judge conducts it and decides","The employing broker conducts it; the Commission decides"],a:1,r:"C.R.S. 12-10-219",e:"A public hearing before an administrative law judge. Only the Commission itself may deny, suspend or revoke a license."},
{x:"S",c:"Commission",q:"Performing acts that require a real estate license without an active Colorado license is:",o:["A civil infraction handled by the Division","A class 2 misdemeanor","A class 6 felony","Not an offense unless a consumer is harmed"],a:1,r:"C.R.S. 12-10-223",e:"Unlicensed practice is a criminal offense: a class 2 misdemeanor, punishable by fine and/or jail. (A subdivision developer who fails to register commits a class 6 felony, a different statute.)"},
{x:"S",c:"Commission",q:"The primary purpose of the Colorado real estate license law is to:",o:["Raise revenue for the state","Limit the number of licensees","Protect the public","Set commission rates"],a:2,r:"C.R.S. Title 12, Art. 10",e:"The license law exists to protect the public by setting standards of competency and integrity. The Commission does not set or regulate commission rates."},
{x:"S",c:"Commission",q:"After a license is permanently revoked, the former licensee may not reapply for:",o:["Six months","One year","Three years","Five years"],a:1,r:"C.R.S. 12-10-217",e:"One year, and any unpaid fines must be paid first."},
{x:"S",c:"Commission",q:"The Commission may begin an investigation of a licensee:",o:["Only after a court finds a violation","Only when the employing broker requests it","On its own motion or on a written complaint","Only when a consumer has lost money"],a:2,r:"C.R.S. 12-10-217",e:"The Commission may investigate on its own motion and must investigate on a written complaint. It can subpoena witnesses and records and can ask a court for an injunction."},
{x:"S",c:"Commission",q:"A broker buys a rental house for herself, not for a client, and misleads the seller. Under Seibel v. Colorado Real Estate Commission, the Commission:",o:["Has no authority because she acted as a principal","May discipline her; licensees are under Commission oversight even on their own deals","May discipline her only if a commission was paid","Must refer the matter to the Attorney General"],a:1,r:"Seibel v. CREC",e:"A licensee acting on their own behalf is still subject to the license law. That is also why Rule 6.17 requires written disclosure of licensed status in your own transactions."},
{x:"S",c:"Commission",q:"Commission Position Statements are best described as:",o:["Statutes passed by the legislature","Binding court decisions","The Commission's guidance on how it interprets the law and rules","Optional marketing guidelines from the Association of REALTORS"],a:2,r:"Position Statements",e:"Position statements (CP-1 through CP-31 in your course) explain how the Commission reads the statutes and rules on recurring practice issues such as referral fees, earnest money and assistants."},

// ================= STATE · LICENSING REQUIREMENTS (5 items) =================
{x:"S",c:"Licensing",q:"The minimum age to hold a Colorado real estate broker license is:",o:["18","19","21","No minimum"],a:0,r:"C.R.S. 12-10-203",e:"18 years old and of good moral character. There is no age limit on sitting for the exam itself."},
{x:"S",c:"Licensing",q:"A brand-new applicant with no prior license must complete how many hours of prelicense education?",o:["72","120","168","180"],a:2,r:"Rule 2.1",e:"168 hours: Law and Practice 48, Contracts and Regulations 48, Closings 24, Trust Accounts 8, Current Legal Issues 8, Practical Applications 32. A degree with a real estate major is the alternative."},
{x:"S",c:"Licensing",q:"Before a newly licensed broker may work as an independent broker, the broker must practice as an associate broker under an employing broker for at least:",o:["One year","Two years","Three years","Five years"],a:1,r:"Rule 2.5 / 2.7",e:"Two years of active experience at the associate level. During that time the employing broker owes a high level of supervision."},
{x:"S",c:"Licensing",q:"To become an employing broker, a broker with the required experience must also complete:",o:["A second licensing exam","A 24-hour Brokerage Administration course","A 48-hour Trust Accounts course","A college degree in real estate"],a:1,r:"Rule 2.8",e:"The 24-hour Brokerage Administration course, plus two years of active licensure within the last five years."},
{x:"S",c:"Licensing",q:"Passing scores on the national and state portions of the licensing exam are valid for:",o:["Six months","One year","Two years","Three years"],a:1,r:"Rule 2.2",e:"One year. You must apply for the license within a year of passing or retest. If you fail one portion you retake only that portion."},
{x:"S",c:"Licensing",q:"An applicant's fingerprints are submitted to which agency, and when?",o:["The FBI, after the license is issued","The Colorado Bureau of Investigation, before submitting the license application","The Division of Real Estate, at renewal","The county sheriff, within 30 days of licensure"],a:1,r:"Rule 2.3",e:"Fingerprints go to the CBI for a state and national criminal history check before the application is filed."},
{x:"S",c:"Licensing",q:"A broker's initial license is issued on August 10. It expires:",o:["August 10 of the following year","December 31 of the year it was issued","December 31 three years later","August 10 three years later"],a:1,r:"Rule 3.11 / C.R.S. 12-10-212",e:"The first license always expires December 31 of the year of issue. After that, renewal is on a three-year calendar cycle (Jan 1 of year one to Dec 31 of year three)."},
{x:"S",c:"Licensing",q:"How many hours of continuing education are required in each three-year license cycle?",o:["12","18","24","36"],a:2,r:"Rule 4.1 / 4.2",e:"24 hours. 12 of them are three different 4-hour Annual Commission Update courses (one per year); the other 12 are electives."},
{x:"S",c:"Licensing",q:"The Annual Commission Update course is:",o:["Four hours, taken each year, with a 70% passing score on the exam","Eight hours, taken once per cycle","Twelve hours, taken in the renewal year only","Optional if 24 elective hours are completed"],a:0,r:"Rule 4.3",e:"Four hours, a different version each year, 70% to pass. Three of them supply 12 of the 24 hours."},
{x:"S",c:"Licensing",q:"A broker forgets to renew. The license may be reinstated without a penalty fee within:",o:["10 days","31 days","60 days","One year"],a:1,r:"Rule 3.15",e:"31 days with no penalty. Up to one year: renewal fee plus a reinstatement fee of half the renewal fee. One to three years: renewal fee plus a reinstatement fee equal to the renewal fee."},
{x:"S",c:"Licensing",q:"Minimum errors and omissions coverage under the Commission's rule is:",o:["$50,000 per claim / $100,000 aggregate","$100,000 per claim / $300,000 annual aggregate","$250,000 per claim / $500,000 aggregate","$1,000,000 per claim"],a:1,r:"Rule 3.9",e:"$100,000 per covered claim and $300,000 annual aggregate per license. The group policy may carry a $1,000 deductible but none for defense costs."},
{x:"S",c:"Licensing",q:"Who must carry errors and omissions insurance?",o:["Employing brokers only","Only brokers who hold trust funds","Every active licensee","Every licensee, active or inactive"],a:2,r:"C.R.S. 12-10-204 / Rule 3.9",e:"Every active license, individual and entity. If coverage lapses the Commission may place the license on inactive status."},
{x:"S",c:"Licensing",q:"Which person does NOT need a real estate license?",o:["A person who negotiates leases for several owners for a fee","A regularly salaried on-site manager of an apartment complex","A person paid a fee to find buyers for a builder's homes","An auctioneer who negotiates the sale of real estate for a seller"],a:1,r:"C.R.S. 12-10-201(6)(b)",e:"The salaried on-site apartment manager is exempt. Managing or negotiating for others for compensation otherwise requires a license."},
{x:"S",c:"Licensing",q:"Which of these is exempt from licensing?",o:["An attorney-in-fact paid a commission under a power of attorney","An uncompensated attorney-in-fact acting under a recorded power of attorney","A friend paid a finder's fee for locating a buyer","An out-of-state broker listing Colorado property on their own"],a:1,r:"C.R.S. 12-10-201(6)(b)",e:"The attorney-in-fact exemption requires no compensation and a recorded power of attorney. Other exemptions: owners acting for themselves, public officials, trustees/executors/guardians, attorneys practicing law, and oil, gas and mineral lease dealers."},
{x:"S",c:"Licensing",q:"If an employing broker's license expires or is revoked, the licenses of the associate brokers in the firm:",o:["Are unaffected","Automatically become inactive","Are revoked","Transfer to the Commission for 90 days"],a:1,r:"C.R.S. 12-10-211",e:"They go inactive until the problem is resolved. Associates can only practice under an active employing broker."},
{x:"S",c:"Licensing",q:"To prevent hardship when a firm loses its employing broker, the Commission may issue a temporary broker license for up to:",o:["30 days","60 days","90 days","180 days"],a:2,r:"C.R.S. 12-10-203 / Rule 2.10",e:"90 days, and no firm may receive more than two temporary licenses in any 18-month period."},
{x:"S",c:"Licensing",q:"A licensed attorney applying for a Colorado broker license must:",o:["Complete all 168 hours","Complete 12 hours covering trust accounts, recordkeeping and closings, and pass the exam","Only submit fingerprints","Complete 72 hours and skip the exam"],a:1,r:"Rule 2.6",e:"Attorneys take 12 hours (Trust Accounts, Recordkeeping and Closings), pass the exam and submit fingerprints and proof of law license."},
{x:"S",c:"Licensing",q:"Which license is NOT subject to renewal?",o:["An associate broker license","An employing broker license","A brokerage firm (entity) license","An inactive individual license"],a:2,r:"Rule 3.11",e:"Firm licenses do not renew; the individuals do. An inactive individual license must still be renewed every three years at the same fee."},
{x:"S",c:"Licensing",q:"A broker is convicted of a misdemeanor theft offense. The broker must notify the Commission within:",o:["10 days","30 days","60 days","At next renewal"],a:1,r:"Rule 6.23",e:"30 days. The same deadline applies to fair housing violations, discipline in another state, and suspension or revocation of another professional license."},
{x:"S",c:"Licensing",q:"Since 1997 Colorado has used single licensing. This means:",o:["Only one license per household","Every licensee is educated and licensed at the broker level; there is no salesperson license","A broker may hold only one trade name","Firms and individuals share one license number"],a:1,r:"Single licensing",e:"Everyone is a broker: associate, independent or employing. It removed the old salesperson defense in disciplinary cases."},
{x:"S",c:"Licensing",q:"An applicant licensed in another state must provide a certificate of license history. If that license is active, the certificate must be dated within:",o:["30 days before the Colorado application","90 days before the Colorado application","One year before the Colorado application","Any time after first licensure"],a:1,r:"Rule 2.4",e:"Within 90 days before applying (or after the expiration date if the other license has expired)."},
{x:"S",c:"Licensing",q:"A person with a past conviction wants to know whether it will block licensure before paying for school. The person may request:",o:["A temporary license","A preliminary advisory opinion","A license recognition agreement","An exam waiver"],a:1,r:"Rule 3.8",e:"A preliminary advisory opinion can be requested at any time, before education or the application fee. It is not binding, but a favorable one is a reasonable assurance."},
{x:"S",c:"Licensing",q:"Which continuing education rule is correct?",o:["Excess hours carry forward to the next cycle","No more than eight hours of credit may be earned in one day","Office sales meetings count for elective credit","A course may be repeated for credit in the same calendar year"],a:1,r:"Rule 4.4",e:"Eight-hour daily cap. No carry-forward, no repeating a course in the same calendar year, and sales or motivational meetings never count. Keep completion certificates for four years."},
{x:"S",c:"Licensing",q:"Which broker is required to maintain a place of business in Colorado?",o:["An employed associate broker","An inactive broker","A resident independent broker","A broker licensed only in another state"],a:2,r:"Rule 3.10",e:"Every resident Colorado broker except employed associates and inactive brokers must maintain a Colorado place of business."},

// ================= STATE · REQUIREMENTS GOVERNING LICENSEE ACTIVITIES (11 items) =================
{x:"S",c:"Licensee Activities",q:"An associate broker runs an online ad for a listing. The ad must include:",o:["The associate's license number","The name of the brokerage firm","The employing broker's personal name","The Commission's phone number"],a:1,r:"Rule 6.10",e:"All advertising is done in the brokerage firm's name. On electronic media the firm name must appear on every viewable page."},
{x:"S",c:"Licensee Activities",q:"When may a broker advertise real estate without using the brokerage firm's name?",o:["Never","When advertising a listing under $100,000","When advertising the broker's own property that is not listed with the firm","When the ad runs only on social media"],a:2,r:"Rule 6.10",e:"The one exception is a broker's own unlisted property. The broker must still disclose licensed status in writing under Rule 6.17."},
{x:"S",c:"Licensee Activities",q:"Three associates at Front Range Brokers form a team. Which team name is permitted?",o:["Summit Realty Group","The Summit Team","Summit Real Estate Company","Summit Homes LLC"],a:1,r:"Rule 6.10",e:"A team name cannot use realty, real estate, REALTORS, company, corporation, Inc., LLC, LP, LLP or any term implying a separate entity. Team ads must clearly show the firm's name."},
{x:"S",c:"Licensee Activities",q:"A social media post has no room for the brokerage name. The rule is satisfied if the firm's name:",o:["Appears somewhere on the broker's website","Is disclosed within the first click","Is given when a consumer asks","Is in the broker's profile photo"],a:1,r:"Rule 6.10",e:"When space is limited, the firm name must be available within one click."},
{x:"S",c:"Licensee Activities",q:"After a listing contract expires, online advertising of the property must be removed within:",o:["24 hours","Three days","Seven days","Ten days"],a:1,r:"Rule 6.10",e:"Three days after expiration."},
{x:"S",c:"Licensee Activities",q:"An associate broker may accept commission for a closed sale from:",o:["The seller directly","The title company","The cooperating brokerage","Only the associate's employing broker"],a:3,r:"C.R.S. 12-10-221",e:"An associate is paid only by the employing broker (firm). The firm may pay the commission to the associate's wholly owned entity (CP-8)."},
{x:"S",c:"Licensee Activities",q:"A broker's neighbor, who is not licensed, sends her a buyer. She wants to pay him $500 after closing. This is:",o:["Allowed if disclosed on the settlement statement","Allowed if under $1,000","Prohibited; referral fees may not be paid to unlicensed persons for acts requiring a license","Allowed with the employing broker's approval"],a:2,r:"CP-2 / Rule 6.21",e:"Commissions and referral fees go only to licensees. On a federally related loan, RESPA independently bans the kickback."},
{x:"S",c:"Licensee Activities",q:"Under Rule 6.21, reasonable cause for a referral fee exists when there is:",o:["Any prior friendship between brokers","An actual introduction of business, or a contractual referral or cooperative brokerage relationship","A lender's written approval","A listing in the same MLS"],a:1,r:"Rule 6.21 / C.R.S. 12-10-304",e:"Reasonable cause means an actual introduction of business, a contractual referral fee relationship, or a contractual cooperative brokerage relationship. No one may demand a referral fee without it."},
{x:"S",c:"Licensee Activities",q:"A Colorado broker may pay a referral fee to a broker licensed only in Texas if:",o:["The Texas broker shows the Colorado property","The Texas broker has an office elsewhere and the Colorado broker does all advertising, negotiating and contracting","The Texas broker holds the earnest money","The fee is under 25%"],a:1,r:"Rule 6.21",e:"The out-of-state broker must be domiciled and officed elsewhere; the Colorado broker performs all licensed activity; and all funds are deposited in the Colorado firm's name."},
{x:"S",c:"Licensee Activities",q:"A buyer's broker wants to rebate part of her commission to her buyer at closing on a financed purchase. She:",o:["May not rebate commissions to anyone","May do so, but it must be disclosed and the lender must approve","May do so secretly since it is her money","Needs Commission approval"],a:1,r:"CP-4",e:"A broker may rebate earned commission to their own client. On a financed deal it must be disclosed on the closing documents and approved by the lender."},
{x:"S",c:"Licensee Activities",q:"A broker owns part of a title company and refers a buyer there. The broker must:",o:["Do nothing if the title company charges market rates","Give a written affiliated business arrangement disclosure before the referral, and may not require its use","Require the buyer to use the company","Refund the title premium"],a:1,r:"Rule 6.18 / C.R.S. 12-10-218",e:"Give the HUD Affiliated Business Arrangement Disclosure before referring. Requiring use of the affiliate as a condition of service is prohibited."},
{x:"S",c:"Licensee Activities",q:"A broker is selling her own rental property to a buyer she found herself. She must:",o:["List it with her firm first","Disclose in writing that she is a licensed broker","Use a different broker's forms","Notify the Commission"],a:1,r:"Rule 6.17",e:"Licensed status must be disclosed in writing whenever a broker buys, sells or leases for themselves, along with any personal conflict of interest."},
{x:"S",c:"Licensee Activities",q:"Under the Conway-Bogue decision, a Colorado broker may:",o:["Draft any legal document for a fee","Fill in blanks on standard approved forms for a transaction the broker is handling, with no separate charge","Give legal opinions on title","Prepare wills for clients at closing"],a:1,r:"Conway-Bogue",e:"Brokers get a limited right to practice law: completing approved forms in their own transactions, for no extra fee. Anything beyond that means recommending an attorney."},
{x:"S",c:"Licensee Activities",q:"A seller wants the broker to write up an installment land contract with a lease-option. The broker should:",o:["Draft it using the Additional Provisions section","Modify the Contract to Buy and Sell","Advise the parties to have a Colorado attorney draft the documents","Use a form from another state"],a:2,r:"CP-23",e:"Brokers are not to draft lease options, lease-purchase agreements or installment land contracts. These go to an attorney."},
{x:"S",c:"Licensee Activities",q:"Broker Lee knows a home is under an unexpired exclusive listing with another firm and knocks on the door to pitch his services. This violates:",o:["The statute of frauds","The sign-crossing rule","RESPA","Nothing, if he does not sign a contract that day"],a:1,r:"Rule 6.14",e:"A broker may not negotiate a listing with someone the broker knows has an unexpired listing with another brokerage."},
{x:"S",c:"Licensee Activities",q:"A seller with a current listing at another firm calls Broker Lee on her own. Lee may:",o:["Not speak to her at all","Discuss terms and sign a listing that takes effect only after the current one expires","Take over the listing immediately","Advise her to stop cooperating with her broker"],a:1,r:"Rule 6.14",e:"If the owner initiates contact, the broker may negotiate terms of a future listing and may sign one that becomes effective after the existing listing expires."},
{x:"S",c:"Licensee Activities",q:"Under Commission rules, every listing agreement must:",o:["Be recorded","Be in writing and contain a definite termination date","Run at least 90 days","Be approved by the Commission"],a:1,r:"Rule 6.14",e:"In writing, before brokerage services are provided, with a definite termination date. No automatic renewals."},
{x:"S",c:"Licensee Activities",q:"A listing has a holdover clause. After expiration the seller sells to someone who toured during the listing. The broker is owed a commission only if:",o:["The sale closes within one year","The buyer's name was submitted to the seller in writing at the end of the listing","The buyer used the same lender","The broker re-lists the property"],a:1,r:"Rule 6.14",e:"The holdover protects only people actually negotiated with during the term whose names were given to the principal in writing when the listing ended."},
{x:"S",c:"Licensee Activities",q:"A buyer's broker has a low offer on a property with an unexpired listing. The offer must be:",o:["Held until a better one arrives","Presented to the listing broker","Sent only to the seller directly","Screened by the employing broker"],a:1,r:"Rule 6.13",e:"All offers go to the listing broker while the listing is in effect. A broker never decides which offers the seller sees."},
{x:"S",c:"Licensee Activities",q:"Which task may an unlicensed assistant perform?",o:["Explain contract provisions to a buyer","Negotiate the commission","Deliver documents and order the title commitment","Give an opinion of value"],a:2,r:"CP-20",e:"Unlicensed assistants do clerical and delivery work. They may not give opinions, advice or interpretation, or do anything that requires a license."},
{x:"S",c:"Licensee Activities",q:"An employing broker must provide a high level of supervision to associate brokers who have:",o:["Fewer than five closed sales","Less than two years of active licensed experience","An inactive license","A prior disciplinary action"],a:1,r:"Rule 6.3",e:"Under two years: specific training, availability for consultation, help preparing contracts, monitoring from contract to closing and reviewing closing documents."},
{x:"S",c:"Licensee Activities",q:"An employing broker delegates supervision of new associates to a senior associate. The delegation must be:",o:["Filed with the Commission","In writing and signed by the supervising broker; both remain jointly responsible","Approved by each client","Limited to 90 days"],a:1,r:"Rule 6.3",e:"Written, signed, available for inspection, and it creates joint responsibility. The employing broker can never contract away responsibility for supervision."},
{x:"S",c:"Licensee Activities",q:"The office policy manual required of every employing broker must be:",o:["Filed annually with the Commission","Given to and signed by each licensee, and available for Commission inspection","Posted on the firm's website","Approved by the Division"],a:1,r:"Rule 6.3 / 6.4",e:"Written, given to and signed by each licensee. It must describe the brokerage relationships offered, the designation procedure and how confidential and personal identifying information is protected."},
{x:"S",c:"Licensee Activities",q:"On a residential sale, the seller refuses to pay the agreed commission. The broker may:",o:["Record a lien against the property","Refuse to release the deed","Sue for the commission, but may not file a lien or interfere with the transfer of title","Hold the earnest money as payment"],a:2,r:"Rule 6.22",e:"In residential transactions a broker cannot lien the property or cloud title to secure a commission. The remedy is a lawsuit."},
{x:"S",c:"Licensee Activities",q:"The seller backs out for no reason attributable to the buyer. The listing broker holds $10,000 in earnest money. The broker:",o:["Keeps half as liquidated damages","Keeps an amount equal to the commission","Must return the full amount to the buyer","Sends it to the Commission"],a:2,r:"Rule 6.22",e:"If the seller fails to close through no fault of the buyer, the buyer gets all of the earnest money back. The broker cannot claim any part of it."},
{x:"S",c:"Licensee Activities",q:"A residential broker is asked to handle the sale of a large ranch with water rights and has never done one. Under Rule 6.2 the broker may do all of these EXCEPT:",o:["Decline the engagement","Co-list with an experienced broker","Proceed alone and learn as the deal goes","Get help from a supervising broker or attorney"],a:2,r:"Rule 6.2",e:"Competency rule: decline, get the training first, bring in a qualified broker or counsel, or co-list. Proceeding without competence is a violation."},
{x:"S",c:"Licensee Activities",q:"A broker prepares a market analysis for an estate attorney, not for a listing. The report must:",o:["Be signed by an appraiser","State that it is not an appraisal and cannot be used to obtain financing","Be filed with the county","Include three closed comparables"],a:1,r:"Rule 6.10",e:"A CMA prepared for any purpose other than an anticipated sale or purchase needs the disclaimer that it was prepared by a broker, is not an appraisal and cannot be used for financing."},
{x:"S",c:"Licensee Activities",q:"Regarding square footage, a Colorado broker:",o:["Must personally measure every listing","Is not required to measure, but must accurately represent the source of any measurement","May only use the assessor's figure","Guarantees the figure in the MLS"],a:1,r:"Rule 6.10 / Square Footage Disclosure",e:"Brokers do not have to measure. If they do, they disclose the method and that it is for marketing purposes only. Either way the source of the number must be accurately stated."},
{x:"S",c:"Licensee Activities",q:"A buyer's broker gives the lockbox code to the buyer's contractor so he can go measure alone. This is:",o:["Fine if the home is vacant","A violation unless the listing broker authorized it","Fine with the buyer's written consent","Required by the inspection clause"],a:1,r:"Rule 6.16",e:"Access information may not be shared with any third party without the listing broker's authorization, and may not be used outside the approved showing window."},
{x:"S",c:"Licensee Activities",q:"Under the license law, a broker has earned a commission when:",o:["A buyer signs an offer","The listing is signed","Closing occurs, or the seller refuses or neglects to close","The inspection deadline passes"],a:2,r:"C.R.S. 12-10-301",e:"Commission is earned at closing, or when a seller who accepted the contract fails or refuses to close."},
{x:"S",c:"Licensee Activities",q:"The buyer refuses to close because the seller's title is defective. The broker's commission is:",o:["Still owed by the seller","Not earned","Owed by the buyer","Split between the parties"],a:1,r:"C.R.S. 12-10-302",e:"No commission is earned when the buyer fails or refuses to close because of defects in the owner's title, unless the owner corrects the defects within a reasonable time."},
{x:"S",c:"Licensee Activities",q:"Before closing, a licensee is required to recommend to the client:",o:["A home warranty","A title examination and the use of legal counsel","A second appraisal","A survey in every case"],a:1,r:"Rule 6.14",e:"In every transaction the licensee must recommend title examination and legal counsel before closing. The approved forms have this advisory preprinted."},
{x:"S",c:"Licensee Activities",q:"An associate with a pending listing moves to a new firm. The listing contract:",o:["Automatically follows the associate","Belongs to the original firm and stays unless assigned with the seller's written consent","Terminates","Is held by the Commission until closing"],a:1,r:"CP-7",e:"The listing belongs to the employing broker/firm. Moving it requires written consent, assignment and acceptance; otherwise the original firm designates another broker."},
{x:"S",c:"Licensee Activities",q:"A broker may advertise another firm's listing, including price, only if:",o:["It is in the MLS","The owner or the listing broker has given permission and the listing firm is conspicuously identified","The broker has a buyer","The property has been listed over 30 days"],a:1,r:"Rule 6.10",e:"Permission from the owner or the owner's broker is required, and the listing brokerage must be conspicuously disclosed."},
{x:"S",c:"Licensee Activities",q:"How many trade names may a brokerage firm use?",o:["One","Two","One per office","Unlimited if registered"],a:0,r:"Rule 6.10",e:"A firm may use only one trade name, and must do business under the name that appears on the license."},
{x:"S",c:"Licensee Activities",q:"A broker is licensed as a sole proprietor. Which name may she use?",o:["Alpine Homes Inc.","Alpine Homes LLC","Alpine Homes","Alpine Homes Corp."],a:2,r:"Rule 2.9",e:"A sole proprietor cannot use a name suggesting an entity (Corp., Inc., LLC)."},
{x:"S",c:"Licensee Activities",q:"Under Commission Position 12, a nightly vacation rental agreement is treated as:",o:["A lease requiring a broker license to arrange","A license to use property, outside the definition of real estate brokerage","A timeshare","A sublease"],a:1,r:"CP-12",e:"Short-term lodging agreements are licenses to use, not leases, so arranging them is exempt from the brokerage definition. Guest deposits a broker holds still go in a trust account (Rule 5.11)."},
{x:"S",c:"Licensee Activities",q:"A broker conducting closings wants to charge a closing fee. The broker must:",o:["Charge both parties equally","Specify the costs and get written consent of the parties being charged","Get Commission approval of the fee","Waive the commission"],a:1,r:"Rule 6.14",e:"A broker cannot charge separately for preparing legal documents, and any closing fee must be itemized and consented to in writing."}
);

BANK.push(
// ================= STATE · ADDITIONAL TOPICS (7 items) =================
{x:"S",c:"Additional Topics",q:"Under Colorado law, a landlord must return a residential security deposit within:",o:["10 days","One month, or up to 60 days if the lease says so","45 days in all cases","90 days"],a:1,r:"C.R.S. 38-12-103",e:"One month after the lease ends or the tenant surrenders, unless the lease sets a longer period, which can never exceed 60 days."},
{x:"S",c:"Additional Topics",q:"A landlord willfully keeps a $1,500 deposit with no accounting. After proper notice, the tenant may recover up to:",o:["$1,500","$3,000","$4,500 plus court costs and attorney fees","Nothing without a written lease"],a:2,r:"C.R.S. 38-12-103",e:"Willful wrongful retention exposes the landlord to triple the amount withheld plus costs and attorney fees. The tenant must give seven days' notice before suing. Missing the accounting deadline forfeits the right to keep any of the deposit."},
{x:"S",c:"Additional Topics",q:"Which may NOT be deducted from a tenant's security deposit?",o:["Unpaid rent","A hole punched in a door","Normal wear and tear","Unpaid utility bills owed under the lease"],a:2,r:"C.R.S. 38-12-103",e:"Deposits can never be kept for normal wear and tear."},
{x:"S",c:"Additional Topics",q:"A tenant reports a gas leak. If the landlord does not have it repaired within ___, the tenant may vacate and the lease is void.",o:["24 hours","72 hours","Five days","Ten days"],a:1,r:"C.R.S. 38-12-104",e:"72 hours for a hazardous gas condition. Separately, under the warranty of habitability an owner must generally respond to a tenant's notice within 24 hours."},
{x:"S",c:"Additional Topics",q:"A property manager wants to turn tenant security deposits over to the owner. Under Rule 5.8 this is allowed only if:",o:["The owner asks in writing","The tenant is told who holds the money and how to get it back, and the management agreement makes the owner responsible","The deposits are under one month's rent","The Commission approves"],a:1,r:"Rule 5.8",e:"The tenant must know where the deposit is and how to recover it, and the management agreement must place responsibility for its return on the owner and allow release of the owner's name and address."},
{x:"S",c:"Additional Topics",q:"Water rights in Colorado are allocated under the doctrine of:",o:["Riparian rights","Littoral rights","Prior appropriation","Correlative rights"],a:2,r:"Colo. Const. / water law",e:"Prior appropriation: first in time, first in right. A water right is a real property right to use water, not ownership of the water itself."},
{x:"S",c:"Additional Topics",q:"A seller of rural land owns shares in a ditch company and a decreed irrigation right. For these to pass to the buyer:",o:["Nothing is needed; water runs with the land","They must be expressly described and conveyed, by the deed or a separate deed or stock transfer","The buyer files a claim after closing","The county assessor transfers them"],a:1,r:"C.R.S. 38-30-102",e:"Water rights are not automatically appurtenant. They must be specifically conveyed. The exception in your course: a domestic household well passes with the house."},
{x:"S",c:"Additional Topics",q:"A buyer purchases a home served by a private well. Colorado law requires that the change in ownership be reported to the:",o:["County clerk and recorder","Division of Water Resources","Real Estate Commission","Department of Public Health and Environment"],a:1,r:"C.R.S. 38-30-102",e:"The Division of Water Resources (Department of Natural Resources). Under the Closing Instructions the closing company submits the Change in Ownership form within 60 days after closing."},
{x:"S",c:"Additional Topics",q:"In Colorado the lien for general property taxes attaches to real property on:",o:["January 1","April 30","June 15","December 31"],a:0,r:"Property tax",e:"Taxes become a lien January 1 and are paid in arrears the following year. Property tax liens take priority over other liens."},
{x:"S",c:"Additional Topics",q:"Colorado property taxes may be paid without penalty:",o:["In full by January 31 only","In full by April 30, or half by the last day of February and half by June 15","Quarterly","In full by December 31"],a:1,r:"Property tax",e:"Two choices: one full payment by April 30, or two halves due the last day of February and June 15. Delinquent interest runs at 1% per month."},
{x:"S",c:"Additional Topics",m:1,q:"A home has an actual value of $600,000. Using an assessment rate of 7% and a total mill levy of 85 mills, the annual property tax is:",o:["$3,570","$5,100","$4,200","$35,700"],a:0,r:"AV x Mill Levy",e:"Assessed value = $600,000 x 0.07 = $42,000. A mill is $0.001, so 85 mills = 0.085. $42,000 x 0.085 = $3,570. The exam gives you the assessment rate; do not memorize one."},
{x:"S",c:"Additional Topics",q:"At a county tax lien sale the winning bidder receives a:",o:["Treasurer's deed","Certificate of purchase","Sheriff's deed","Confirmation deed"],a:1,r:"Tax sale",e:"A certificate of purchase. The owner can redeem by paying taxes plus interest. After three years unredeemed, the holder may apply for a treasurer's deed."},
{x:"S",c:"Additional Topics",q:"Which classes are protected by the Colorado Fair Housing Act but are not named in the federal Fair Housing Act?",o:["Race and color","Marital status, ancestry and creed","Religion and national origin","Familial status and disability"],a:1,r:"C.R.S. 24-34",e:"Colorado adds marital status, ancestry and creed to the federal list. It also reaches commercial property and owner-occupied one-to-four unit properties that federal law exempts."},
{x:"S",c:"Additional Topics",q:"An owner refuses to lease retail space to a business owner because of the applicant's religion. Which law applies?",o:["Federal Fair Housing Act only","Colorado Fair Housing Act, which covers commercial property","Neither; fair housing laws are residential only","RESPA"],a:1,r:"C.R.S. 24-34",e:"Federal fair housing law is residential. Colorado's act extends to commercial property. (The Civil Rights Act of 1866 would also apply to race in any property.)"},
{x:"S",c:"Additional Topics",q:"A person who believes they were discriminated against in housing may file with the Colorado Civil Rights Commission within:",o:["90 days","180 days","One year","Two years"],a:2,r:"C.R.S. 24-34",e:"One year from the discriminatory act, the same window as a HUD complaint. A federal court suit has two years."},
{x:"S",c:"Additional Topics",q:"The Colorado Foreclosure Protection Act contract form is required when the property is residential, the seller lives in it as a principal residence, the property is in foreclosure or 30-plus days delinquent, and:",o:["The buyer will occupy it as a personal residence","The buyer will NOT occupy it as a personal residence","The price is under $500,000","The buyer is paying cash"],a:1,r:"Foreclosure Protection Act",e:"The Act targets equity purchasers: investors buying a distressed owner-occupied home. A buyer who will live there is not an equity purchaser."},
{x:"S",c:"Additional Topics",q:"A homeowner in foreclosure signs a contract with an equity purchaser. The homeowner may cancel until:",o:["Closing","Midnight of the third business day, or noon the day before the foreclosure sale, whichever comes first","Ten days after signing","The Rule 120 hearing"],a:1,r:"C.R.S. 6-1-1101 et seq.",e:"Three business days or noon the day before the sale, whichever is first. With a foreclosure consultant, the owner may cancel at any time."},
{x:"S",c:"Additional Topics",q:"A Colorado deed of trust foreclosure begins when the lender files a notice of election and demand for sale with the:",o:["District court clerk","County sheriff","Public trustee","Secretary of State"],a:2,r:"Foreclosure",e:"The public trustee of the county. The trustee records the notice and sets the sale. The lender must also obtain a court order authorizing sale (Rule 120 hearing)."},
{x:"S",c:"Additional Topics",q:"For non-agricultural property, the public trustee sets the foreclosure sale how long after recording the notice of election and demand?",o:["30 to 45 days","45 to 60 days","110 to 125 days","215 to 230 days"],a:2,r:"Foreclosure",e:"110 to 125 days for residential and other non-agricultural property; 215 to 230 days for agricultural land."},
{x:"S",c:"Additional Topics",q:"A Colorado homeowner in foreclosure may cure the default by paying the amount due until:",o:["The notice is recorded","Noon the day before the sale","75 days after the sale","Six months after the sale"],a:1,r:"Foreclosure",e:"The owner can cure up to noon the day before the sale. There is no owner redemption period after the sale in Colorado."},
{x:"S",c:"Additional Topics",q:"After a public trustee sale, who may redeem the property?",o:["The former owner, within 75 days","Junior lienholders of record who file a notice of intent within eight business days","Any bidder at the sale","No one"],a:1,r:"Foreclosure",e:"Only lienors of record. Each files notice of intent to redeem within eight business days after the sale and then redeems in order of priority. When redemption rights run out the public trustee issues a confirmation deed."},
{x:"S",c:"Additional Topics",q:"Equity skimming of real property in Colorado is a:",o:["Class 2 misdemeanor","Class 5 felony","Civil infraction","License law violation only"],a:1,r:"C.R.S. 18-5-802",e:"Class 5 felony: taking title to a property with a loan in default and pocketing the rent instead of paying the loan."},
{x:"S",c:"Additional Topics",q:"The period for adverse possession in Colorado is:",o:["5 years","10 years","18 years, or 7 with color of title and payment of taxes","20 years in all cases"],a:2,r:"Adverse possession",e:"Eighteen years of open, notorious, hostile, exclusive, continuous possession with a good faith belief of ownership. Seven years if the possessor holds under color of title and pays the taxes."},
{x:"S",c:"Additional Topics",m:1,q:"A seller who will be a nonresident of Colorado after closing sells for $520,000 and nets $180,000. How much Colorado tax is withheld at closing?",o:["$0","$3,600","$10,400","$78,000"],a:2,r:"C.R.S. 39-22-604.5",e:"The lesser of 2% of the sales price ($10,400) or the net proceeds ($180,000). No withholding if the price is under $100,000. It is remitted to the Department of Revenue within 30 days."},
{x:"S",c:"Additional Topics",q:"A buyer of a Colorado timeshare has the right to rescind within:",o:["24 hours","Three business days","Five calendar days","Ten days"],a:2,r:"C.R.S. 6-1-703",e:"Five calendar days after the sale, with any deposit refunded within seven days of the seller receiving notice."},
{x:"S",c:"Additional Topics",q:"Under the license law, a subdivision that must be registered is real property divided into:",o:["Five or more lots","Ten or more commercial sites","Twenty or more residential interests","Any number of timeshare weeks"],a:2,r:"C.R.S. 12-10-501",e:"Twenty or more interests intended solely for residential use. The developer registers with the Commission and need not hold a broker license; an unregistered developer's contracts are voidable by the purchaser."},
{x:"S",c:"Additional Topics",q:"The Colorado homestead exemption protects up to what amount of a homeowner's equity from most creditors?",o:["$75,000","$105,000","$250,000 ($350,000 if elderly or disabled)","Unlimited"],a:2,r:"Homestead",e:"$250,000, or $350,000 for elderly or disabled owners. Borrowers waive it in the deed of trust so the lender's lien comes first."},
{x:"S",c:"Additional Topics",q:"A builder must give a new-home buyer a summary of the soil and hazard analysis at least:",o:["3 days before closing","14 days before closing","30 days before contract","At closing"],a:1,r:"C.R.S. 6-6.5-101",e:"Fourteen days before closing, plus an expansive soils publication where that risk exists."},
{x:"S",c:"Additional Topics",q:"A buyer asks the listing broker whether anyone died in the house. A suicide occurred there two years ago. Under Colorado law the broker:",o:["Must disclose it as an adverse material fact","Has no duty to disclose; it is not a material fact, and disclosure needs the seller's consent","Must tell the buyer to call the police","Must disclose only if asked in writing"],a:1,r:"C.R.S. 38-35.5-101",e:"Homicide, suicide, other felonies and an occupant's HIV/AIDS status are psychological impacts, not material facts. No cause of action arises for not disclosing. The broker still may not lie."},
{x:"S",c:"Additional Topics",q:"A broker who violates the Colorado Consumer Protection Act through a deceptive trade practice faces:",o:["A warning letter only","Loss of license, civil penalties and treble damages in a private suit","A maximum $500 fine","No liability if the buyer had an inspection"],a:1,r:"C.R.S. 6-1",e:"The Act applies to real estate. Treble damages are available in a private action, and a violation is also grounds for license discipline."},
{x:"S",c:"Additional Topics",q:"Colorado's special taxing district disclosure must appear in:",o:["Only new construction contracts","Every contract for the purchase and sale of residential real property","The deed","The listing only"],a:1,r:"C.R.S. 38-35.7-101",e:"Every residential purchase contract. The seller provides it; failure gives the buyer a claim for resulting damages. The approved forms have it preprinted."},
{x:"S",c:"Additional Topics",q:"Under the Colorado Common Interest Ownership Act (CCIOA), the law governs:",o:["Mortgage loan originators","Creation and management of condominiums, cooperatives and planned communities with owners' associations","Farm and ranch water districts","Timeshare exchange companies only"],a:1,r:"C.R.S. 38-33.3",e:"CCIOA (1992) governs common interest communities and their associations and replaced most of the older Condominium Act."},
{x:"S",c:"Additional Topics",q:"A deed conveys property from Maria, who owns it alone, to Maria and her husband as joint tenants. Under Colorado law this deed:",o:["Fails because the unities of time and title are missing","Creates a valid joint tenancy","Creates a tenancy by the entirety","Creates community property"],a:1,r:"C.R.S. 38-31-101",e:"Colorado allows an owner to deed to self and another as joint tenants without a straw man. Remember also that tenancy in common is the default when a deed is silent, and Colorado has no tenancy by the entirety or community property."},
{x:"S",c:"Additional Topics",q:"A property manager who is not an on-site salaried manager and who leases and collects rent for several owners:",o:["Needs no license","Must hold a real estate broker license","Needs only a business license","Must register as a subdivision developer"],a:1,r:"CP-15 / C.R.S. 12-10-201",e:"Leasing and managing for others for compensation is brokerage. Only the regularly salaried on-site manager is exempt."},

// ================= STATE · RECORD KEEPING AND TRUST ACCOUNTS (5 items) =================
{x:"S",c:"Records & Trust",q:"A brokerage firm that will hold earnest money must deposit it in its trust account within:",o:["The same day","The next business day","Three business days of receipt or mutual acceptance, whichever is later","Ten calendar days"],a:2,r:"Rule 5.7 / 5.12",e:"Three business days after receipt of funds or execution of the contract, whichever is later."},
{x:"S",c:"Records & Trust",q:"A property manager receives a rent check. It must be deposited in the trust account within:",o:["One business day","Three business days","Five business days of receipt or lease execution, whichever is later","Thirty days"],a:2,r:"Rule 5.7",e:"Property management funds: five business days. All other trust funds: three business days."},
{x:"S",c:"Records & Trust",q:"Brokers and brokerage firms must keep transaction files for:",o:["Two years","Three years","Four years","Seven years"],a:2,r:"Rule 6.20",e:"Four years from closing, or from expiration of a listing that did not close. Same four years applies to CE certificates and records of attorney-drafted clauses."},
{x:"S",c:"Records & Trust",q:"A property management firm must hold rents and security deposits:",o:["In one account labeled trust","In separate trust accounts","In the firm's operating account with a ledger","In the owner's personal account"],a:1,r:"Rule 5.5",e:"Rental receipts and security deposits go in separate, labeled trust or escrow accounts."},
{x:"S",c:"Records & Trust",q:"Depositing a client's earnest money in the broker's business operating account is:",o:["Conversion","Commingling","Allowed for up to three days","A ministerial task"],a:1,r:"Rule 5.10",e:"Commingling is mixing others' money with the broker's. Conversion or diversion is using one beneficiary's money for another purpose or person."},
{x:"S",c:"Records & Trust",q:"May a broker keep any personal money in a trust account?",o:["No, never","Yes, a small amount to cover bank charges, tracked on its own ledger","Yes, up to $5,000","Yes, earned commissions may stay indefinitely"],a:1,r:"Rule 5.14",e:"A small cushion for bank fees is allowed if it is recorded in the journal and on a separate ledger. Earned fees must be moved to the operating account at least monthly."},
{x:"S",c:"Records & Trust",q:"The record that shows, in date order, every deposit to and disbursement from a trust account as a whole is the:",o:["Ledger","Journal","Reconciliation","Rent roll"],a:1,r:"Rule 5.14",e:"Journal = the whole account, like a check register. Ledger = one beneficiary's money. Reconciliation ties them to the bank statement."},
{x:"S",c:"Records & Trust",q:"A three-way reconciliation, done monthly, proves that these three agree:",o:["Journal balance, total of all ledgers, and the bank statement","Listing file, contract file and closing file","Buyer debits, seller credits and commission","Operating account, payroll account and trust account"],a:0,r:"Rule 5.14",e:"Journal cash balance = sum of all ledger balances = reconciled bank balance. No individual ledger may ever be negative."},
{x:"S",c:"Records & Trust",q:"Unless the parties agree otherwise in writing, trust account records are kept on:",o:["An accrual basis","A cash basis","A fiscal-year basis","A modified accrual basis"],a:1,r:"Rule 5.16",e:"Cash basis is the default."},
{x:"S",c:"Records & Trust",q:"A trust account must be opened in the name of:",o:["The associate broker who took the listing","The licensed broker or the licensed brokerage entity","The seller","The title company"],a:1,r:"Rule 5.2 / 5.3",e:"In the name of the individual broker or the licensed entity, labeled trust or escrow and by the type of funds held. The broker stays responsible even if others can sign."},
{x:"S",c:"Records & Trust",q:"A broker never holds anyone's money because all earnest money goes to title companies. The broker:",o:["Must still keep a trust account open","Is not required to maintain a trust account","Must post a bond instead","Must hold deposits for 24 hours first"],a:1,r:"Rule 5.4",e:"No money of others, no account needed. There is also no limit on how many trust accounts a broker may have."},
{x:"S",c:"Records & Trust",q:"The contract names a title company as earnest money holder, and the buyer hands the check to the buyer's broker. The broker must:",o:["Deposit it in the firm's trust account first","Deliver it to the title company and obtain a dated, signed receipt","Hold it until closing","Give it to the seller"],a:1,r:"Rule 5.12",e:"Deliver as the contract directs and keep a dated and signed receipt in the file."},
{x:"S",c:"Records & Trust",q:"Earnest money is given as a promissory note due in five days, and the buyer does not pay. The broker holding it must:",o:["Extend the due date","Promptly notify the seller and deliver the note","Terminate the contract","Pay the amount personally"],a:1,r:"Rule 5.13",e:"The seller must be told the note's due date up front, and if it is not paid on time the broker promptly notifies the seller and delivers the original note."},
{x:"S",c:"Records & Trust",q:"Interest earned on a brokerage trust account belongs to:",o:["The broker","The Commission","The parties whose money it is, unless they agree otherwise in writing","The bank"],a:2,r:"CP-5",e:"Interest does not belong to the brokerage unless the parties agree in writing."},
{x:"S",c:"Records & Trust",q:"A property manager must send the owner an accounting report:",o:["Annually","Within 30 days after the end of any month in which funds were received or disbursed, unless the agreement says otherwise","Only when asked","Within 10 days of each deposit"],a:1,r:"Rule 5.15",e:"Thirty days after the end of each month with activity, unless the written management agreement provides otherwise."},
{x:"S",c:"Records & Trust",q:"A property manager's affiliated maintenance company bills $400 and the manager charges the owner $460. This mark-up requires:",o:["Nothing; it is customary","The owner's prior written approval","Commission approval","Tenant consent"],a:1,r:"Rule 5.17",e:"Mark-ups, service fees or any compensation above the vendor's charge need prior written client approval and records of the amounts."},
{x:"S",c:"Records & Trust",q:"Funds in a trust account must be:",o:["In a certificate of deposit","Available for immediate withdrawal without penalty unless all parties consent in writing","Invested for the owner's benefit","Held in the Commission's name"],a:1,r:"Rule 5.6",e:"No fixed maturity dates or early withdrawal penalties unless every party agrees in advance in writing."},
{x:"S",c:"Records & Trust",q:"A management account moves from Firm A to Firm B. Firm A must transfer the tenants' security deposits to Firm B within:",o:["10 days","30 days","60 days","90 days"],a:2,r:"Rule 5.8",e:"The outgoing firm has 60 days to transfer and confirm amounts. The incoming firm has 30 days to disclose in writing to the owner and tenants the status of the deposits."},

// ================= STATE · BROKERAGE RELATIONSHIPS (11 items) =================
{x:"S",c:"Brokerage Relationships",q:"A broker begins working with a buyer and no written agreement is signed. By default the broker is the buyer's:",o:["Single agent","Subagent of the seller","Transaction-broker","Dual agent"],a:2,r:"C.R.S. 12-10-403",e:"Transaction-broker is the default in Colorado. Agency exists only with a written agreement."},
{x:"S",c:"Brokerage Relationships",q:"The two brokerage relationships a Colorado broker may have with a member of the public are:",o:["Single agency and dual agency","Single agency and transaction-brokerage","Subagency and transaction-brokerage","Designated agency and facilitator"],a:1,r:"C.R.S. 12-10-402 / 403",e:"Agent or transaction-broker. A person with no brokerage relationship with the broker is a customer."},
{x:"S",c:"Brokerage Relationships",q:"Dual agency in Colorado is:",o:["Allowed with written informed consent","Allowed only in-house","Prohibited","Allowed for commercial property"],a:2,r:"C.R.S. 12-10-406",e:"A broker may never be an agent for both sides. A broker also may not be an agent for one side and a transaction-broker for the other."},
{x:"S",c:"Brokerage Relationships",q:"A transaction-broker:",o:["Advocates for whichever party hired the broker first","Assists one or both parties without being an agent or advocate for either","Owes loyalty to the seller only","May not prepare contracts"],a:1,r:"C.R.S. 12-10-407",e:"A transaction-broker helps with communication, contracts and closing, uses reasonable skill and care, and does not advocate."},
{x:"S",c:"Brokerage Relationships",q:"Which duties are owed only by a single agent and NOT by a transaction-broker?",o:["Exercising reasonable skill and care","Disclosing adverse material facts actually known","Promoting the client's interests with utmost good faith, loyalty and fidelity, including seeking favorable price and terms and counseling on benefits and risks","Accounting for all money received"],a:2,r:"C.R.S. 12-10-404 / 405",e:"There are 17 uniform duties for everyone, plus three more for agents: promote the client's interests (loyalty), seek price and terms acceptable to the client, and counsel on material benefits and risks."},
{x:"S",c:"Brokerage Relationships",q:"A listing broker is the seller's agent. The buyer has no broker. To the listing broker the buyer is a:",o:["Client","Customer","Principal","Subagent"],a:1,r:"C.R.S. 12-10-402",e:"A customer is a party with whom the broker has no brokerage relationship. The broker still owes honesty and disclosure of known adverse material facts."},
{x:"S",c:"Brokerage Relationships",q:"A seller's agent knows the roof leaks. The seller says not to mention it. The agent:",o:["Must keep it confidential out of loyalty","Must disclose it to the buyer as a known adverse material fact","May disclose only if the buyer asks","Must terminate the listing but stay silent"],a:1,r:"C.R.S. 12-10-404 / CP-27",e:"Every broker, agent or not, must disclose adverse material facts actually known. Loyalty never covers concealing a defect."},
{x:"S",c:"Brokerage Relationships",q:"Without the client's consent, a broker must NOT disclose:",o:["A known foundation crack","That the seller will take less than the list price","That the property is in a flood zone","A known meth lab history"],a:1,r:"C.R.S. 12-10-404 to 407",e:"Confidential: willingness to accept less or pay more, motivating factors, willingness to accept other financing terms, material information about the party not required by law, and facts that may psychologically stigmatize a property."},
{x:"S",c:"Brokerage Relationships",q:"A buyer's agent owes the seller a duty to:",o:["Verify the buyer's financial ability","Disclose adverse material facts about the buyer's ability to perform that are actually known","Recommend the seller's price","Inspect the property for the seller"],a:1,r:"C.R.S. 12-10-405",e:"A buyer's broker discloses known adverse facts about the buyer's financial ability to perform, but has no duty to investigate the buyer's finances or verify the buyer's statements."},
{x:"S",c:"Brokerage Relationships",q:"A seller's agent has a duty to the buyer to:",o:["Conduct an independent inspection of the property","Verify the accuracy of the seller's statements","Disclose adverse material facts actually known","Advise the buyer on price"],a:2,r:"C.R.S. 12-10-404",e:"No duty to inspect or to verify the seller's or an inspector's statements. The duty is to disclose what the broker actually knows."},
{x:"S",c:"Brokerage Relationships",q:"In a firm with more than one licensee, the employing broker designates in writing the broker who will work with a client. That broker's knowledge and relationship:",o:["Extend to every broker in the firm","Extend to the employing broker only","Do not extend to the employing broker, the firm or other brokers in it","Extend to the cooperating firm"],a:2,r:"C.R.S. 12-10-403 / designated brokerage",e:"Designated brokerage (2003) ended imputed knowledge. The relationship is with the designated broker only, which is why two brokers in one firm can each be a single agent for opposite sides."},
{x:"S",c:"Brokerage Relationships",q:"A designated broker wants to discuss the client's confidential pricing strategy with the supervising broker. This is permitted when:",o:["Never","The client has given informed consent, as provided in the approved listing forms","The supervising broker asks","The deal is in-house"],a:1,r:"Rule 6.3.G / CP-31",e:"Confidential information may go to a supervising broker for supervision with the client's informed consent; the approved listing contracts contain that consent."},
{x:"S",c:"Brokerage Relationships",q:"Written brokerage relationship disclosure must be made:",o:["At closing","Before the broker elicits or discusses confidential information such as motivation or financial qualifications","Only when an offer is written","Within three days of first contact"],a:1,r:"Rule 6.5",e:"Before eliciting or discussing confidential information. Small talk about price range, location or advertised facts does not trigger it."},
{x:"S",c:"Brokerage Relationships",q:"At an open house a visitor will not sign anything but wants to see more homes. Which form does the broker use to disclose that the visitor is a customer or will be assisted as a transaction-broker?",o:["Exclusive Right-to-Buy Listing Contract","Brokerage Disclosure to Buyer","Closing Instructions","Change of Status"],a:1,r:"Brokerage Disclosure to Buyer/Tenant",e:"The Brokerage Disclosure to Buyer/Tenant is a disclosure, not a contract. If the buyer refuses to sign, note the refusal and keep a copy in the file."},
{x:"S",c:"Brokerage Relationships",q:"A broker is the seller's agent. An unrepresented buyer asks the same broker to help write an offer on that listing. If the listing allows it, the broker:",o:["Becomes a dual agent","Becomes a transaction-broker for both and gives the seller a Change of Status disclosure","Remains seller's agent and also becomes buyer's agent","Must refer the buyer out of the firm"],a:1,r:"Rule 6.9",e:"The broker changes to transaction-broker for both and delivers the Change of Status (Transaction-Brokerage Disclosure) form to the party whose relationship changed. If the seller did not agree to that in the listing, the buyer is treated as a customer."},
{x:"S",c:"Brokerage Relationships",q:"A seller's agent shows the listing to an unrepresented buyer and prepares the buyer's offer as directed. These are:",o:["Acts creating an agency with the buyer","Ministerial tasks that do not create a brokerage relationship with the buyer","Violations of the listing","Dual agency"],a:1,r:"Rule 6.8",e:"With proper disclosure an agent may perform ministerial tasks for a customer: showing property, preparing and conveying offers, giving financing information."},
{x:"S",c:"Brokerage Relationships",q:"Which may a single broker do in one transaction?",o:["Act as agent for both buyer and seller","Act as agent for the seller and transaction-broker for the buyer","Act as transaction-broker for both buyer and seller","Act as agent for the buyer and subagent of the seller"],a:2,r:"Rule 6.6",e:"Options with both sides: transaction-broker for both, or single agent for one while the other is a customer."},
{x:"S",c:"Brokerage Relationships",q:"If no closing occurs and the agreement has no stated end, a brokerage relationship terminates no later than:",o:["90 days","Six months","One year after the date of the agreement","Three years"],a:2,r:"C.R.S. 12-10-409",e:"It ends at the earlier of performance, the agreed expiration, termination by a party, or one year after the engagement date."},
{x:"S",c:"Brokerage Relationships",q:"After a brokerage relationship ends, the broker still owes the former client:",o:["Loyalty in future transactions","Accounting for money and property, and keeping confidential information confidential","Nothing","Continued marketing"],a:1,r:"C.R.S. 12-10-409",e:"Two surviving duties: account for all money and property, and maintain confidentiality."},
{x:"S",c:"Brokerage Relationships",q:"The seller pays the commission of the buyer's broker. That payment:",o:["Makes the buyer's broker the seller's agent","Creates dual agency","Does not by itself create a brokerage relationship","Is prohibited"],a:2,r:"C.R.S. 12-10-410",e:"Compensation alone never creates a brokerage relationship. The written agreement and disclosures do."},
{x:"S",c:"Brokerage Relationships",q:"A client is sued over a misstatement the client's agent made that the client knew nothing about. Under Colorado law the client:",o:["Is fully liable for the agent's acts","Is not vicariously liable for acts the client did not approve, direct or ratify","Is liable only for half","Must indemnify the broker"],a:1,r:"C.R.S. 12-10-403",e:"No vicarious liability for the public: a client is not liable for the broker's misrepresentation unless the client knew or approved. Agents must tell clients this."},
{x:"S",c:"Brokerage Relationships",q:"Every employing broker's written office policy on brokerage relationships must:",o:["Offer only transaction-brokerage","Identify the relationships offered to the public and apply to all licensees in the firm","Be approved by each client","Prohibit in-house sales"],a:1,r:"Rule 6.4 / C.R.S. 12-10-408",e:"The policy identifies and describes the relationships the firm offers, the designation procedure, and protections for confidential information."},
{x:"S",c:"Brokerage Relationships",q:"A broker may be a transaction-broker for a seller under a listing, yet certain deals make neutrality hard. Commission Position 16 flags which situation as a concern?",o:["Selling a vacant lot","A broker acting as transaction-broker when selling to or for a close relative or the broker's own entity","Listing a condo","Working with a cash buyer"],a:1,r:"CP-16",e:"Where the broker has a personal stake or close relationship, staying neutral is doubtful. The broker should consider agency for one side or get informed written consent."},
{x:"S",c:"Brokerage Relationships",q:"Uniform duties owed by every broker, agent or transaction-broker, may be:",o:["Waived in writing by the client","Reduced for a lower fee","Neither waived nor limited, though more services may be added","Waived for commercial clients"],a:2,r:"CP-28",e:"Minimum service: the statutory uniform duties cannot be waived or limited, even in writing. Limited-service models must still perform all of them."},
{x:"S",c:"Brokerage Relationships",q:"A buyer wants to make an offer on a for-sale-by-owner home. The buyer's broker gives the owner which form to make clear the owner is not represented?",o:["Open Listing Addendum","Brokerage Disclosure to Seller (FSBO)","Seller's Property Disclosure","Definitions of Working Relationships only"],a:1,r:"CP-9",e:"The Brokerage Disclosure to Seller (FSBO) tells the owner the broker is working with the buyer and the owner is a customer."},
{x:"S",c:"Brokerage Relationships",q:"A team of four brokers takes a listing. Commission rules require that:",o:["Only the team leader be named","The names of all team members be disclosed in the listing contract","The team be licensed as a separate firm","Each member sign a separate listing"],a:1,r:"Rule 6.6",e:"All team members acting as designated brokers are named in the listing. If the employing broker later adds or substitutes a designated broker, the client is told in writing."},
{x:"S",c:"Brokerage Relationships",q:"A bank selling a foreclosed home requires its own listing agreement instead of the Commission form. The broker should attach the:",o:["Exclusive Brokerage Addendum","Brokerage Duties Addendum","Short Sale Addendum","Licensee Buy-Out Addendum"],a:1,r:"CP-1 / Brokerage Duties Addendum",e:"When a non-Commission listing or management form is used, the Brokerage Duties Addendum supplies the required Colorado relationship disclosures and uniform duties."},
{x:"S",c:"Brokerage Relationships",q:"An agency relationship between a broker and a seller is created by:",o:["Payment of a retainer","A verbal agreement at the listing appointment","A written agreement","Placing a sign on the property"],a:2,r:"C.R.S. 12-10-403",e:"Agency requires a written agreement. Without one, the broker is a transaction-broker, and listing agreements of any kind must be in writing under Rule 6.14."}
);

BANK.push(
// ================= STATE · COLORADO FORMS AND CONTRACTS (23 items) =================
// --- Listing and buyer agreements
{x:"S",c:"Forms & Contracts",q:"Under an Exclusive Right-to-Sell Listing Contract, the seller finds a buyer on her own during the listing period. The listing brokerage is owed:",o:["No commission","Half the commission","The full agreed commission","Only reimbursement of expenses"],a:2,r:"Exclusive Right-to-Sell",e:"Exclusive right-to-sell: the brokerage is paid if the property sells during the term, no matter who finds the buyer."},
{x:"S",c:"Forms & Contracts",q:"A seller wants to keep the right to sell the home himself without owing a commission, while still hiring one brokerage exclusively. The broker attaches the:",o:["Open Listing Addendum","Exclusive Brokerage Addendum","Brokerage Duties Addendum","Exchange Addendum"],a:1,r:"Exclusive Brokerage Addendum",e:"The Exclusive Brokerage Addendum converts the right-to-sell form into an exclusive agency listing: one brokerage, but the seller may sell on his own."},
{x:"S",c:"Forms & Contracts",q:"With an Open Listing Addendum attached to the listing contract, a commission is owed to:",o:["Every broker who showed the property","The first broker who signed","Only the broker who is the procuring cause of the sale","No one unless the seller approves"],a:2,r:"Open Listing Addendum",e:"Open listing: the seller can hire several brokerages or sell personally, and pays only the broker who actually procures the buyer."},
{x:"S",c:"Forms & Contracts",q:"A seller and listing broker agree to drop the list price and add 60 days to the term. They use the:",o:["Agreement to Amend/Extend Contract","Listing Contract Amend/Extend form","Counterproposal","Notice to Terminate"],a:1,r:"Listing Amend/Extend",e:"Listings (seller or buyer) are changed with the Listing Contract Amend/Extend form. The Agreement to Amend/Extend Contract is for the purchase contract."},
{x:"S",c:"Forms & Contracts",q:"Under the Commission-approved listing contract, forfeited earnest money that the seller receives after a buyer default is:",o:["Kept entirely by the seller","Kept entirely by the brokerage","Divided between the brokerage firm and the seller","Sent to the Commission"],a:2,r:"Exclusive Right-to-Sell",e:"The listing contract provides that forfeited payments are divided between the brokerage firm and the seller, with the firm's share not exceeding its commission."},
{x:"S",c:"Forms & Contracts",q:"The Seller's Property Disclosure form is completed by:",o:["The listing broker from the MLS data","The seller, based on the seller's current actual knowledge","The home inspector","The title company"],a:1,r:"Seller's Property Disclosure",e:"The seller completes it to the seller's current actual knowledge. The broker should never fill it in. Known latent defects must be disclosed regardless of the form."},
{x:"S",c:"Forms & Contracts",q:"Under the Exclusive Right-to-Buy Listing Contract, the brokerage's success fee is:",o:["Earned when the buyer signs the agreement","Earned upon purchase of the property and payable at closing","Earned when an offer is submitted","Always paid by the buyer in cash"],a:1,r:"Exclusive Right-to-Buy",e:"Earned on purchase, payable at closing. The broker may not accept compensation from anyone else in connection with the property without the buyer's written consent."},
{x:"S",c:"Forms & Contracts",q:"A Commission form says an act is due three days after MEC and gives no ending date. How are the days counted?",o:["The first day is included and the last day excluded","The first day is excluded and the last day is included","Only business days count","Both the first and last days are excluded"],a:1,r:"CBS §3.3 / listing forms",e:"Exclude the first day, include the last. If MEC is Monday, three days after is Thursday. Deadlines run to 11:59 p.m. Mountain Time unless a time is stated."},
{x:"S",c:"Forms & Contracts",q:"A buyer is worried about registered sex offenders near a home. Under the buyer listing contract the buyer should:",o:["Rely on the listing broker's statement","Contact local law enforcement for the information","Ask the seller to certify the neighborhood","Request the data from the Commission"],a:1,r:"Megan's Law provision",e:"The forms tell the buyer to contact local law enforcement. Brokers do not research or represent this."},
{x:"S",c:"Forms & Contracts",q:"A dispute arises under a Commission-approved listing or purchase contract. The parties must first:",o:["File suit in district court","Submit the matter to mediation in good faith","Complain to the Commission","Arbitrate before the local board"],a:1,r:"Mediation clause",e:"Mediation comes first. It is not binding unless the parties sign a written settlement."},
// --- Contract to Buy and Sell
