const FORMULAS=[
["Commission","Price x rate. Then split step by step: firm share, then agent share."],
["Price to net","(Seller's desired net + fixed costs) / (1 - commission rate). Never multiply the net by 1 + rate."],
["IRV","Income = Rate x Value. Value = NOI / cap rate. Rate = NOI / value."],
["NOI","Potential gross income - vacancy = effective gross income. EGI - operating expenses = NOI. No debt service, no depreciation."],
["GRM","Value = monthly gross rent x gross rent multiplier."],
["Cost approach","Land value + (cost new - depreciation). Straight-line depreciation = effective age / economic life."],
["Comps","Adjust the comparable, never the subject. Comp better, subtract. Comp inferior, add."],
["LTV","Loan / the lower of price or appraised value. Down payment = that value - loan."],
["Points","1 point = 1% of the loan amount."],
["Interest","Monthly interest = balance x annual rate / 12. Principal paid = payment - interest."],
["PITI","P&I + annual taxes / 12 + annual insurance / 12."],
["Property tax","Assessed value x mill levy / 1,000. In Colorado: actual value x assessment rate = assessed value."],
["Proration","Daily rate = annual / 365 (or / 360 if told), monthly / actual days. Multiply by the days each party owns. Check who owns the day of closing."],
["Arrears vs advance","Paid in arrears (taxes): debit seller, credit buyer. Paid in advance by the seller (HOA dues): debit buyer, credit seller. Rent the seller collected: debit seller, credit buyer."],
["Debits and credits","Price: debit buyer, credit seller. Earnest money and new loan: credit buyer. Payoff and commission: debit seller."],
["Percent change","(New - old) / old. To find the original after a gain: new / (1 + rate)."],
["Area","Rectangle: length x width. Acres = square feet / 43,560. Fractional sections: 640 / each denominator."],
["Doc fee (CO)","Price / 100, round up, x $0.01."]
];

const GUIDE=[{"id": "co-commission", "x": "S", "c": "Commission", "t": "The Real Estate Commission: makeup, powers and discipline", "notes": ["The license law (C.R.S. Title 12, Article 10) exists to protect the public. The Division of Real Estate sits inside the Department of Regulatory Agencies (DORA); the Commission is the appointed body that makes rules and disciplines licensees.", "Five commissioners, appointed by the governor, three-year terms: three brokers with five or more years of experience (one in property management) and two members of the public.", "The Commission can investigate on its own motion and must investigate a written complaint. It can subpoena, hold hearings before an administrative law judge, and ask a court for an injunction.", "Discipline: censure, probation, fine up to $2,500 per offense, suspension, revocation. Only the Commission itself can deny, suspend or revoke. After revocation, no reapplication for one year.", "Unlicensed practice is a crime, a class 2 misdemeanor. A subdivision developer who fails to register commits a class 6 felony.", "A licensee acting for their own account is still under the Commission's authority (Seibel). Position statements are the Commission's published reading of the law, not statutes."], "trap": "The Commission does not set commission rates and does not settle fee disputes between brokers.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 3, "of": 7, "h": "12-10-206: The Real Estate Commission"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 3, "of": 7, "h": "12-10-217: Commission Investigative Authority"}, {"d": "Colorado Legal Issues Section", "ch": "Ethics and Rules Governing Brokers", "p": 2, "of": 5, "h": "The Seibel Case"}]}, {"id": "co-lic-get", "x": "S", "c": "Licensing", "t": "Getting licensed: education, exam, license levels and exemptions", "notes": ["Minimum age 18. Education is 168 hours: Law and Practice 48, Contracts and Regulations 48, Closings 24, Trust Accounts 8, Current Legal Issues 8, Practical Applications 32. Attorneys take 12 hours.", "Exam scores are good for one year. Fingerprints go to the Colorado Bureau of Investigation before the application. A preliminary advisory opinion on a criminal record can be requested any time.", "Single licensing since 1997: everyone is a broker. Levels are associate broker, independent broker and employing broker.", "A new licensee works two years as an associate under an employing broker before going independent. An employing broker needs that experience (two of the last five years) plus the 24-hour Brokerage Administration course.", "A temporary broker license covers a firm that loses its broker: 90 days, no more than two in 18 months. Out-of-state applicants supply a license history dated within 90 days.", "Exempt from licensing: owners acting for themselves, a regularly salaried on-site apartment manager, an uncompensated attorney-in-fact under a recorded power of attorney, attorneys practicing law, trustees, executors, guardians, public officials, and mineral and oil and gas lease dealers."], "trap": "A finder's fee to an unlicensed friend is not an exemption. Being paid for negotiating for someone else is what triggers the license requirement.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 3, "of": 7, "h": "12-10-203: License Application"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 2, "of": 9, "h": "2.1 Educational Requirements"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 2, "of": 7, "h": "12-10-201: Definitions"}]}, {"id": "co-lic-keep", "x": "S", "c": "Licensing", "t": "Keeping the license: renewal, continuing education, E&O and status", "notes": ["The first license expires December 31 of the year it is issued. After that the cycle is three calendar years. Firm licenses are not renewed; inactive individual licenses still are.", "Continuing education: 24 hours per cycle. Twelve hours are three different 4-hour Annual Commission Update courses (70% to pass); twelve are electives. No more than eight hours in a day. Keep certificates four years.", "Reinstatement: within 31 days, no penalty. Up to one year, renewal fee plus half. One to three years, renewal fee plus a full reinstatement fee.", "Errors and omissions insurance is required for every active license: at least $100,000 per claim and $300,000 annual aggregate. A lapse can put the license on inactive status.", "If the employing broker's license expires, is suspended or revoked, the associates' licenses go inactive.", "Report a conviction or plea, a fair housing violation or discipline in another state to the Commission in writing within 30 days. A resident broker other than an employed associate or inactive broker must keep a Colorado place of business."], "trap": "Initial license expiry is the calendar year end, not an anniversary date.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 3, "of": 9, "h": "3.11 Renewal"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 3, "of": 9, "h": "3.9 Errors and Omissions (E&O) Insurance"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 3, "of": 9, "h": "3.15 License Reinstatement"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 4, "of": 9, "h": "4.1 Continuing Education Requirement"}]}, {"id": "co-act-adv", "x": "S", "c": "Licensee Activities", "t": "Advertising, teams and trade names", "notes": ["All advertising is in the name of the brokerage firm. The only exception is a broker's own property that is not listed with the firm, and licensed status is still disclosed.", "Online: the firm name appears on every viewable page, or within one click when space is limited. Remove an expired listing from electronic media within three days.", "Team names cannot include realty, real estate, company, corporation, Inc., LLC or anything suggesting a separate firm, and the firm's name must be clear in team advertising.", "One trade name per firm. A sole proprietor cannot use a name that implies an entity.", "Do not advertise another firm's listing without permission, and name the listing firm conspicuously. Do not advertise a price other than the one agreed with the owner.", "A market analysis prepared for anything other than an anticipated sale or purchase must say it is not an appraisal. Brokers need not measure square footage, but must state the source accurately."], "trap": "A broker selling their own unlisted home may leave the firm name off, but may not leave out that they are licensed.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.10 Advertising"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 2, "of": 9, "h": "2.9 Broker Qualifications for Sole Proprietors"}]}, {"id": "co-act-comp", "x": "S", "c": "Licensee Activities", "t": "Commissions, referral fees, rebates and affiliated businesses", "notes": ["An associate broker is paid only by the employing broker. The firm may pay an associate's wholly owned entity.", "A commission is earned when the sale closes, or when the seller refuses or neglects to close. It is not earned when the buyer walks because of defects in the seller's title, unless the seller cures them in a reasonable time.", "Referral fees need reasonable cause: an actual introduction of business, or a contractual referral or cooperative brokerage relationship. Never to an unlicensed person for licensed activity.", "An out-of-state broker can receive a referral fee when that broker has an office elsewhere and the Colorado broker does all the advertising, negotiating and contracting.", "A broker may rebate part of the fee to the broker's own client, disclosed on the closing documents and approved by the lender.", "Affiliated business arrangement: disclose the ownership interest in writing before referring, and never require use of the affiliate. RESPA bans kickbacks for settlement service referrals.", "In a residential sale a broker cannot lien the property or block the transfer to collect a commission. If the seller fails to close through no fault of the buyer, the buyer gets all the earnest money back."], "trap": "Who pays the commission never decides who the broker works for.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 3, "of": 7, "h": "12-10-301: When Entitled"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.21 Referral Fees and RESPA"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.22 Prohibited Remedies for Compensation"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 2, "of": 9, "h": "CP-4: Broker’s Payment or Rebating of a Portion of an Earned Commission"}]}, {"id": "co-act-sup", "x": "S", "c": "Licensee Activities", "t": "Supervision, office policy, assistants and competency", "notes": ["An employing broker supervises every licensee and employee. Associates with less than two years of experience get a high level of supervision: training, contract review, monitoring from contract to closing.", "Supervision can be delegated in writing to an experienced broker; both then share responsibility. It cannot be contracted away.", "Every firm has a written office policy manual, given to and signed by each licensee, covering the relationships offered, designation of brokers and protection of confidential and personal information.", "Unlicensed assistants do clerical and delivery work. They do not give opinions, advice or interpretation, negotiate, or do anything that needs a license.", "Competency (Rule 6.2): if you lack experience with a property type, decline, get trained, bring in a qualified broker or attorney, or co-list.", "A listing belongs to the firm. When an associate changes firms the listing stays unless it is assigned with the seller's written consent."], "trap": "The employing broker is not automatically disciplined for an associate's violation, only when there was knowledge of it or a failure to supervise.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.3 Employing Broker’s Responsibilities and Supervision"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.2 Competency"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 5, "of": 9, "h": "CP-20: Licensed and Unlicensed Real Estate"}]}, {"id": "co-act-list", "x": "S", "c": "Licensee Activities", "t": "Listings, offers, sign-crossing and the practice of law", "notes": ["Every listing is in writing, signed before services start, with a definite termination date. Holdover protection covers only buyers whose names were given to the seller in writing when the listing ended.", "Sign-crossing: do not solicit an owner you know has an unexpired exclusive listing. If the owner makes contact first, you may discuss and even sign a listing that starts after the current one expires.", "All offers go to the listing broker and are presented. Copies of every document go to the parties when they sign.", "Before closing, recommend a title examination and legal counsel. Closing fees must be itemized and agreed to in writing.", "Conway-Bogue gives brokers a narrow right to complete standard forms for their own transactions at no separate charge. Lease options, lease-purchases and installment land contracts go to an attorney.", "Disclose licensed status in writing whenever you buy, sell or lease for yourself. Lockbox codes and access information stay with authorized people only. Nightly vacation rentals are licenses to use, not leases."], "trap": "If the owner calls you while listed elsewhere, you may talk about a future listing. You may not interfere with the current one.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.14 Contracts"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.17 Duty to Disclose Conflict of Interest and License Status"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Contract Case Law, Statutes, and Regulations", "p": 2, "of": 7, "h": "Conway-Bogue and Related Cases"}]}, {"id": "co-add-ll", "x": "S", "c": "Additional Topics", "t": "Landlord and tenant law and property management", "notes": ["Managing or leasing for others for pay requires a broker license. The regularly salaried on-site manager is the exception.", "Security deposit: return it with an itemized statement within one month, or up to 60 days if the lease says so. Never keep it for normal wear and tear.", "Willful wrongful retention: treble damages plus costs and attorney fees, after the tenant gives seven days' notice.", "Hazardous gas condition: repair within 72 hours of notice or the tenant may leave and the lease is void.", "Warranty of habitability: the landlord must keep the unit fit to live in and respond to notice promptly. Eviction goes through the court; no lockouts.", "A manager may hand deposits to the owner only if tenants are told who holds them and the management agreement makes the owner responsible."], "trap": "The 60-day outside limit only applies when the lease says so. With a silent lease the answer is one month.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 5, "of": 7, "h": "Security Deposits"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 5, "of": 7, "h": "Warranty of Habitability and Other Provisions"}, {"d": "Colorado Practical Applications Section Part 2", "ch": "Property Management", "p": 6, "of": 13, "h": "Security Deposits"}]}, {"id": "co-add-water", "x": "S", "c": "Additional Topics", "t": "Water rights and wells", "notes": ["Colorado follows prior appropriation: first in time, first in right. A water right is a right to use water, not ownership of it.", "Water rights are real property but do not pass automatically with land. They must be described and conveyed in the deed or a separate instrument.", "The exception in your course: a domestic household well transfers with the home.", "When a property with a well changes hands, the change of ownership is reported to the Division of Water Resources. Under the Closing Instructions the closing company files it within 60 days after closing.", "Residential sellers disclose the source of potable water (Source of Water Addendum). The contract lists deeded water, well rights and ditch stock separately."], "trap": "Riparian rights are the national answer for land on a river. Colorado is not a riparian state.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 4, "of": 7, "h": "Water Rights"}, {"d": "Colorado Legal Issues Section", "ch": "Other Colorado Laws Affecting Real Estate", "p": 4, "of": 7, "h": "Change of Ownership of Wells in Colorado"}, {"d": "Colorado Closing Section", "ch": "Closing Responsibilities and Commission Rules", "p": 4, "of": 7, "h": "Water Rights"}]}, {"id": "co-add-tax", "x": "S", "c": "Additional Topics", "t": "Colorado property taxes and nonresident withholding", "notes": ["Taxes become a lien January 1 and are paid in arrears the next year: in full by April 30, or half by the last day of February and half by June 15. Late interest is 1% a month.", "Math: actual value x assessment rate = assessed value. Assessed value x mill levy = tax. A mill is one-tenth of a cent, so divide mills by 1,000.", "Unpaid taxes go to a tax lien sale. The buyer gets a certificate of purchase; the owner can redeem. After three years the holder can apply for a treasurer's deed.", "The treasurer collects and certifies taxes due. The assessor values property. The Real Property Transfer Declaration (TD-1000) feeds the assessor.", "Colorado withholding on a nonresident seller: the lesser of 2% of the sales price or the net proceeds, on sales of $100,000 or more, sent to the Department of Revenue within 30 days."], "trap": "The exam gives you the assessment rate and mill levy. The steps matter, not a memorized rate.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 2, "of": 7, "h": "Property Tax Liens"}, {"d": "Colorado Closing Section", "ch": "Introduction to the Worksheet for Real Estate Settlement", "p": 4, "of": 7, "h": "Prorating Taxes"}, {"d": "Colorado Closing Section", "ch": "Introduction to the Worksheet for Real Estate Settlement", "p": 4, "of": 7, "h": "Withholding Tax"}]}, {"id": "co-add-fh", "x": "S", "c": "Additional Topics", "t": "Colorado Fair Housing Act", "notes": ["Colorado covers the seven federal classes and adds marital status, ancestry and creed.", "It reaches further than federal law: commercial property is covered, and so are owner-occupied one-to-four unit buildings that federal law exempts.", "Complaints go to the Colorado Civil Rights Commission within one year of the act.", "A fair housing violation must be reported to the Real Estate Commission within 30 days and is grounds for discipline."], "trap": "If a question involves a commercial lease and religion or marital status, federal fair housing law does not apply but Colorado's does.", "src": [{"d": "Colorado Legal Issues Section", "ch": "Colorado Laws Related to Real Estate", "p": 2, "of": 9, "h": "Fair Housing"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Contract Case Law, Statutes, and Regulations", "p": 3, "of": 7, "h": "Colorado Fair Housing Act"}]}, {"id": "co-add-fc", "x": "S", "c": "Additional Topics", "t": "Foreclosure and the Foreclosure Protection Act", "notes": ["Colorado deeds of trust name the public trustee. The lender files a notice of election and demand; the trustee records it and sets the sale 110 to 125 days out (215 to 230 for agricultural land).", "The lender also needs a court order authorizing sale (Rule 120 hearing).", "The owner may cure by paying what is past due until noon the day before the sale. There is no owner redemption after the sale.", "Junior lienors may redeem: notice of intent within eight business days after the sale, then in order of priority. The purchaser ends up with a confirmation deed.", "Foreclosure Protection Act: applies when the home is the seller's principal residence, it is in foreclosure or 30 days delinquent, and the buyer will not live in it. The owner can cancel within three business days or by noon the day before the sale, and can cancel a foreclosure consultant's contract at any time.", "Equity skimming is a class 5 felony."], "trap": "Cure belongs to the owner before the sale. Redemption belongs to lienholders after it.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 3, "of": 7, "h": "Foreclosure Process"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 3, "of": 7, "h": "Right to Cure"}, {"d": "Colorado Legal Issues Section", "ch": "Other Colorado Laws Affecting Real Estate", "p": 4, "of": 7, "h": "Colorado Foreclosure Protection Act"}]}, {"id": "co-add-other", "x": "S", "c": "Additional Topics", "t": "Other Colorado laws: adverse possession, subdivisions, timeshares, homestead, disclosures", "notes": ["Adverse possession: 18 years, or 7 with color of title and payment of taxes, plus a good faith belief of ownership.", "Subdivision: 20 or more residential interests. The developer registers with the Commission and does not need a broker license. Timeshare buyers have five calendar days to rescind.", "CCIOA governs condominiums, cooperatives and planned communities and their associations.", "Homestead exemption: $250,000 of equity, $350,000 for elderly or disabled owners.", "Builder gives a new-home buyer a soils and hazard summary at least 14 days before closing. Every residential contract carries the special taxing district disclosure.", "Psychological impacts (a death, a felony, an occupant's HIV status) are not material facts and need the seller's consent to disclose. Known meth contamination that was not remediated must be disclosed.", "An owner can deed to self and another as joint tenants. Tenancy in common is the default. Colorado has no tenancy by the entirety and no community property. The Consumer Protection Act allows treble damages."], "trap": "Stigma is not a defect in Colorado. Physical facts such as a meth lab or a leaking roof are.", "src": [{"d": "Colorado Legal Issues Section", "ch": "Other Colorado Laws Affecting Real Estate", "p": 2, "of": 7, "h": "Colorado Law on Adverse Possession"}, {"d": "Colorado Legal Issues Section", "ch": "Colorado Laws Related to Real Estate", "p": 4, "of": 9, "h": "Psychologically Impacted Property"}, {"d": "Colorado Legal Issues Section", "ch": "Colorado Laws Related to Real Estate", "p": 3, "of": 9, "h": "Disclosure of Special Taxing District"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Contract Case Law, Statutes, and Regulations", "p": 3, "of": 7, "h": "Subdivisions, Conversions, and Timesharing"}]}, {"id": "co-trust", "x": "S", "c": "Records & Trust", "t": "Trust accounts and record keeping", "notes": ["Money belonging to others goes into a trust or escrow account in the broker's or firm's name, labeled as such. No account is needed if the broker never holds others' money.", "Deposit within three business days of receipt or contract acceptance, whichever is later. Property management money: five business days. Rents and security deposits go in separate accounts.", "Commingling is mixing others' money with yours. Conversion is using it for something else. A small amount of the broker's money may sit in the account for bank fees, on its own ledger.", "Records: a journal for the whole account, a ledger for each beneficiary, and a monthly three-way reconciliation of journal, ledgers and bank statement. No ledger ever goes negative. Cash basis unless agreed otherwise.", "Take earned fees out at least monthly. Report to owners within 30 days after any month with activity. Mark-ups on vendor bills need the client's written approval in advance.", "If the contract names a title company as holder, deliver the check and keep a dated, signed receipt. If earnest money is a promissory note, tell the seller its due date and tell the seller promptly if it is not paid.", "Keep transaction files four years. Funds must be available on demand unless every party agrees otherwise. Interest belongs to the parties unless they agree in writing."], "trap": "Three business days is the general rule and five is only for property management. The older next-business-day rule is no longer in your course.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 5, "of": 9, "h": "5.7 Time Limits for Deposits of Money Belonging to Others"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 5, "of": 9, "h": "5.14 Recordkeeping Requirements"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.20 Transaction File Requirements"}, {"d": "Colorado Closing Section", "ch": "Closing Responsibilities and Commission Rules", "p": 3, "of": 7, "h": "Rule 5"}]}, {"id": "co-br-types", "x": "S", "c": "Brokerage Relationships", "t": "Relationship types: transaction-broker, single agent, customer", "notes": ["Two relationships are available with the public: single agent or transaction-broker. A person with no brokerage relationship is a customer.", "Transaction-broker is the default. Agency exists only under a written agreement.", "A transaction-broker assists one or both sides with skill and care and without advocating for either.", "Dual agency is prohibited. A broker also cannot be agent for one side and transaction-broker for the other. Allowed with both sides: transaction-broker for both, or agent for one with the other as a customer.", "The relationship ends at performance, expiration, or termination, and no later than one year after it began if no date was set. Afterward the broker still owes accounting and confidentiality.", "Paying the fee does not create the relationship. A client is not liable for a broker's misstatement the client did not know of or approve.", "Staying neutral is doubtful when the broker is a principal or works with family, close friends or the broker's own team (CP-16)."], "trap": "On a national question, dual agency with written consent may be the right answer. On a Colorado question it never is.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 4, "of": 7, "h": "12-10-403: Relationships Between Brokers and the Public"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 4, "of": 7, "h": "12-10-406: Dual Agent"}, {"d": "Colorado Practical Applications Section Part 1", "ch": "Brokerage Relationships", "p": 3, "of": 12, "h": "Brokerage Relationships in Real Estate"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 5, "of": 9, "h": "CP-16: Acting as a Transaction-Broker in Particular"}]}, {"id": "co-br-duties", "x": "S", "c": "Brokerage Relationships", "t": "Uniform duties, disclosure of defects and confidentiality", "notes": ["Every broker owes the uniform duties: perform the agreement, use reasonable skill and care, present all offers on time, account for money and property, advise the party to get expert help, and disclose adverse material facts actually known.", "A single agent adds three: promote the client's interests with utmost good faith, loyalty and fidelity; seek price and terms acceptable to the client; counsel on material benefits and risks.", "Uniform duties cannot be waived or cut back, even in writing or for a lower fee (CP-28).", "Confidential without consent: willingness to take less or pay more, motivation, willingness to accept other terms, and facts that could psychologically stigmatize a property.", "Never confidential: known adverse material facts about the property. A buyer's broker also discloses known adverse facts about the buyer's ability to perform.", "No duty to inspect the property independently or to verify what a seller, buyer or inspector says."], "trap": "Loyalty does not cover hiding a defect. A known leak is disclosed whether the broker is an agent or a transaction-broker.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Statutes", "p": 4, "of": 7, "h": "12-10-404: Seller/Landlord"}, {"d": "Colorado Practical Applications Section Part 1", "ch": "Brokerage Relationships", "p": 4, "of": 12, "h": "Seller or Owner Uniform Duties"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 7, "of": 9, "h": "CP-27: Broker Disclosure of Adverse Material Facts"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 7, "of": 9, "h": "CP-28: Minimum Service Requirements"}]}, {"id": "co-br-disc", "x": "S", "c": "Brokerage Relationships", "t": "Disclosure forms, designated brokers and changing status", "notes": ["Disclose the relationship in writing before eliciting or discussing confidential information such as motivation or finances.", "Brokerage Disclosure to Buyer/Tenant: used when there is no written agreement, to say the person is a customer or will be assisted by a transaction-broker. Brokerage Disclosure to Seller is the for-sale-by-owner version.", "Designated brokerage: in a firm with more than one licensee the employing broker designates, in writing, who works with the client. Knowledge is not imputed to the firm or other brokers, so two brokers in one firm can each be an agent for opposite sides.", "A designated broker may share a client's confidential information with a supervising broker when the client has consented, which the approved listing forms provide.", "If a seller's agent ends up assisting the buyer too, the broker becomes a transaction-broker for both and gives the Change of Status disclosure. If the seller did not agree to that, the buyer stays a customer.", "Showing a home and preparing an offer for a customer are ministerial tasks and do not create a relationship. Teams list every member in the listing. A non-Commission listing form needs the Brokerage Duties Addendum."], "trap": "Brokerage Disclosure to Buyer is a notice, not a contract. A buyer's refusal to sign is noted in the file.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.5 Brokerage Relationships Disclosures in Writing"}, {"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 6, "of": 9, "h": "6.9 Change of Status Disclosure in Writing"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Right-to-Buy (Buyer Brokerage) Agreements", "p": 6, "of": 10, "h": "Brokerage Disclosure to Buyer/Tenant"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Contract Case Law, Statutes, and Regulations", "p": 4, "of": 7, "h": "Designated Brokerage"}]}, {"id": "co-f-listing", "x": "S", "c": "Forms & Contracts", "t": "Listing contracts and buyer agreements", "notes": ["Exclusive Right-to-Sell: the firm is paid if the property sells during the term, whoever finds the buyer.", "Exclusive Brokerage Addendum: one firm, but the seller may sell personally and owe nothing. Open Listing Addendum: only the broker who procures the buyer is paid.", "Exclusive Right-to-Buy Listing Contract: the success fee is earned on purchase and payable at closing. No compensation from anyone else without the buyer's written consent.", "Changes to a listing go on the Listing Contract Amend/Extend form.", "The seller completes the Seller's Property Disclosure from current actual knowledge. The broker never fills it in.", "Forfeited earnest money under a listing is divided between the firm and the seller. Disputes go to mediation first. Sex offender questions go to local law enforcement.", "Counting days: skip the first day, count the last. Deadlines run to 11:59 p.m. Mountain Time unless stated."], "trap": "Amend/Extend has two versions. The listing version changes a listing; the Agreement to Amend/Extend Contract changes a purchase contract.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Right-to-Sell (Listing) Agreements", "p": 2, "of": 9, "h": "Exclusive Right-to-Sell Listing Contract"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Right-to-Sell (Listing) Agreements", "p": 2, "of": 9, "h": "Exclusive Brokerage Addendum"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Right-to-Sell (Listing) Agreements", "p": 6, "of": 9, "h": "Listing Contract Amend/Extend"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Right-to-Buy (Buyer Brokerage) Agreements", "p": 3, "of": 10, "h": "EXCLUSIVE RIGHT-TO-BUY LISTING CONTRACT"}]}, {"id": "co-f-cbs1", "x": "S", "c": "Forms & Contracts", "t": "Contract to Buy and Sell: versions, deadlines, money and title transfer", "notes": ["Versions: Residential (one to four units the buyer will live in), Income-Residential, Commercial, Land, and a Foreclosure Protection Act version. Mixed use takes the Land or Commercial form plus the Residential Addendum.", "MEC is the date both parties have signed. The Dates and Deadlines table drives everything. A line left blank or marked N/A removes that provision.", "The contract is not assignable by the buyer unless Additional Provisions say so.", "Earnest money sits in the holder's trust account for both parties and is released only on mutual written instructions or a court order.", "Inclusions stay and pass by bill of sale. Exclusions leave. Water rights, well rights and ditch stock each have their own line.", "If no other deed is chosen, the seller conveys by special warranty deed."], "trap": "A blank deadline is not an open deadline. It deletes the right that depended on it.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 2, "of": 9, "h": "§2 Parties and Property"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 2, "of": 9, "h": "§3 Dates, Deadlines and Applicability"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 2, "of": 9, "h": "§4 Purchase Price and Terms"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 4, "of": 9, "h": "§13 Transfer of Title"}]}, {"id": "co-f-cbs2", "x": "S", "c": "Forms & Contracts", "t": "Contract to Buy and Sell: contingencies and the right to terminate", "notes": ["Each contingency has its own deadline. Miss it and that exit is waived.", "Loan: separate deadlines for loan terms and loan availability. Appraisal: object or terminate by the Appraisal Objection Deadline if value comes in low.", "Title: record title from the commitment, and off-record matters the seller must disclose (unrecorded easements, leases, boundary agreements). Each has an objection deadline.", "Survey: an Improvement Location Certificate is cheaper and less detailed than a survey and is not for setting fences.", "Inspection: Inspection Objection Notice by the objection deadline, or Notice to Terminate by the termination deadline. No written resolution by the Inspection Resolution Deadline ends the contract unless the buyer withdraws the objection.", "Property insurance, due diligence documents and association documents each carry a termination deadline.", "Disclosures in the form: lead-based paint for pre-1978 housing, carbon monoxide alarm within 15 feet of bedroom entrances, methamphetamine, radon, special taxing districts. Termination is by the Notice to Terminate form."], "trap": "An unresolved inspection objection terminates the contract. It does not force the seller to repair.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 3, "of": 9, "h": "§5 Financing Conditions and Obligations"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 3, "of": 9, "h": "§8 Title Insurance, Record Title and Off-Record Title"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 4, "of": 9, "h": "§10 Property Disclosure, Inspection, Indemnity"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contract-Related Forms", "p": 3, "of": 7, "h": "Inspection Objection Notice"}]}, {"id": "co-f-cbs3", "x": "S", "c": "Forms & Contracts", "t": "Contract to Buy and Sell: possession, damage, default and disputes", "notes": ["Possession is delivered on the Possession Date. A seller who stays is subject to eviction and owes the per-day amount in the contract.", "Damage before closing: up to 10% of the price, the seller repairs. More than that, or not repaired, the buyer may terminate.", "Time is of the essence. Every date is strict.", "Buyer default: liquidated damages is the default remedy, so the seller keeps the earnest money. Specific performance applies only if that box is checked.", "Seller default: the buyer may cancel and recover the earnest money and damages, or seek specific performance.", "Earnest money disputes: the holder need not pick a side. It may wait, interplead, or return the money to the buyer if no lawsuit is delivered within 120 days of its notice. Mediation comes before litigation."], "trap": "Liquidated damages limits the seller to the earnest money. The seller cannot keep it and also sue for more.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 5, "of": 9, "h": "§18 Causes of Loss, Insurance; Damage to Inclusions"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contracts", "p": 5, "of": 9, "h": "§20 Time of Essence, Default and Remedies"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 3, "of": 9, "h": "CP-6: Release of Earnest Money Deposits"}]}, {"id": "co-f-forms", "x": "S", "c": "Forms & Contracts", "t": "Companion forms and addenda", "notes": ["Counterproposal: used before a contract exists. The party countering signs the counterproposal only, not the contract.", "Agreement to Amend/Extend Contract: changes terms or dates after MEC, signed before the deadline it changes.", "Closing Instructions: buyer, seller and the closing company. Nothing of value is released until good funds are in.", "Earnest Money Receipt documents the deposit. Earnest Money Release returns it; the seller signs within three days when the buyer is entitled to it.", "Post-Closing Occupancy Agreement: seller stays after closing, 30 days maximum.", "Short Sale Addendum (lender must approve), Licensee Buy-Out Addendum (a licensee agrees to buy the listing), Exchange Addendum (1031), Source of Water Addendum.", "Real Property Transfer Declaration (TD-1000) goes to the county assessor with the deed. The Foreclosure Protection Act contract version carries the homeowner warnings and cancellation notice."], "trap": "Counterproposal before the deal, Amend/Extend after it.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contract-Related Forms", "p": 3, "of": 7, "h": "Counterproposal"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contract-Related Forms", "p": 3, "of": 7, "h": "Agreement to Amend/Extend Contract"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contract-Related Forms", "p": 4, "of": 7, "h": "Closing Instructions"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Sales Contract-Related Forms", "p": 5, "of": 7, "h": "Real Property Transfer Declaration"}]}, {"id": "co-f-std", "x": "S", "c": "Forms & Contracts", "t": "Use of standard forms", "notes": ["When a Commission-approved form fits the transaction, a broker must use it. That duty is the other side of the Conway-Bogue privilege.", "Allowed changes: the firm's identifying information, transaction-specific terms in Additional Provisions, and insertions or deletions the parties negotiated. Explain every change to the client.", "Not allowed: language protecting the broker, or changes to the preprinted advisories.", "Clauses drafted by an attorney may be used. Keep the clause and the attorney's name for four years.", "Principals such as builders and banks may use their own contracts. The broker still makes the required Commission disclosures and keeps the file.", "A broker signs for a client only under a written power of attorney. Real estate contracts must be in writing to be enforced."], "trap": "A broker never charges separately for completing forms.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "License Law Regulations", "p": 7, "of": 9, "h": "7.1 Standard Forms"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Contract Case Law, Statutes, and Regulations", "p": 5, "of": 7, "h": "Chapter 7: Use of Standard Forms"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Real Estate Commission Position Statements", "p": 2, "of": 9, "h": "CP-1: Contracts Provided by Principals Selling Real"}]}, {"id": "co-f-fin", "x": "S", "c": "Forms & Contracts", "t": "Promissory notes, deeds of trust and seller financing", "notes": ["The note is the promise to pay. The deed of trust secures it with the property.", "Deed of trust parties: trustor is the borrower, beneficiary is the lender, and the trustee is the public trustee, who releases the deed of trust at payoff and conducts foreclosure.", "Three approved deeds of trust. Strict: any transfer makes the loan due. Creditworthy: a new owner may assume if the lender approves their credit. Assumable: transferable without the lender's consent.", "Approved notes: Earnest Money Promissory Note, Promissory Note, and the UCCC note for consumer credit. The notes allow prepayment without penalty.", "The UCCC limits consumer credit terms and gives a balloon refinance right on certain second-lien loans.", "Seller financing beyond these forms is attorney work."], "trap": "Trustor gives, beneficiary receives. Students most often swap those two.", "src": [{"d": "Colorado Contracts and Regulations Section", "ch": "Promissory Notes and Deeds of Trust", "p": 2, "of": 5, "h": "Promissory Notes"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Promissory Notes and Deeds of Trust", "p": 2, "of": 5, "h": "Deeds of Trust"}, {"d": "Colorado Contracts and Regulations Section", "ch": "Liens, Foreclosures, and Other Considerations", "p": 4, "of": 7, "h": "Financing—UCCC"}]}, {"id": "co-cl-pro", "x": "S", "c": "Closing", "t": "Prorations", "notes": ["Find the daily rate, count the days each party owns, multiply. Use a 365-day year and actual days in the month unless the question says 360 and 30.", "Colorado custom charges the buyer for the day of closing. Follow the question if it says otherwise.", "Paid in arrears and not yet billed (property taxes): the seller owes for the seller's days. Debit seller, credit buyer.", "Paid in advance by the seller (HOA dues): the buyer reimburses the buyer's days. Debit buyer, credit seller.", "Rent the seller already collected: the buyer gets the buyer's days. Debit seller, credit buyer. Tenant security deposits move the same way.", "A new loan's interest runs from closing to month end and is a buyer debit. Special assessments for work already installed are the seller's."], "trap": "Before calculating, write down three things: which calendar, who owns closing day, and whether the item was prepaid or is still owed.", "src": [{"d": "Colorado Closing Section", "ch": "Financial Settlement of the Transaction", "p": 2, "of": 6, "h": "Prorated Items"}, {"d": "Colorado Closing Section", "ch": "Financial Settlement of the Transaction", "p": 3, "of": 6, "h": "Computing Prorations"}, {"d": "Colorado Closing Section", "ch": "Introduction to the Worksheet for Real Estate Settlement", "p": 4, "of": 7, "h": "Prorating Taxes"}]}, {"id": "co-cl-stmt", "x": "S", "c": "Closing", "t": "Settlement statement: debits, credits, net proceeds and cash to close", "notes": ["A debit is what a party owes. A credit is what a party is owed or has already paid.", "Purchase price: debit buyer, credit seller. Earnest money and the new loan: credits to the buyer. Loan payoff and commission: debits to the seller.", "Seller's net = seller credits minus seller debits. Buyer's cash to close = buyer debits minus buyer credits.", "Documentary fee: one cent per $100 of consideration, rounded up to the next $100, none at $500 or less.", "By custom the seller pays for the owner's title policy and the buyer pays for the lender's policy, but the contract controls."], "trap": "The earnest money is a credit to the buyer even when the seller's side is holding it.", "src": [{"d": "Colorado Closing Section", "ch": "Financial Settlement of the Transaction", "p": 2, "of": 6, "h": "Debits and Credits"}, {"d": "Colorado Closing Section", "ch": "Introduction to the Worksheet for Real Estate Settlement", "p": 2, "of": 7, "h": "Worksheet for the Closing Statement"}, {"d": "Colorado Closing Section", "ch": "Introduction to the Worksheet for Real Estate Settlement", "p": 3, "of": 7, "h": "Documentary Fee"}]}, {"id": "co-cl-resp", "x": "S", "c": "Closing", "t": "Broker responsibilities, title evidence and federal closing rules", "notes": ["Even when a title company closes, the broker reviews the settlement statement for accuracy, signs it and gives it to the client. The associate delivers a copy to the employing broker right after closing.", "If the broker cannot attend, another licensee may, and shares responsibility.", "Good funds: wire, cashier's or certified check. Nothing is disbursed until funds are available as a matter of right.", "Title commitment: Schedule A names the insured, the land and the amount. B-1 lists requirements. B-2 lists exceptions. Good for six months; the policy follows within about 30 days of closing.", "Standard exceptions: parties in possession, unrecorded easements, survey matters, unrecorded mechanic's liens.", "TRID: Closing Disclosure three business days before closing. FIRPTA: 15% withheld from a foreign seller. Form 1099-S reports the sale."], "trap": "Hiring a closing company moves the work, not the responsibility.", "src": [{"d": "Colorado Closing Section", "ch": "Closing Responsibilities and Commission Rules", "p": 3, "of": 7, "h": "Rule 6.19"}, {"d": "Colorado Closing Section", "ch": "Closing Responsibilities and Commission Rules", "p": 4, "of": 7, "h": "Good Funds Rule"}, {"d": "Colorado Closing Section", "ch": "The Title Commitment", "p": 5, "of": 7, "h": "Schedule B-2"}, {"d": "Colorado Closing Section", "ch": "Additional Closing Matters", "p": 4, "of": 7, "h": "IRS Reporting"}]}, {"id": "na-po-real", "x": "N", "c": "Property Ownership", "t": "Real and personal property, fixtures and severable rights", "notes": ["Real property is land, what is attached to it, and the rights that go with it. Personal property is movable and passes by bill of sale.", "Fixture tests: method of attachment, adaptation, relationship of the parties, intention, agreement. Intention carries the most weight and a written agreement settles it.", "Trade fixtures belong to the tenant and come out before the lease ends. Annual crops are emblements and are personal property.", "Surface, subsurface (mineral) and air rights can be sold separately.", "Riparian rights attach to flowing water, littoral rights to lakes and oceans. Western states, Colorado included, use prior appropriation."], "trap": "An item a tenant attaches for business is not a fixture for the landlord unless it is left behind.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 3, "of": 13, "h": "Fixture Tests"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 3, "of": 13, "h": "Trade Fixtures"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 4, "of": 13, "h": "Water Rights"}]}, {"id": "na-po-est", "x": "N", "c": "Property Ownership", "t": "Estates and forms of ownership", "notes": ["Fee simple absolute is the most complete ownership. A defeasible fee can be lost if a condition is broken.", "Life estate: ends at the measuring life. The future interest is a remainder if it goes to a third party and a reversion if it returns to the grantor. A life tenant may not commit waste.", "Severalty is one owner. Tenancy in common is the default for co-owners: shares can be unequal, each can be sold or willed, no survivorship.", "Joint tenancy needs the four unities (possession, interest, time, title) and carries survivorship, which beats a will. A sale by one joint tenant makes the buyer a tenant in common.", "Condominium: fee title to the unit plus an undivided share of common elements. Cooperative: stock and a proprietary lease, which is personal property.", "Trust: trustee holds title for the beneficiary."], "trap": "Survivorship cannot be defeated by a will.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 5, "of": 13, "h": "Fee Simple Absolute"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 6, "of": 13, "h": "Life Estates"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 8, "of": 13, "h": "Joint Tenancy"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 9, "of": 13, "h": "Condominiums"}]}, {"id": "na-po-enc", "x": "N", "c": "Property Ownership", "t": "Encumbrances: liens, easements and encroachments", "notes": ["Liens are money claims. General liens reach all of a debtor's property (judgments, income taxes). Specific liens reach one property (mortgage, property tax, mechanic's lien).", "Property tax and special assessment liens come first. Most others rank by recording date.", "Easement appurtenant: benefits a neighboring parcel, has a dominant and a servient estate, and runs with the land. Easement in gross: benefits a person or utility, servient estate only.", "Easements also arise by necessity and by prescription (long open use).", "A license is personal, revocable permission and is not an interest in land.", "An encroachment is an unauthorized physical intrusion, usually found by survey."], "trap": "Appurtenant always involves two parcels. If the question mentions only one parcel and a utility, it is in gross.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 5, "of": 15, "h": "Appurtenant Easements and Easements in Gross"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 6, "of": 15, "h": "Types of Liens"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 8, "of": 15, "h": "Lien Priority"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 5, "of": 15, "h": "Encroachments"}]}, {"id": "na-po-legal", "x": "N", "c": "Property Ownership", "t": "Legal descriptions and land measurement", "notes": ["Metes and bounds: starts and ends at a point of beginning, using distances, directions and monuments.", "Lot and block: refers to a recorded subdivision plat.", "Rectangular survey: principal meridians run north-south and base lines east-west. A township is 6 miles square with 36 sections. A section is 1 mile square, 640 acres.", "Sections number from the northeast corner, running back and forth, ending with 36 in the southeast.", "Fractional descriptions: start at 640 and divide by each denominator. An acre is 43,560 square feet; a mile is 5,280 feet."], "trap": "Read a fractional description from the end backward to locate it, and multiply the denominators to size it.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 2, "of": 15, "h": "Metes and Bounds"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 3, "of": 15, "h": "Government Survey Method"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 3, "of": 15, "h": "Formulas to Remember"}]}, {"id": "na-landuse", "x": "N", "c": "Land Use Controls", "t": "Government powers and public and private land use controls", "notes": ["Government powers (PETE): police power, eminent domain, taxation, escheat.", "Police power regulates for health, safety and welfare with no compensation: zoning, building codes, subdivision rules. Eminent domain takes for public use with just compensation through condemnation.", "Zoning relief: a variance for hardship from the property itself; a conditional or special use permit for a listed use with conditions; a nonconforming use that predates the ordinance.", "Spot zoning favors one parcel and is generally invalid. Buffer zones separate uses. A certificate of occupancy follows final inspection.", "Private controls: deed restrictions and subdivision CC&Rs, enforced by owners or the association. When public and private rules differ, the stricter one applies.", "Special assessments charge benefited properties for an improvement. Inverse condemnation is the owner's claim when regulation takes all value."], "trap": "A variance changes how you may build. A rezoning or use permit changes what you may do.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 8, "of": 15, "h": "Police Power"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 10, "of": 15, "h": "Zoning Exceptions"}, {"d": "Colorado Law and Practice Section", "ch": "Legal Descriptions and Land Use Controls", "p": 11, "of": 15, "h": "Eminent Domain"}, {"d": "Colorado Legal Issues Section", "ch": "Planning and Zoning", "p": 4, "of": 10, "h": "Deed Restrictions"}]}, {"id": "na-val-prin", "x": "N", "c": "Valuation", "t": "Value concepts, principles and who may appraise", "notes": ["Market value is the most probable price in an open market. Price is what was paid. Cost is what it took to build.", "Value needs demand, utility, scarcity and transferability.", "Principles: substitution, contribution, conformity, anticipation, progression and regression, highest and best use, supply and demand. Assemblage is combining parcels; plottage is the value gained.", "Appraisal process ends in reconciliation, a weighted judgment and not an average.", "A comparative market analysis or broker price opinion guides pricing and is not an appraisal. Federally related loans need a licensed or certified appraiser following USPAP. Automated valuation models use data without an inspection."], "trap": "Contribution measures what an improvement adds to value, which is often less than what it cost.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 2, "of": 12, "h": "Market Value"}, {"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 4, "of": 12, "h": "Principles of Value"}, {"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 8, "of": 12, "h": "Competitive Market Analysis"}]}, {"id": "na-val-app", "x": "N", "c": "Valuation", "t": "The three approaches to value", "notes": ["Sales comparison: best for houses and land. Adjust the comparables, never the subject. Comp better, subtract. Comp worse, add.", "Cost approach: land value plus cost new minus depreciation. Best for new and special-purpose buildings. Reproduction is an exact copy; replacement is equal utility.", "Depreciation: physical deterioration, functional obsolescence (design), external obsolescence (outside the property, never curable by the owner). Land is not depreciated.", "Income approach: value = net operating income / capitalization rate. NOI is effective gross income minus operating expenses, before debt service.", "Gross rent multiplier: value = monthly gross rent x GRM, used for small rentals."], "trap": "A higher cap rate means a lower value for the same income.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 6, "of": 12, "h": "Sales Comparison Approach"}, {"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 7, "of": 12, "h": "Cost Approach"}, {"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 8, "of": 12, "h": "Income Approach"}, {"d": "Colorado Law and Practice Section", "ch": "Valuation and Appraisal", "p": 8, "of": 12, "h": "Gross Rent Multiplier"}]}, {"id": "na-fin-doc", "x": "N", "c": "Financing", "t": "Loan documents, clauses, terms and markets", "notes": ["The note is the debt. The mortgage or deed of trust is the security. Mortgagor is the borrower; mortgagee is the lender.", "Clauses: acceleration (default), alienation or due-on-sale (transfer), defeasance (lien released on payoff), subordination (priority), prepayment.", "Loan-to-value = loan / the lower of price or appraisal. Conventional loans above 80% carry private mortgage insurance. One point is 1% of the loan.", "PITI is principal, interest, taxes and insurance. Underwriters look at housing and total debt ratios, credit and collateral.", "Primary market lends to borrowers. Secondary market (Fannie Mae, Freddie Mac, Ginnie Mae) buys loans.", "After foreclosure a lender may seek a deficiency judgment where allowed. Prepayment penalties and balloons are flagged as risky features."], "trap": "Alienation is about selling. Acceleration is about defaulting.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Financing Components", "p": 2, "of": 11, "h": "Acceleration Clause"}, {"d": "Colorado Law and Practice Section", "ch": "Financing Components", "p": 4, "of": 11, "h": "Secondary Market"}, {"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 4, "of": 12, "h": "Private Mortgage Insurance"}, {"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 7, "of": 12, "h": "Underwriting"}]}, {"id": "na-fin-types", "x": "N", "c": "Financing", "t": "Types of loans", "notes": ["Fully amortized loans pay to zero with level payments. Partially amortized loans leave a balloon. Interest-only loans pay no principal during the term.", "Adjustable-rate: rate = index + margin, limited by caps.", "FHA insures loans made by approved lenders and charges a mortgage insurance premium. VA guarantees loans for eligible veterans, with no required down payment. USDA serves eligible rural areas.", "Land contract: the buyer has possession and equitable title; the seller keeps legal title until paid.", "Reverse mortgage: age 62 or older, repaid when the owner leaves the home. Bridge loans cover the gap between homes. Construction loans are paid out in draws. Home equity lines are revolving second liens."], "trap": "FHA insures and VA guarantees. Neither one lends the money.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Financing Components", "p": 6, "of": 11, "h": "Loan Classification"}, {"d": "Colorado Law and Practice Section", "ch": "Financing Components", "p": 6, "of": 11, "h": "Adjustable-Rate Mortgages"}, {"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 3, "of": 12, "h": "FHA-Insured Loans"}, {"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 2, "of": 12, "h": "VA-Guaranteed Loans"}]}, {"id": "na-fin-law", "x": "N", "c": "Financing", "t": "Lending laws: RESPA, Truth in Lending, TRID and ECOA", "notes": ["RESPA covers federally related loans on one-to-four unit homes: no kickbacks or unearned fees, limits on escrow cushions, affiliated business disclosures.", "Truth in Lending (Regulation Z): disclose the APR. A trigger term in an ad (down payment, payment amount, number of payments, finance charge) requires full disclosure.", "Three-day right of rescission applies to refinances and home equity loans on a principal residence, not to purchase loans.", "TRID: Loan Estimate within three business days of application; Closing Disclosure three business days before closing.", "ECOA bars credit discrimination by race, color, religion, national origin, sex, marital status, age or receipt of public assistance."], "trap": "Marital status and age are credit classes under ECOA. They are not federal fair housing classes.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 8, "of": 12, "h": "Truth in Lending Act"}, {"d": "Colorado Law and Practice Section", "ch": "Lender Requirements", "p": 8, "of": 12, "h": "The TRID Rule"}, {"d": "Colorado Law and Practice Section", "ch": "Settlement", "p": 2, "of": 8, "h": "Closing and RESPA"}, {"d": "Colorado Law and Practice Section", "ch": "Federal Procedures and Laws Governing Real Estate", "p": 4, "of": 11, "h": "Equal Credit Opportunity Act"}]}, {"id": "na-con-law", "x": "N", "c": "Contracts", "t": "Contract law basics", "notes": ["A valid contract needs competent parties, offer and acceptance, consideration and a legal purpose. Real estate contracts also need a signed writing.", "Void has no legal effect. Voidable can be cancelled by the protected party (minors, duress, fraud). Unenforceable is valid but cannot be proved in court, such as an oral sale under the statute of frauds or a claim after the statute of limitations.", "Bilateral is a promise for a promise. Unilateral is a promise for an act. Executory is not yet performed; executed is complete.", "The parol evidence rule keeps earlier oral statements from contradicting a complete written contract.", "Electronic signatures are valid when the parties agree to use them.", "Contracts end by performance, mutual rescission, novation, impossibility or operation of law. Death does not end a signed purchase contract; it binds the estate."], "trap": "Earnest money is not required for a valid contract. The mutual promises are the consideration.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 2, "of": 11, "h": "Contract Law Basics"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 4, "of": 11, "h": "Classification of Contracts"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 4, "of": 11, "h": "Statute of Frauds"}]}, {"id": "na-con-offer", "x": "N", "c": "Contracts", "t": "Offers, options, contingencies and remedies", "notes": ["An offer can be revoked any time before acceptance is communicated. A counteroffer rejects the offer and replaces it.", "Offers end by rejection, counteroffer, revocation, expiration, or death of a party.", "Option: the owner is bound to sell if the holder exercises; the holder is not bound to buy. Right of first refusal: only a right to match if the owner decides to sell.", "A contingency is a condition. If it fails in good faith, the protected party may terminate and recover the deposit.", "Assignment transfers rights and leaves the assignor liable. Novation substitutes a new party and releases the old one.", "Remedies: specific performance, liquidated damages, compensatory damages, rescission. The buyer holds equitable title between contract and closing.", "An addendum is part of the contract from the start; an amendment changes it afterward. Present all offers; countering two at once risks two contracts."], "trap": "A question about the offer is not a rejection. A changed term is.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 3, "of": 11, "h": "Offer and Acceptance"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 5, "of": 11, "h": "Option Agreement"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 6, "of": 11, "h": "Assignment"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 7, "of": 11, "h": "Remedies"}]}, {"id": "na-con-lease", "x": "N", "c": "Contracts", "t": "Leases and leasehold estates", "notes": ["Estate for years has fixed start and end dates and ends without notice. Periodic tenancy renews until notice. Tenancy at will is open-ended. Tenancy at sufferance is a holdover without consent.", "Gross lease: landlord pays expenses. Net lease: tenant pays some or all. Percentage lease: base rent plus a share of sales. Graduated and index leases step up. Ground leases are long-term leases of land.", "A sale does not end a lease; the buyer takes subject to it.", "Assignment transfers the whole remaining term. A sublease transfers part. The original tenant stays liable unless released.", "Constructive eviction: the landlord's failure makes the unit unusable and the tenant leaves. Actual eviction is the court process.", "Lease-option gives a right to buy. Lease-purchase is an obligation to buy."], "trap": "An estate for years can be shorter than a year. The name refers to having a definite end.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Property Management, Leases, and Rents", "p": 2, "of": 10, "h": "Types of Leasehold Estates"}, {"d": "Colorado Law and Practice Section", "ch": "Property Management, Leases, and Rents", "p": 3, "of": 10, "h": "Types of Leases"}, {"d": "Colorado Law and Practice Section", "ch": "Property Management, Leases, and Rents", "p": 5, "of": 10, "h": "Sublease"}, {"d": "Colorado Law and Practice Section", "ch": "Real Property and Ownership", "p": 7, "of": 13, "h": "Leasehold Estates"}]}, {"id": "na-ag-rel", "x": "N", "c": "Agency", "t": "Agency relationships and listing types", "notes": ["The principal (client) hires the agent. The other side is a customer.", "Special agent: one transaction, as a broker under a listing. General agent: ongoing authority, as a property manager. Universal agent: everything, under a broad power of attorney.", "Agency is created by express agreement or implied by conduct. It ends by performance, expiration, mutual agreement, revocation, death, incapacity, destruction of the property or bankruptcy.", "Exclusive right to sell: broker paid no matter who sells. Exclusive agency: owner may sell personally and owe nothing. Open: only the procuring broker is paid. Net listing: broker keeps the excess, disfavored or illegal.", "Dual agency needs informed written consent where it is allowed. Transaction brokerage or facilitation is assistance without agency. Subagency makes the cooperating broker the seller's agent.", "Commissions are always negotiable."], "trap": "Colorado prohibits dual agency and defaults to transaction-brokerage. The national portion still tests the general rule.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 3, "of": 10, "h": "Agency Classifications"}, {"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 6, "of": 10, "h": "Termination of Agency"}, {"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 7, "of": 10, "h": "Dual Agency"}, {"d": "Colorado Law and Practice Section", "ch": "Contracts", "p": 7, "of": 11, "h": "Listing Agreements"}]}, {"id": "na-ag-dut", "x": "N", "c": "Agency", "t": "Agent duties and disclosures", "notes": ["Fiduciary duties to the principal: obedience to lawful instructions, loyalty, disclosure, confidentiality, accounting, reasonable care.", "Duties to customers: honesty, fair dealing and disclosure of known material defects.", "Puffing is opinion. A false statement of fact is misrepresentation, and hiding a known defect is fraud.", "A personal interest in a transaction must be disclosed in writing with informed consent.", "Disclose whom you represent at first substantive contact, before confidential information is shared."], "trap": "Obedience stops at the law. An instruction to discriminate or conceal a defect is refused.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 4, "of": 10, "h": "Fiduciary Duties"}, {"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 5, "of": 10, "h": "Duties to All Parties"}, {"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 5, "of": 10, "h": "Misrepresentation"}]}, {"id": "na-disclosures", "x": "N", "c": "Property Disclosures", "t": "Property condition and environmental disclosures", "notes": ["A material fact is one a reasonable buyer would weigh in deciding to buy or what to pay. Latent defects are hidden; known ones must be disclosed, even in an as-is sale.", "Lead-based paint: housing built before 1978. Disclose known hazards, give the pamphlet, allow 10 days to inspect, keep the signed form three years.", "Radon is a soil gas found by testing. Asbestos is dangerous when friable. Mold follows moisture. Underground tanks leak fuel.", "CERCLA (Superfund) liability is strict, joint and several, and retroactive, and can reach a current owner. A Phase I assessment supports the innocent purchaser defense.", "Flood insurance is required for federally related loans in a special flood hazard area.", "Red flags call for the right expert: a survey for boundaries, permits for additions, an inspector for condition. Offender registry questions go to the registry or law enforcement."], "trap": "As-is controls who pays for repairs. It does not excuse silence about a known defect.", "src": [{"d": "Colorado Legal Issues Section", "ch": "Agent Compliance When Listing", "p": 6, "of": 9, "h": "Environmental Hazards"}, {"d": "Colorado Legal Issues Section", "ch": "Agent Compliance When Listing", "p": 6, "of": 9, "h": "Lead-Based Paint"}, {"d": "Colorado Law and Practice Section", "ch": "Federal Procedures and Laws Governing Real Estate", "p": 7, "of": 11, "h": "CERCLA"}, {"d": "Colorado Law and Practice Section", "ch": "Agency", "p": 5, "of": 10, "h": "Disclosure of Defects"}]}, {"id": "na-pm", "x": "N", "c": "Property Management", "t": "Property management", "notes": ["The manager's job is the highest net return consistent with protecting the property. The management agreement creates a general agency and sets authority, fees and reporting.", "Set rents from a market survey of comparable space and vacancy. Qualify every applicant on the same written criteria.", "Fair housing: allow reasonable modifications at the tenant's expense and make reasonable accommodations in rules, such as assistance animals with no pet fee.", "ADA Title III: public and commercial buildings remove barriers where readily achievable.", "Tenant money is trust money, kept apart from the manager's funds. Operating expenses exclude debt service and depreciation.", "Risk management: avoid, control, transfer (insure), retain. Habitability is implied in residential leases. Removal of a tenant is by court eviction only."], "trap": "A modification changes the structure and the tenant pays. An accommodation changes a rule and no fee is charged.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Property Management, Leases, and Rents", "p": 5, "of": 10, "h": "Property Management Agreement"}, {"d": "Colorado Law and Practice Section", "ch": "Property Management, Leases, and Rents", "p": 6, "of": 10, "h": "Functions of Property Manager"}, {"d": "Colorado Practical Applications Section Part 2", "ch": "Property Management", "p": 7, "of": 13, "h": "Fair Housing Issues"}, {"d": "Colorado Practical Applications Section Part 2", "ch": "Property Management", "p": 3, "of": 13, "h": "Types of Budgets"}]}, {"id": "na-tt-deed", "x": "N", "c": "Transfer of Title", "t": "Deeds, recording and title evidence", "notes": ["A deed needs a competent grantor, an identifiable grantee, consideration, words of conveyance, a legal description, the grantor's signature, and delivery and acceptance. Title passes on delivery and acceptance.", "General warranty deed: full warranties for the whole history. Special warranty: only the grantor's period. Bargain and sale: no warranties. Quitclaim: whatever interest the grantor has, if any.", "Recording gives constructive notice and sets priority. It requires acknowledgment. Actual notice is what a person really knows.", "Chain of title is the line of owners. An abstract summarizes the record. Title insurance covers past defects for a one-time premium; the owner's policy protects the owner and the lender's policy protects the loan.", "Standard coverage handles record defects and forgery. Extended coverage adds survey matters, parties in possession and unrecorded liens.", "Marketable title is free of reasonable doubt. A quiet title suit clears a cloud."], "trap": "Recording does not transfer title. Delivery does.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 6, "of": 13, "h": "Types of Deeds"}, {"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 8, "of": 13, "h": "Delivery and Acceptance"}, {"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 8, "of": 13, "h": "Recording Process"}, {"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 10, "of": 13, "h": "Title Insurance"}]}, {"id": "na-tt-spec", "x": "N", "c": "Transfer of Title", "t": "Wills, involuntary transfers, foreclosures and short sales", "notes": ["Testate means with a will; intestate means without, so state law decides. A devise is real property by will; a bequest is personal property. Probate proves the will and settles the estate.", "Involuntary alienation: adverse possession, foreclosure, eminent domain, escheat.", "Adverse possession requires open, notorious, hostile, exclusive and continuous possession for the statutory period.", "Short sale: the lender agrees to take less than the balance. Deed in lieu: the owner hands the deed to the lender. REO is property the lender now owns and sells, usually as is."], "trap": "Escheat needs both no will and no heirs.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 2, "of": 13, "h": "Intestate Succession"}, {"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 2, "of": 13, "h": "Types of Involuntary Transfer"}, {"d": "Colorado Law and Practice Section", "ch": "Transfer of Title to Real Property", "p": 3, "of": 13, "h": "Adverse Possession Requirements"}]}, {"id": "na-pr-fh", "x": "N", "c": "Practice of Real Estate", "t": "Fair housing and the ADA", "notes": ["Civil Rights Act of 1866: race, all property, no exceptions.", "Fair Housing Act classes: race, color, religion, national origin, sex, familial status, disability. Sex covers sexual orientation and gender identity.", "Prohibited: blockbusting (panic selling), steering (channeling buyers), redlining (denying loans by area), discriminatory advertising, different terms. Disparate impact covers neutral rules with discriminatory effect.", "Exemptions are narrow: owner-occupied buildings of four units or fewer, an owner selling a single-family home without a broker, religious organizations and private clubs for members, and housing for older persons. None applies to race, and none survives using a broker or discriminatory advertising.", "File with HUD within one year or in federal court within two.", "ADA Title I covers employers with 15 or more employees. Title III covers places open to the public, including a brokerage office."], "trap": "Describe the property, never the people you imagine living there.", "src": [{"d": "Colorado Legal Issues Section", "ch": "Federal Laws Governing Real Estate", "p": 2, "of": 9, "h": "Fair Housing Act: Exemptions"}, {"d": "Colorado Legal Issues Section", "ch": "Federal Laws Governing Real Estate", "p": 3, "of": 9, "h": "Protected Classes Under the Fair Housing Act"}, {"d": "Colorado Legal Issues Section", "ch": "Federal Laws Governing Real Estate", "p": 4, "of": 9, "h": "Prohibited Acts Under the Fair Housing Act"}, {"d": "Colorado Legal Issues Section", "ch": "Federal Laws Governing Real Estate", "p": 7, "of": 9, "h": "Americans with Disabilities Act"}]}, {"id": "na-pr-reg", "x": "N", "c": "Practice of Real Estate", "t": "Antitrust, employment status, marketing rules and handling funds", "notes": ["Antitrust (Sherman Act): price fixing, group boycotts, market allocation and tying. Never discuss fees or cooperation policies with competitors.", "Independent contractor status for tax purposes: licensed, paid on output, written agreement. The broker still supervises.", "Do Not Call: check the registry every 31 days. Exceptions are an established business relationship (18 months after a transaction, 3 months after an inquiry) and written permission.", "CAN-SPAM: honest subject line, a postal address and a working opt-out. Online and social media advertising must be truthful and identify the brokerage.", "Protect clients' personal information and warn about wire fraud.", "Commingling is mixing trust money with your own. Conversion is spending it. Do not answer outside your expertise; recommend the right professional."], "trap": "Two competitors agreeing on anything about price is price fixing, even informally.", "src": [{"d": "Colorado Law and Practice Section", "ch": "Federal Procedures and Laws Governing Real Estate", "p": 5, "of": 11, "h": "Antitrust Laws"}, {"d": "Colorado Law and Practice Section", "c
