{x:"S",c:"Forms & Contracts",q:"A couple is buying a single-family home to live in. Which form is used?",o:["Contract to Buy and Sell Real Estate (Residential)","Contract to Buy and Sell (Income-Residential)","Contract to Buy and Sell (Land)","Any attorney-drafted contract"],a:0,r:"CBS (Residential)",e:"The Residential form is for one-to-four family property the buyer will occupy as a principal residence. Investment residential uses Income-Residential; there are also Commercial and Land versions."},
{x:"S",c:"Forms & Contracts",q:"A buyer is purchasing a 60-acre farm that includes a farmhouse. The broker should use:",o:["The Residential contract alone","The Land contract with the Residential Addendum","The Commercial contract alone","Two separate contracts"],a:1,r:"Residential Addendum",e:"For mixed use, the Land or Commercial form plus the Residential Addendum, which restores the residential provisions (lead-based paint, CO alarms, meth, home warranty)."},
{x:"S",c:"Forms & Contracts",q:"In the Contract to Buy and Sell, MEC means:",o:["Mortgage Eligibility Certificate","Mutual Execution of this Contract, the date both parties have signed","Mandatory Earnest Contribution","Master Escrow Closing"],a:1,r:"CBS §3",e:"MEC is the date both parties have signed. Many deadlines are counted from it."},
{x:"S",c:"Forms & Contracts",q:"A deadline in the Dates and Deadlines table is filled in with N/A. The effect is:",o:["The deadline defaults to closing","The contract is void","That deadline does not apply and the related provision is deleted","The deadline is 10 days after MEC"],a:2,r:"CBS §3.2",e:"Blank, N/A or Deleted means the deadline is not applicable and the corresponding provision drops out. Best practice is to leave no line blank."},
{x:"S",c:"Forms & Contracts",q:"A buyer under contract wants to assign the Contract to Buy and Sell to her brother. Under the standard form the contract is:",o:["Freely assignable by either party","Not assignable by the buyer unless Additional Provisions say otherwise","Never assignable","Assignable with the lender's consent"],a:1,r:"CBS §2.2",e:"Not assignable by the buyer unless specified in Additional Provisions."},
{x:"S",c:"Forms & Contracts",q:"Under the Contract to Buy and Sell, the earnest money holder holds the deposit:",o:["For the seller only","For the buyer only","In its trust account on behalf of both seller and buyer","As the broker's advance commission"],a:2,r:"CBS §4.3",e:"Held in trust for both parties, and released only on their written mutual instructions or a court order."},
{x:"S",c:"Forms & Contracts",q:"A seller plans to take the dining room chandelier, which is hard-wired. To avoid a dispute it should be written in the contract's:",o:["Inclusions","Exclusions","Additional deposits","Title exceptions"],a:1,r:"CBS §2.5 / 2.6",e:"Fixtures convey unless excluded. Personal property that is staying is listed under Inclusions and conveyed by bill of sale."},
{x:"S",c:"Forms & Contracts",q:"The appraisal comes in below the purchase price. To preserve the right to terminate, the buyer must act by the:",o:["Record Title Deadline","Appraisal Objection Deadline","Possession Date","Loan Terms Deadline"],a:1,r:"CBS §6.2",e:"The buyer gives a Notice to Terminate or an appraisal objection by the Appraisal Objection Deadline; an objection must be resolved by the Appraisal Resolution Deadline or the contract terminates."},
{x:"S",c:"Forms & Contracts",q:"A buyer dislikes the interest rate she was offered and does nothing. After the New Loan Terms Deadline passes:",o:["She may still terminate until closing","She has waived that right to terminate, and her earnest money may be at risk","The contract is void","The seller must reduce the price"],a:1,r:"CBS §5",e:"Each contingency has its own deadline. Miss it and that exit is gone. Loan terms and loan availability have separate deadlines."},
{x:"S",c:"Forms & Contracts",q:"The home inspection finds a failing sewer line. The buyer wants it fixed. By the Inspection Objection Deadline the buyer delivers:",o:["A Counterproposal","An Inspection Objection Notice","An Agreement to Amend/Extend","A new contract"],a:1,r:"CBS §10.3",e:"The Inspection Objection Notice lists what the buyer wants corrected. Alternatively the buyer may give a Notice to Terminate by the Inspection Termination Deadline."},
{x:"S",c:"Forms & Contracts",q:"The buyer gave timely inspection objections. The Inspection Resolution Deadline arrives with no written agreement and no withdrawal of the objections. The contract:",o:["Continues with the seller obligated to repair","Terminates","Converts to an as-is sale","Is extended three days automatically"],a:1,r:"CBS §10.3",e:"No written resolution by the deadline means the contract terminates, unless the buyer withdraws the objection in writing before then."},
{x:"S",c:"Forms & Contracts",q:"A buyer cannot find affordable homeowner's coverage because of wildfire risk. She may terminate if she acts by the:",o:["Property Insurance Termination Deadline","Due Diligence Documents Deadline","Off-Record Title Deadline","Closing Date"],a:0,r:"CBS §10.5",e:"The contract is conditional on the buyer's satisfaction with availability, terms and premium of property insurance, in the buyer's sole subjective discretion, until that deadline."},
{x:"S",c:"Forms & Contracts",q:"The property is in an HOA. By the Association Documents Deadline the seller must:",o:["Pay the next year's dues","Have the association documents delivered to the buyer at the seller's expense","Obtain HOA approval of the buyer","Record the declaration"],a:1,r:"CBS §7",e:"The seller delivers or authorizes delivery of the association documents at the seller's cost; the buyer then has until the Association Documents Termination Deadline to terminate."},
{x:"S",c:"Forms & Contracts",q:"The seller knows of an unrecorded easement used by a neighbor. Under the contract the seller must disclose it by the:",o:["Record Title Deadline","Off-Record Title Deadline","Survey Deadline","Closing Date"],a:1,r:"CBS §8",e:"Record title matters come from the title commitment. Off-record matters (unrecorded easements, leases, boundary agreements) are disclosed by the seller by the Off-Record Title Deadline, and the buyer may object."},
{x:"S",c:"Forms & Contracts",q:"An Improvement Location Certificate (ILC) is:",o:["A boundary survey that may be relied on to build a fence","A less detailed, less expensive certificate showing improvements in relation to boundaries, usually enough for a residential closing","A zoning approval","A warranty from the builder"],a:1,r:"CBS §9",e:"An ILC is not a land survey and should not be used to set fences or structures. A survey is more accurate and costs more."},
{x:"S",c:"Forms & Contracts",q:"The seller does not move out on the Possession Date. Under the contract the seller is:",o:["Entitled to three grace days","Subject to eviction and liable for the stated dollar amount per day","Owed a refund of the commission","Automatically a month-to-month tenant"],a:1,r:"CBS §17",e:"The seller is subject to eviction and owes the per-day amount written in the contract until possession is delivered, plus any actual additional damages."},
{x:"S",c:"Forms & Contracts",q:"A fire before closing causes damage estimated at 15% of the purchase price. The buyer:",o:["Must close and accept the insurance proceeds","Has the right to terminate","Must wait 60 days for repairs","Forfeits the earnest money if she will not close"],a:1,r:"CBS §18.1",e:"If damage is not more than 10% of the price and insurance will pay for repair, the seller repairs before closing. Over that amount, or if repairs are not done, the buyer may terminate."},
{x:"S",c:"Forms & Contracts",q:"The buyer defaults. Neither party checked the Specific Performance box. The seller's remedy is:",o:["Sue for specific performance","Keep the earnest money as liquidated damages","Sue for the full purchase price","Nothing"],a:1,r:"CBS §20.1",e:"Liquidated damages applies unless the specific performance box is checked: the seller keeps the earnest money as the sole remedy."},
{x:"S",c:"Forms & Contracts",q:"The seller defaults. The buyer may:",o:["Only get the earnest money back","Treat the contract as canceled, recover the earnest money and damages, or sue for specific performance","Take possession immediately","Collect the commission"],a:1,r:"CBS §20.2",e:"The buyer can cancel, get the earnest money and seek damages, or keep the contract alive and seek specific performance, damages, or both."},
{x:"S",c:"Forms & Contracts",q:"Time is of the essence in the Contract to Buy and Sell. This means:",o:["Closing must occur within 30 days","Every date and deadline is strict, and missing one can be a default or waive a right","The parties may extend deadlines verbally","Deadlines are estimates"],a:1,r:"CBS §20",e:"Dates are enforced as written. Changing one requires a signed Agreement to Amend/Extend before the deadline passes."},
{x:"S",c:"Forms & Contracts",q:"Buyer and seller both claim the earnest money held by a brokerage. The holder gives notice, and neither party delivers a copy of a filed lawsuit within 120 days. The holder is authorized to:",o:["Keep the money as a fee","Return the earnest money to the buyer","Pay the seller","Send it to the state"],a:1,r:"CBS §23 / CP-6",e:"The holder is not required to release disputed funds. It may wait, interplead, or, if no lawsuit is delivered within 120 days of its notice, return the money to the buyer."},
{x:"S",c:"Forms & Contracts",q:"A seller wants to accept an offer but change the closing date and price. The broker prepares a Counterproposal. The seller should:",o:["Sign both the Counterproposal and the buyer's contract","Sign the Counterproposal but not the Contract to Buy and Sell","Sign only the contract and initial the changes","Sign nothing until the buyer agrees verbally"],a:1,r:"Counterproposal",e:"The party making the counter signs only the Counterproposal. If the other side signs it, the two documents together form the contract."},
{x:"S",c:"Forms & Contracts",q:"After MEC, the buyer needs five more days for inspections. Which form changes the deadline?",o:["Counterproposal","Agreement to Amend/Extend Contract","Inspection Objection Notice","Closing Instructions"],a:1,r:"Agreement to Amend/Extend",e:"Counterproposals are for before a contract exists. Once there is a contract, changes go on the Agreement to Amend/Extend, signed before the affected deadline passes."},
{x:"S",c:"Forms & Contracts",q:"The Closing Instructions form is an agreement among:",o:["Buyer and lender","Buyer, seller and the closing company","Listing broker and buyer's broker","Seller and title insurer only"],a:1,r:"Closing Instructions",e:"Buyer and seller engage the closing company and tell it how to close and handle documents and funds. The company may not release anything of value before good funds are received and disbursed."},
{x:"S",c:"Forms & Contracts",q:"The Real Property Transfer Declaration (TD-1000) is used by the:",o:["Lender to verify the price","County assessor to help ensure fair and uniform assessments","Commission to audit the broker","IRS to compute capital gain"],a:1,r:"TD-1000",e:"It goes with the deed at recording and gives the assessor sale details. If not returned within 30 days of notice the assessor may impose a penalty."},
{x:"S",c:"Forms & Contracts",q:"The seller needs to stay in the home for two weeks after closing. The correct form is the:",o:["Residential lease","Post-Closing Occupancy Agreement","Agreement to Amend/Extend","Licensee Buy-Out Addendum"],a:1,r:"Post-Closing Occupancy Agreement",e:"For short-term seller occupancy after closing, not more than 30 days. Longer than that calls for a lease."},
{x:"S",c:"Forms & Contracts",q:"A seller owes more on the loan than the home will sell for and needs the lender to accept less. The contract should include the:",o:["Exchange Addendum","Short Sale Addendum","Foreclosure Property Addendum","Source of Water Addendum"],a:1,r:"Short Sale Addendum",e:"A short sale depends on the lienholder agreeing to release its lien for less than is owed. The lender does not have to agree, and release of the lien does not by itself release the seller from the debt."},
{x:"S",c:"Forms & Contracts",q:"A listing broker offers to buy the seller's home herself if it does not sell in 90 days. This requires the:",o:["Brokerage Duties Addendum","Licensee Buy-Out Addendum","Exclusive Brokerage Addendum","Change of Status form"],a:1,r:"Licensee Buy-Out Addendum",e:"Used when a licensee agrees to buy a listed property, including as an inducement to list or to help the owner buy another home."},
{x:"S",c:"Forms & Contracts",q:"The Source of Water Addendum:",o:["Transfers decreed water rights","Discloses the source of the property's potable water so the buyer can investigate long-term supply","Registers a well","Is used only for commercial property"],a:1,r:"Source of Water Addendum",e:"Colorado requires the seller to disclose the source of potable water in residential sales."},
{x:"S",c:"Forms & Contracts",q:"A buyer and seller plan a tax-deferred like-kind exchange. The contract should include the:",o:["Exchange Addendum","Short Sale Addendum","Residential Addendum","Earnest Money Receipt"],a:0,r:"Exchange Addendum",e:"The Exchange Addendum has the parties cooperate with a Section 1031 exchange."},
{x:"S",c:"Forms & Contracts",q:"A house was built in 1965. Before the buyer is bound, the buyer must receive the:",o:["Radon mitigation certificate","Lead-Based Paint Disclosure, signed by the seller and the licensees","Soils report","TD-1000"],a:1,r:"Lead-Based Paint Disclosure",e:"For housing built before January 1, 1978. Seller and brokers sign; the buyer also gets the EPA pamphlet and an opportunity to inspect."},
{x:"S",c:"Forms & Contracts",q:"A home has a gas furnace. Colorado law requires the seller to assure an operational carbon monoxide alarm is installed:",o:["In the garage only","Within 15 feet of the entrance to each bedroom","On every level and in every room","Only in rental property"],a:1,r:"CBS §10.11",e:"Within 15 feet of the entrance to each room used for sleeping, or where the building code requires, before the property is offered for sale or lease."},
{x:"S",c:"Forms & Contracts",q:"If no other box is checked, the Contract to Buy and Sell provides that the seller will convey title by:",o:["Quitclaim deed","Special warranty deed","Bargain and sale deed","Personal representative's deed"],a:1,r:"CBS §13",e:"The form lists the deed choices and defaults to a special warranty deed, which warrants only against defects arising during the seller's ownership."},
// --- Use of standard forms
{x:"S",c:"Forms & Contracts",q:"When a Commission-approved form exists for a transaction, a broker must:",o:["Use it","Use it only if the client insists","Have an attorney approve it first","Use the national association's form instead"],a:0,r:"Rule 7.1",e:"Approved forms are mandatory for brokers when they fit the transaction. That requirement is the trade-off for the Conway-Bogue privilege."},
{x:"S",c:"Forms & Contracts",q:"A broker may modify a Commission-approved form by:",o:["Rewriting the default section in the broker's favor","Adding the firm's name and making insertions or deletions that result from the parties' negotiations","Removing the special taxing district notice","Changing the preprinted advisories"],a:1,r:"Rule 7.1",e:"Permitted: identifying information, transaction-specific additions in Additional Provisions, and negotiated changes. The broker must explain every modification to the client."},
{x:"S",c:"Forms & Contracts",q:"A broker wants to add a sentence to Additional Provisions stating that the broker is not liable for any errors. This is:",o:["Permitted if both parties initial it","Prohibited; a broker may not insert self-serving or exculpatory language","Required by E&O carriers","Permitted in commercial contracts"],a:1,r:"Rule 7.1",e:"No exculpatory or broker-protective language may be added to an approved form."},
{x:"S",c:"Forms & Contracts",q:"The buyer's attorney drafts a special clause that the broker inserts into the contract. The broker must:",o:["Refuse to use it","Keep a record of the clause and the attorney's name for four years","Send it to the Commission","Charge a drafting fee"],a:1,r:"Rule 7.1",e:"Attorney-drafted language is allowed; the broker keeps the clause and the attorney's name on file for four years."},
{x:"S",c:"Forms & Contracts",q:"A home builder requires buyers to sign the builder's own purchase contract. The buyer's broker:",o:["Must refuse to participate","May work with the builder's contract but must still use the required Commission disclosure forms and keep a file","Must rewrite it on the Commission form","Needs Commission approval for each sale"],a:1,r:"CP-1",e:"Unlicensed principals such as builders and banks may use their own contracts. Brokers still make the brokerage relationship and other required disclosures and maintain transaction files."},
{x:"S",c:"Forms & Contracts",q:"A buyer is out of the country and asks the broker to just sign the amendment for him. The broker may sign only if:",o:["The buyer says so by email","The broker holds a written power of attorney","The employing broker approves","The seller agrees"],a:1,r:"Statute of frauds",e:"A broker never signs for a client without a written power of attorney. Real estate contracts must be in writing and signed to be enforceable."},
// --- Notes, deeds of trust, seller financing
{x:"S",c:"Forms & Contracts",q:"A buyer wants to make an offer without tying up cash until the seller accepts. The broker may use the:",o:["Promissory Note (UCCC)","Earnest Money Promissory Note","Deed of Trust (Assumable)","Earnest Money Release"],a:1,r:"Earnest Money Promissory Note",e:"It states the maker, amount, interest and due date. The seller must be told the due date, and the broker must notify the seller promptly if it is not paid."},
{x:"S",c:"Forms & Contracts",q:"In a Colorado deed of trust, the borrower is the ___ and the lender is the ___.",o:["Trustee; trustor","Trustor; beneficiary","Beneficiary; trustee","Mortgagee; mortgagor"],a:1,r:"Deed of trust",e:"Trustor (grantor) = borrower, beneficiary = lender, trustee = the public trustee of the county, who holds the power of sale and releases the deed of trust when the loan is paid."},
{x:"S",c:"Forms & Contracts",q:"A seller carrying the financing wants the loan paid in full if the buyer ever transfers the property to anyone. The broker uses the:",o:["Deed of Trust (Due on Transfer - Strict)","Deed of Trust (Due on Transfer - Creditworthy)","Deed of Trust (Assumable - Not Due on Transfer)","Earnest Money Promissory Note"],a:0,r:"Deed of Trust forms",e:"Strict: no transfer without payoff. Creditworthy: a new owner may assume if the lender approves their credit. Assumable: transferable without the lender's permission."},
{x:"S",c:"Forms & Contracts",q:"Under the Deed of Trust (Due on Transfer - Creditworthy), a buyer of the property may assume the loan:",o:["Automatically","Only after the lender approves the new owner's creditworthiness","Never","Only by paying 1% of the balance"],a:1,r:"Deed of Trust forms",e:"The borrower must supply information so the lender can evaluate the transferee. It differs from the Strict form only in the due-on-transfer paragraph."},
{x:"S",c:"Forms & Contracts",q:"The Commission-approved promissory notes used with seller financing provide that the borrower may prepay principal:",o:["Only after five years","At any time, in whole or in part, without penalty","With a 2% fee","Only with the lender's consent"],a:1,r:"Promissory Note forms",e:"Both the standard Promissory Note and the UCCC version allow prepayment at any time without penalty."},
{x:"S",c:"Forms & Contracts",q:"Under the Uniform Consumer Credit Code provisions in your course, a borrower with a second-lien loan that has a balloon payment has the right to:",o:["Cancel the loan","Refinance the balloon at the then-prevailing rate if the borrower meets the lender's normal credit standards","Skip the balloon","Convert to a 30-year fixed at the original rate"],a:1,r:"UCCC",e:"The UCCC protects consumer borrowers: disclosure of credit costs, usury limits (not on residential first mortgages), no confession-of-judgment clauses, and the balloon refinance right."},
{x:"S",c:"Forms & Contracts",q:"An Earnest Money Receipt form is used to:",o:["Release the deposit to the seller","Document that the earnest money was received and will be placed in a trust account","Amend the amount of earnest money","Convey personal property"],a:1,r:"Earnest Money Receipt",e:"It evidences receipt of the deposit by the holder named in the contract."},
{x:"S",c:"Forms & Contracts",q:"A buyer terminates on time under the inspection clause. To get the deposit back from a title company, the parties sign an:",o:["Earnest Money Release","Agreement to Amend/Extend","Inspection Resolution","Earnest Money Receipt"],a:0,r:"Earnest Money Release",e:"The holder releases only on written mutual instructions. Under the contract the seller agrees to sign the release within three days of receiving it when the buyer is entitled to the money."},
{x:"S",c:"Forms & Contracts",q:"A buyer may terminate the Contract to Buy and Sell under any of its termination rights by delivering a:",o:["Counterproposal","Notice to Terminate","Verbal notice to the listing broker","New offer at a lower price"],a:1,r:"CBS §24",e:"The Notice to Terminate form is the written notice the contract calls for. It must be received by the applicable deadline."},
{x:"S",c:"Forms & Contracts",q:"If the residential contract is in the Colorado Foreclosure Protection Act version, which notices must accompany it?",o:["Lead-based paint and radon only","Seller Warning - Equity Skimming, Notice of Cancellation and Homeowner Warning Notice","A Rule 120 order","A new title commitment"],a:1,r:"CBS (Foreclosure Protection Act)",e:"The CFPA form adds these consumer warnings and the homeowner's cancellation right."},
{x:"S",c:"Forms & Contracts",q:"Which statement about the Contract to Buy and Sell's water provisions is correct?",o:["All water rights transfer automatically with the deed","Deeded water rights, well rights and water stock are each addressed separately and must be specifically identified","Water rights can never be sold with land","Only municipal water is addressed"],a:1,r:"CBS §2.7",e:"The contract has separate lines for deeded water rights, other rights, well rights and water stock certificates, because none of them pass unless conveyed."}
);

BANK.push(
// ================= STATE · CLOSING AND SETTLEMENT (10 items) =================
{x:"S",c:"Closing",m:1,q:"Annual property taxes of $3,650 are paid in arrears. Closing is June 15 and the buyer is responsible for the day of closing. Using a 365-day year, the tax proration is:",o:["Debit seller $1,650, credit buyer $1,650","Debit buyer $1,650, credit seller $1,650","Debit seller $1,660, credit buyer $1,660","Debit seller $2,000, credit buyer $2,000"],a:0,r:"Proration · taxes in arrears",e:"$3,650 / 365 = $10 per day. Seller owns Jan 1 through June 14 = 31+28+31+30+31+14 = 165 days = $1,650. The buyer will pay the bill next year, so the seller is debited and the buyer credited."},
{x:"S",c:"Closing",m:1,q:"The seller collected September rent of $1,800 in advance. Closing is September 21 and the buyer owns the day of closing. Prorating on actual days in the month:",o:["Debit seller $600, credit buyer $600","Debit buyer $600, credit seller $600","Debit seller $1,200, credit buyer $1,200","Debit seller $660, credit buyer $660"],a:0,r:"Proration · rent",e:"$1,800 / 30 = $60 per day. Buyer owns Sept 21 to 30 = 10 days = $600. The seller is holding rent that belongs to the buyer's period, so debit seller, credit buyer."},
{x:"S",c:"Closing",m:1,q:"The Colorado documentary fee on a sale for $475,000 is:",o:["$4.75","$47.50","$475.00","$950.00"],a:1,r:"C.R.S. 39-13-102",e:"One cent per $100 of consideration. $475,000 / 100 = 4,750 x $0.01 = $47.50. No fee is owed when the consideration is $500 or less."},
{x:"S",c:"Closing",m:1,q:"A property sells for $312,450. The documentary fee is:",o:["$31.24","$31.25","$31.30","$312.45"],a:1,r:"C.R.S. 39-13-102",e:"3,124.5 hundreds rounds up to 3,125. 3,125 x $0.01 = $31.25. A partial $100 increment is rounded up."},
{x:"S",c:"Closing",m:1,q:"The seller prepaid June HOA dues of $300. Closing is June 21 and the buyer owns the day of closing. The proration is:",o:["Debit seller $100, credit buyer $100","Debit buyer $100, credit seller $100","Debit buyer $200, credit seller $200","Debit buyer $90, credit seller $90"],a:1,r:"Proration · paid in advance",e:"$300 / 30 = $10 per day. Buyer owns June 21 to 30 = 10 days = $100. The seller already paid for days the buyer will own, so the buyer is debited and the seller credited."},
{x:"S",c:"Closing",m:1,q:"A buyer's new loan is $400,000 at 6%. Closing is October 20 and the lender collects interest from the day of closing through the end of October, using a 365-day year. The interest charged at closing is closest to:",o:["$657.53","$723.29","$789.04","$2,000.00"],a:2,r:"Prepaid interest",e:"Daily interest = $400,000 x 0.06 / 365 = $65.75. October 20 through 31 is 12 days. 12 x $65.75 = $789.04, a debit to the buyer. Mortgage interest is otherwise paid in arrears."},
{x:"S",c:"Closing",m:1,q:"Sale price $500,000. Commission 5.5%. Loan payoff $310,000. Owner's title policy $1,450. Other seller closing costs $550. Tax proration debit $1,500. The seller's net proceeds are:",o:["$159,000","$160,500","$162,000","$186,500"],a:0,r:"Seller net",e:"$500,000 - $27,500 commission - $310,000 payoff - $1,450 - $550 - $1,500 = $159,000. Seller net is credits minus debits."},
{x:"S",c:"Closing",m:1,q:"Purchase price $450,000 with an 80% loan. Earnest money $10,000. Buyer closing costs $6,200. The buyer receives a $1,300 tax proration credit. Cash the buyer must bring to closing:",o:["$84,900","$86,200","$87,500","$94,900"],a:0,r:"Buyer cash to close",e:"Debits: $450,000 + $6,200 = $456,200. Credits: loan $360,000 + earnest money $10,000 + tax credit $1,300 = $371,300. Difference = $84,900."},
{x:"S",c:"Closing",m:1,q:"Using the 360-day year / 30-day month method, annual taxes of $2,880 are prorated for a closing on August 11, with the seller responsible through August 10. The seller's share is:",o:["$1,680","$1,760","$1,768","$1,840"],a:1,r:"Proration · 360/30",e:"$2,880 / 12 = $240 per month; $240 / 30 = $8 per day. Seven full months ($1,680) plus 10 days ($80) = $1,760."},
{x:"S",c:"Closing",q:"On the settlement statement, the purchase price is entered as a:",o:["Debit to the seller and credit to the buyer","Debit to the buyer and credit to the seller","Credit to both","Debit to both"],a:1,r:"Settlement worksheet",e:"A debit is something a party owes; a credit is something a party receives or has already paid. The buyer owes the price; the seller receives it."},
{x:"S",c:"Closing",q:"The buyer's earnest money deposit appears on the settlement statement as a:",o:["Credit to the buyer","Debit to the buyer","Credit to the seller","Debit to the seller"],a:0,r:"Settlement worksheet",e:"The buyer already paid it, so it is a buyer credit. The new loan amount is also a credit to the buyer."},
{x:"S",c:"Closing",q:"The seller's existing loan payoff appears as a:",o:["Credit to the seller","Debit to the seller","Debit to the buyer","Credit to the buyer"],a:1,r:"Settlement worksheet",e:"It reduces what the seller takes home: a seller debit. If the buyer assumed the loan instead, it would be a debit to the seller and a credit to the buyer."},
{x:"S",c:"Closing",q:"The buyer is purchasing a rental house and the seller holds a $2,000 tenant security deposit. At closing the deposit is a:",o:["Debit to the buyer, credit to the seller","Debit to the seller, credit to the buyer","Credit to the tenant","Item outside closing"],a:1,r:"Settlement worksheet",e:"The deposit belongs to the tenant and the obligation to return it moves to the buyer, so the seller hands it over: debit seller, credit buyer. Tenants are notified who holds it."},
{x:"S",c:"Closing",q:"A title company conducts the closing and prepares the settlement statements. Responsibility for the accuracy of the statement delivered to the broker's client rests with:",o:["The title company alone","The broker, who must review and sign it","The lender","The buyer"],a:1,r:"Rule 6.19",e:"Using a closing company does not relieve the broker. The broker must review for accuracy, sign and provide the statement to the party the broker is working with."},
{x:"S",c:"Closing",q:"After closing, an associate broker's signed settlement statement must be:",o:["Mailed to the Commission","Delivered to the employing broker immediately, who retains a copy","Kept at the associate's home for four years","Given to the lender"],a:1,r:"Rule 6.19",e:"Delivered to the employing broker immediately after closing; the firm retains it in the transaction file for four years."},
{x:"S",c:"Closing",q:"The designated broker has the flu on closing day. The settlement statement may be reviewed and signed by:",o:["The title closer on the broker's behalf","Another licensee who agrees or is designated by the employing broker, who then shares responsibility","The client's relative","No one; closing must be postponed"],a:1,r:"Rule 6.19",e:"A substitute licensee may attend and sign, and assumes joint responsibility with the absent broker for accuracy, completeness and delivery."},
{x:"S",c:"Closing",q:"Under Colorado's good funds law, which may a closing agent NOT rely on to disburse at closing?",o:["A wire transfer","A cashier's check","A buyer's personal check for the down payment","A certified check"],a:2,r:"C.R.S. 38-35-125",e:"Funds must be immediately available for withdrawal as a matter of right. Personal checks do not qualify. No disbursement until good funds are in hand."},
{x:"S",c:"Closing",q:"Under the standard Colorado contract and custom, the premium for the owner's title insurance policy is usually paid by the ___ and the lender's policy by the ___.",o:["Buyer; seller","Seller; buyer","Lender; buyer","Buyer; buyer"],a:1,r:"CBS §8 / worksheet",e:"The seller typically furnishes the owner's policy as evidence of title; the buyer pays for the lender's policy. The contract has checkboxes, so follow the contract in the question."},
{x:"S",c:"Closing",q:"Schedule B-2 of a title commitment lists:",o:["The proposed insured and policy amount","Requirements that must be met before the policy issues","Exceptions that will not be covered by the policy","The premium calculation"],a:2,r:"Title commitment",e:"Schedule A: who, what, how much. Schedule B-1: requirements (pay off the deed of trust, record the deed). Schedule B-2: exceptions from coverage."},
{x:"S",c:"Closing",q:"Which is a standard exception in a title commitment?",o:["A recorded first deed of trust","Rights of parties in possession not shown by the public records","Current year property taxes shown on the tax certificate","A recorded HOA declaration"],a:1,r:"Title commitment",e:"Standard exceptions: parties in possession, unrecorded easements, survey matters, unrecorded mechanic's liens. Recorded items are specific exceptions or requirements."},
{x:"S",c:"Closing",q:"The certificate of taxes due used at closing is obtained from the:",o:["County assessor","County treasurer","Clerk and recorder","Public trustee"],a:1,r:"Settlement worksheet",e:"Treasurer collects and certifies taxes due. Assessor values. Clerk and recorder records documents. Public trustee handles deed of trust foreclosures and releases."},
{x:"S",c:"Closing",q:"The city finished installing sidewalks last month and has not yet billed the special assessment. Under the contract, who pays it at closing?",o:["The buyer, because it is billed after closing","The seller, because the improvement was installed before closing","It is split","The HOA"],a:1,r:"CBS §16",e:"Special assessments for improvements already installed are the seller's obligation even if not yet assessed."},
{x:"S",c:"Closing",q:"Under TRID, the lender must ensure the borrower receives the Closing Disclosure at least:",o:["24 hours before closing","Three business days before closing","Seven days before closing","At the closing table"],a:1,r:"TRID",e:"Three business days before consummation. The Loan Estimate is due within three business days after application."},
{x:"S",c:"Closing",q:"A foreign person sells Colorado real estate. Under FIRPTA the buyer or closing agent generally must withhold:",o:["2% of the price","10% of the gain","15% of the amount realized","30% of the proceeds"],a:2,r:"FIRPTA",e:"15% of the amount realized, sent to the IRS on Form 8288 within 20 days. Do not confuse with Colorado's 2% nonresident withholding."},
{x:"S",c:"Closing",q:"The closing agent reports the gross proceeds of a real estate sale to the IRS on:",o:["Form W-9","Form 1099-S","Form 8288","Form 1040"],a:1,r:"1099-S",e:"1099-S reports sales and exchanges of real estate, including land, condos and co-op stock."},
{x:"S",c:"Closing",q:"A broker holding earnest money transfers it to the title company for closing. The broker:",o:["Has no further responsibility","Must obtain a dated, signed receipt and remains accountable for the funds","Must keep 10% until funding","Must notify the Commission"],a:1,r:"Rule 5.12",e:"Get a dated and signed receipt and keep it in the file."},
{x:"S",c:"Closing",q:"In a broker-conducted closing with an institutional lender, the broker must prepare which additional record?",o:["An appraisal review","A reconciliation of the lender's loan statement with the settlement statement","A new title commitment","A 1099-S for the buyer"],a:1,r:"Closing · reconciliation",e:"The lender's statement shows what is paid out of loan proceeds. The broker reconciles it with the settlement statement and keeps a copy."},
{x:"S",c:"Closing",q:"A title commitment remains effective for:",o:["30 days","90 days","Six months or until the policy issues","One year"],a:2,r:"Title commitment",e:"Six months, or until the policy is issued. The policy itself normally issues within 30 days after closing."},
{x:"S",c:"Closing",q:"Unless the contract says otherwise, possession of the property is delivered to the buyer:",o:["At MEC","On the date of closing","Three days after closing","When the deed is recorded"],a:1,r:"CBS §17",e:"Possession is at closing unless a different Possession Date is written in, in which case use a Post-Closing Occupancy Agreement for a seller staying up to 30 days."},
{x:"S",c:"Closing",q:"In Colorado, by custom, the day of closing is charged to the:",o:["Seller","Buyer","Lender","Party named by the title company"],a:1,r:"Proration",e:"Colorado custom gives the buyer the day of closing. On the exam, always follow what the question says about who owns that day."}
);

// ================= NATIONAL · I. PROPERTY OWNERSHIP (10%) =================
{x:"N",c:"Property Ownership",q:"Which is real property?",o:["A refrigerator on rollers","A built-in dishwasher","A tenant's display racks in a store","A harvested wheat crop"],a:1,r:"Real vs personal",e:"Real property is land plus everything permanently attached and the rights that go with it. Personal property (chattel) is movable. A built-in appliance is a fixture, so it is real property."},
{x:"N",c:"Property Ownership",q:"A tenant bolts pizza ovens into a leased restaurant space. At lease end the ovens are:",o:["The landlord's, because they are attached","Trade fixtures the tenant may remove before the lease ends","Emblements","Appurtenances"],a:1,r:"Trade fixtures",e:"Trade fixtures are installed by a tenant for business and stay the tenant's personal property if removed by lease end, with damage repaired. Left behind, they become the landlord's."},
{x:"N",c:"Property Ownership",q:"In deciding whether an item is a fixture, courts give the MOST weight to:",o:["Its cost","The intention of the person who attached it","Its size","Whether it is listed in the MLS"],a:1,r:"Fixture tests",e:"Tests: method of attachment, adaptation to the property, relationship of the parties, intention, and agreement. Intention controls, and a written agreement beats everything."},
{x:"N",c:"Property Ownership",q:"The highest and most complete form of ownership is:",o:["Life estate","Fee simple absolute","Fee simple defeasible","Leasehold"],a:1,r:"Estates",e:"Fee simple absolute is ownership without conditions, of indefinite duration, freely transferable and inheritable. A defeasible fee can be lost if a condition is broken."},
{x:"N",c:"Property Ownership",q:"Ann deeds land to Ben for Ben's life, then to Cara. Cara holds a:",o:["Reversion","Remainder","Life estate pur autre vie","Leasehold"],a:1,r:"Life estates",e:"Remainder: the future interest goes to a third party. Reversion: it returns to the grantor. Pur autre vie: measured by someone else's life."},
{x:"N",c:"Property Ownership",q:"A life tenant may NOT:",o:["Lease the property","Collect rents","Commit waste that harms the remainder interest","Sell the life estate"],a:2,r:"Life estates",e:"A life tenant has possession, use and income, and may sell or lease that interest (it still ends at the measuring life), but may not damage the property and must pay taxes and upkeep."},
{x:"N",c:"Property Ownership",q:"Two unmarried friends take title with no wording about how they hold it. They are presumed to be:",o:["Joint tenants","Tenants in common","Tenants by the entirety","Partners"],a:1,r:"Co-ownership",e:"Tenancy in common is the default. Shares may be unequal, each is inheritable and separately sellable, and there is no survivorship."},
{x:"N",c:"Property Ownership",q:"A, B and C are joint tenants. C dies leaving a will giving everything to her son. The property is now owned by:",o:["A, B and C's son as tenants in common","A and B as joint tenants","A and B, with the son holding a life estate","The state"],a:1,r:"Joint tenancy",e:"Right of survivorship: a deceased joint tenant's share passes automatically to the survivors, outside probate, and cannot be willed."},
{x:"N",c:"Property Ownership",q:"A, B and C are joint tenants. A sells her interest to D. Title is now held:",o:["B, C and D as joint tenants","D as a tenant in common with B and C, who remain joint tenants with each other","B and C only","As tenants in common among all three"],a:1,r:"Joint tenancy",e:"A sale breaks the unities of time and title for that share. The buyer is a tenant in common; the remaining joint tenants keep survivorship between themselves."},
{x:"N",c:"Property Ownership",q:"The four unities required for joint tenancy are:",o:["Possession, interest, time and title","Price, interest, taxes and title","Possession, intent, transfer and term","Purpose, income, time and tenancy"],a:0,r:"Joint tenancy",e:"PITT: same possession, equal interest, created at the same time, by the same title document."},
{x:"N",c:"Property Ownership",q:"A condominium owner holds:",o:["Shares of stock and a proprietary lease","Fee simple title to the unit plus an undivided interest in the common elements","A leasehold in the unit","A license to occupy"],a:1,r:"Common-interest ownership",e:"Condo: real property, own deed, own tax bill, own mortgage. Co-op: the corporation owns the building; residents own stock and a proprietary lease, which is personal property."},
{x:"N",c:"Property Ownership",q:"An easement that benefits a neighboring parcel and transfers automatically when that parcel is sold is an easement:",o:["In gross","Appurtenant","By license","By condemnation"],a:1,r:"Easements",e:"Appurtenant easements run with the land and need two parcels: dominant (benefited) and servient (burdened). An easement in gross benefits a person or company, such as a utility, and has no dominant estate."},
{x:"N",c:"Property Ownership",q:"A power company's right to run lines across many lots is a:",o:["License","Commercial easement in gross","Easement appurtenant","Encroachment"],a:1,r:"Easements",e:"In gross: a servient estate only. Commercial easements in gross are assignable."},
{x:"N",c:"Property Ownership",q:"A landowner lets a friend park an RV on her lot. This permission is a:",o:["License, which is personal and revocable","Prescriptive easement","Easement by necessity","Lease"],a:0,r:"License",e:"A license is permission to use, not an interest in land. It can be revoked and ends at death or sale."},
{x:"N",c:"Property Ownership",q:"A neighbor's garage extends two feet over the lot line. This is:",o:["An easement","An encroachment","A lien","An appurtenance"],a:1,r:"Encroachment",e:"An encroachment is an unauthorized physical intrusion. It is usually found by a survey, not a title search, and can make title unmarketable."},
{x:"N",c:"Property Ownership",q:"A lien that attaches to all of a debtor's property is a ___ lien; one that attaches to a single property is a ___ lien.",o:["Specific; general","General; specific","Voluntary; involuntary","Junior; senior"],a:1,r:"Liens",e:"General: judgments, income tax liens. Specific: mortgages, property taxes, special assessments, mechanic's liens."},
{x:"N",c:"Property Ownership",q:"Which lien generally has priority over all others regardless of recording date?",o:["First mortgage","Mechanic's lien","Real property tax lien","Judgment lien"],a:2,r:"Lien priority",e:"Property taxes and special assessments come first. Most other liens rank by date of recording."},
{x:"N",c:"Property Ownership",q:"In the rectangular (government) survey system, a township contains:",o:["16 sections","24 sections","36 sections","640 sections"],a:2,r:"Rectangular survey",e:"A township is 6 miles by 6 miles = 36 square miles = 36 sections. Each section is 1 mile square = 640 acres."},
{x:"N",c:"Property Ownership",m:1,q:"How many acres are in the NW 1/4 of the SE 1/4 of a section?",o:["10","40","80","160"],a:1,r:"Rectangular survey",e:"Start with 640 and divide by each denominator: 640 / 4 = 160, / 4 = 40 acres."},
{x:"N",c:"Property Ownership",q:"In a township, Section 1 is in the ___ corner and Section 36 is in the ___ corner.",o:["Northwest; southeast","Northeast; southeast","Southwest; northeast","Northeast; southwest"],a:1,r:"Rectangular survey",e:"Numbering starts in the northeast corner, runs west, then snakes back and forth, ending in the southeast."},
{x:"N",c:"Property Ownership",q:"A legal description that starts at a point of beginning and follows distances and compass directions around the boundary is:",o:["Lot and block","Metes and bounds","Rectangular survey","Assessor's parcel number"],a:1,r:"Legal descriptions",e:"Metes = distances, bounds = directions and monuments. It must return to the point of beginning to close."},
{x:"N",c:"Property Ownership",q:"A description reading Lot 7, Block 3, Sunrise Subdivision relies on a:",o:["Recorded plat map","Principal meridian","Benchmark","Monument"],a:0,r:"Legal descriptions",e:"Lot and block (recorded plat) descriptions refer to a subdivision plat filed with the county."},
{x:"N",c:"Property Ownership",m:1,q:"One acre contains:",o:["4,840 sq ft","43,560 sq ft","5,280 sq ft","640 sq ft"],a:1,r:"Land measurement",e:"43,560 square feet. A mile is 5,280 feet; a section is 640 acres."},
{x:"N",c:"Property Ownership",q:"The owner of land along a flowing river has ___ rights; along a lake or ocean, ___ rights.",o:["Littoral; riparian","Riparian; littoral","Appropriative; riparian","Correlative; littoral"],a:1,r:"Water rights",e:"Riparian = river. Littoral = lake.",n:"Colorado does not follow riparian rights. It uses prior appropriation: first in time, first in right, and water rights are conveyed separately from land."},
{x:"N",c:"Property Ownership",q:"Mineral rights:",o:["Can never be separated from the surface","May be sold or leased separately from the surface estate","Belong to the state","Expire after 20 years"],a:1,r:"Severable rights",e:"Subsurface (mineral), surface and air rights can each be conveyed separately. A buyer should check whether minerals were severed earlier in the chain of title."},
{x:"N",c:"Property Ownership",q:"Property held in a living trust is managed by the ___ for the benefit of the ___.",o:["Trustor; trustee","Trustee; beneficiary","Beneficiary; trustor","Executor; heir"],a:1,r:"Trusts",e:"The trustor (settlor) creates and funds the trust, the trustee holds legal title and manages, the beneficiary receives the benefit."},

// ================= NATIONAL · II. LAND USE CONTROLS (5%) =================
{x:"N",c:"Land Use Controls",q:"The four government powers over real property are:",o:["Police power, eminent domain, taxation and escheat","Zoning, licensing, taxation and recording","Eminent domain, easement, lien and license","Police power, probate, partition and taxation"],a:0,r:"PETE",e:"PETE: Police power, Eminent domain, Taxation, Escheat."},
{x:"N",c:"Land Use Controls",q:"Zoning ordinances and building codes are exercises of:",o:["Eminent domain","Police power","Escheat","Private restriction"],a:1,r:"Police power",e:"Police power regulates for public health, safety and welfare. No compensation is owed for ordinary regulation."},
{x:"N",c:"Land Use Controls",q:"A state takes a strip of a farm for a highway. The power is ___ and the process is ___.",o:["Police power; zoning","Eminent domain; condemnation","Escheat; probate","Taxation; assessment"],a:1,r:"Eminent domain",e:"Eminent domain is the right; condemnation is the legal action. The taking must be for public use with just compensation."},
{x:"N",c:"Land Use Controls",q:"A person dies with no will and no heirs. The property passes to the state by:",o:["Eminent domain","Adverse possession","Escheat","Devise"],a:2,r:"Escheat",e:"Escheat prevents property from being ownerless."},
{x:"N",c:"Land Use Controls",q:"A corner grocery existed before the area was zoned residential and is allowed to keep operating. It is a:",o:["Variance","Legal nonconforming use","Spot zone","Conditional use"],a:1,r:"Zoning",e:"A nonconforming (grandfathered) use predates the ordinance. It usually cannot be expanded and is lost if abandoned or destroyed."},
{x:"N",c:"Land Use Controls",q:"An owner cannot meet the side setback because of the lot's odd shape and asks permission to deviate. The owner needs a:",o:["Variance","Rezoning","Nonconforming use","Plat amendment"],a:0,r:"Zoning",e:"A variance allows a deviation because of hardship caused by the property itself. A conditional (special) use permit allows a use the ordinance lists as acceptable with conditions, such as a church in a residential zone."},
{x:"N",c:"Land Use Controls",q:"A deed restriction requires 2,000 sq ft minimum homes. Zoning requires 1,500. A new home must be at least:",o:["1,500 sq ft","1,750 sq ft","2,000 sq ft","Whatever the builder chooses"],a:2,r:"Private controls",e:"When public and private controls differ, the more restrictive governs."},
{x:"N",c:"Land Use Controls",q:"Covenants, conditions and restrictions (CC&Rs) in a subdivision are enforced by:",o:["The zoning board","The owners or the owners' association, through the courts","The county assessor","The lender"],a:1,r:"Private controls",e:"CC&Rs are private contracts recorded against the lots. Enforcement is by owners or the HOA, typically by injunction."},
{x:"N",c:"Land Use Controls",q:"A city issues which document when a new building passes final inspection and may be occupied?",o:["Building permit","Certificate of occupancy","Variance","Certificate of title"],a:1,r:"Building codes",e:"Permit before work starts; certificate of occupancy when it is complete to code."},
{x:"N",c:"Land Use Controls",q:"A special assessment is:",o:["An annual tax on all property by value","A charge on the properties that benefit from a specific public improvement","An income tax on rental property","A transfer tax"],a:1,r:"Taxes and assessments",e:"Ad valorem taxes are by value for general government. Special assessments pay for an improvement such as sidewalks or sewers and are charged only to benefited properties."},
{x:"N",c:"Land Use Controls",q:"Rezoning one small parcel for a use inconsistent with the surrounding area, to benefit one owner, is called:",o:["Buffer zoning","Spot zoning","Downzoning","Cluster zoning"],a:1,r:"Zoning",e:"Spot zoning is generally illegal. A buffer zone separates incompatible uses."},
{x:"N",c:"Land Use Controls",q:"A regulation is so restrictive that an owner loses essentially all economic use, and the owner sues for compensation. The claim is:",o:["Escheat","Inverse condemnation","Partition","Quiet title"],a:1,r:"Takings",e:"Inverse condemnation is brought by the owner when government action amounts to a taking without formal condemnation."},
{x:"N",c:"Land Use Controls",q:"A deed says the land is conveyed so long as it is used as a park, and if not, it returns to the grantor. This creates a:",o:["Fee simple absolute","Fee simple determinable","Life estate","Restrictive covenant only"],a:1,r:"Deed conditions",e:"Words of duration such as so long as or while create a fee simple determinable that ends automatically. A deed condition can cause loss of title; a covenant is enforced by damages or injunction."},

// ================= NATIONAL · III. VALUATION (8%) =================
{x:"N",c:"Valuation",q:"Market value is best defined as:",o:["The price a property actually sold for","The most probable price in a competitive, open market between informed parties under no undue pressure","The cost to build the improvements","The assessed value"],a:1,r:"Value concepts",e:"Value is an estimate, price is what was paid, cost is what it took to build. They can all differ."},
{x:"N",c:"Valuation",q:"The four characteristics that create value are:",o:["Demand, utility, scarcity and transferability","Location, size, age and condition","Price, cost, income and taxes","Supply, zoning, financing and time"],a:0,r:"DUST",e:"DUST: Demand, Utility, Scarcity, Transferability."},
{x:"N",c:"Valuation",q:"A buyer will pay no more for a home than the cost of an equally desirable alternative. This is the principle of:",o:["Contribution","Substitution","Conformity","Anticipation"],a:1,r:"Value principles",e:"Substitution underlies all three approaches, especially sales comparison."},
{x:"N",c:"Valuation",q:"A $30,000 pool adds only $12,000 to market value. This illustrates:",o:["Contribution","Progression","Plottage","Highest and best use"],a:0,r:"Value principles",e:"Contribution: an improvement is worth what it adds to value, not what it cost."},
{x:"N",c:"Valuation",q:"A modest home rises in value because it sits among much larger homes. This is:",o:["Regression","Progression","Assemblage","Substitution"],a:1,r:"Value principles",e:"Progression lifts the lesser property. Regression drags down the better property among lesser ones."},
{x:"N",c:"Valuation",q:"Combining adjoining lots creates one parcel worth more than the lots separately. The process is ___ and the added value is ___.",o:["Plottage; assemblage","Assemblage; plottage","Subdivision; contribution","Accretion; progression"],a:1,r:"Value principles",e:"Assemblage is the act; plottage is the value increase."},
{x:"N",c:"Valuation",q:"The approach given the most weight for a typical owner-occupied single-family home is:",o:["Cost","Income","Sales comparison","Gross rent multiplier"],a:2,r:"Approaches to value",e:"Sales comparison for homes and land. Income for investment property. Cost for new or special-purpose buildings such as schools and churches."},
{x:"N",c:"Valuation",m:1,q:"A comparable sold for $410,000. It has a garage worth $15,000 that the subject lacks, and the subject has a finished basement worth $20,000 that the comp lacks. The adjusted comp price is:",o:["$375,000","$405,000","$415,000","$445,000"],a:2,r:"Sales comparison",e:"Adjust the comp, never the subject. Comp better: subtract ($15,000). Comp worse: add ($20,000). $410,000 - $15,000 + $20,000 = $415,000."},
{x:"N",c:"Valuation",q:"In the cost approach the appraiser:",o:["Capitalizes net income","Estimates land value, adds the cost to build new, and subtracts depreciation","Averages three comparables","Multiplies rent by a factor"],a:1,r:"Cost approach",e:"Value = land value + (cost new - accrued depreciation). Land is valued separately and is not depreciated."},
{x:"N",c:"Valuation",q:"A four-bedroom house with one bathroom suffers from:",o:["Physical deterioration","Functional obsolescence","External obsolescence","Economic life"],a:1,r:"Depreciation",e:"Functional: poor design or outdated features inside the property. Physical: wear and tear. External: forces outside the property."},
{x:"N",c:"Valuation",q:"A home loses value because an airport flight path now runs overhead. This is ___ obsolescence and is ___.",o:["Functional; curable","External; incurable","Physical; curable","External; curable"],a:1,r:"Depreciation",e:"External (economic) obsolescence comes from outside the lot lines, so the owner cannot cure it."},
{x:"N",c:"Valuation",q:"Reproduction cost is the cost to build:",o:["A functional equivalent with modern materials","An exact replica using the same materials and design","The building minus depreciation","Only the foundation"],a:1,r:"Cost approach",e:"Reproduction = exact duplicate, useful for historic property. Replacement = same utility with current materials and methods."},
{x:"N",c:"Valuation",m:1,q:"An apartment building has net operating income of $84,000. Investors expect a 7% capitalization rate. The indicated value is:",o:["$588,000","$1,000,000","$1,200,000","$5,880,000"],a:2,r:"Income approach · IRV",e:"Value = Income / Rate. $84,000 / 0.07 = $1,200,000. A higher cap rate means a lower value."},
{x:"N",c:"Valuation",m:1,q:"A duplex rents for $3,200 per month in total. Similar properties sell at a gross rent multiplier of 150. Estimated value:",o:["$384,000","$480,000","$576,000","$4,800,000"],a:1,r:"GRM",e:"Value = monthly gross rent x GRM = $3,200 x 150 = $480,000. GRM uses gross, not net, income."},
{x:"N",c:"Valuation",q:"Net operating income is:",o:["Gross income minus debt service","Effective gross income minus operating expenses, before mortgage payments and depreciation","Potential gross income minus vacancy","Cash left after taxes"],a:1,r:"Income approach",e:"PGI - vacancy and collection loss = EGI. EGI - operating expenses = NOI. Mortgage payments, depreciation and income tax are not operating expenses."},
{x:"N",c:"Valuation",q:"The final step of the appraisal process, where the appraiser weighs the approaches to reach one value, is:",o:["Averaging","Reconciliation","Capitalization","Adjustment"],a:1,r:"Appraisal process",e:"Reconciliation is a weighted judgment, not an average."},
{x:"N",c:"Valuation",q:"A broker's comparative market analysis differs from an appraisal because a CMA:",o:["Uses only sold properties","Is an estimate of a likely listing or offering price and is not an appraisal","Must follow USPAP","Is required by lenders"],a:1,r:"CMA / BPO",e:"A CMA looks at sold, active and expired listings to guide pricing. Calling it an appraisal, or doing one for a federally related loan, is unauthorized appraisal practice.",n:"Colorado Rule 6.10: a CMA prepared for something other than an anticipated sale or purchase must carry the not-an-appraisal disclaimer."},
{x:"N",c:"Valuation",q:"An appraisal for a federally related mortgage loan must be performed by:",o:["Any licensed broker","A state licensed or certified appraiser following USPAP","The loan officer","The county assessor"],a:1,r:"Appraiser licensing",e:"FIRREA requires licensed or certified appraisers and USPAP standards for federally related transactions."},
{x:"N",c:"Valuation",q:"An automated valuation model (AVM) produces a value estimate by:",o:["A physical inspection","Computer analysis of public record and sales data","A broker's opinion","Capitalizing rents"],a:1,r:"AVM",e:"AVMs are fast and cheap but do not see condition. They are not appraisals."},
{x:"N",c:"Valuation",q:"The use that is legally permitted, physically possible, financially feasible and produces the greatest value is the:",o:["Conforming use","Highest and best use","Assessed use","Interim use"],a:1,r:"Value principles",e:"All four tests must be met. Appraisers analyze it first because value depends on use."},

// ================= NATIONAL · IV. FINANCING (9%) =================
{x:"N",c:"Financing",q:"The document that is the borrower's personal promise to repay and evidence of the debt is the:",o:["Mortgage","Promissory note","Deed of trust","Deed"],a:1,r:"Loan documents",e:"Note = the debt. Mortgage or deed of trust = the security instrument that pledges the property."},
{x:"N",c:"Financing",q:"In a mortgage, the borrower is the:",o:["Mortgagee","Mortgagor","Trustee","Beneficiary"],a:1,r:"Loan documents",e:"The mortgagOR gives the mortgage to the lender, the mortgagEE.",n:"Colorado uses deeds of trust: trustor (borrower), beneficiary (lender), public trustee."},
{x:"N",c:"Financing",q:"The clause that lets the lender demand the entire balance if the borrower sells the property is the:",o:["Acceleration clause","Alienation (due-on-sale) clause","Defeasance clause","Subordination clause"],a:1,r:"Loan clauses",e:"Alienation = triggered by transfer. Acceleration = triggered by default. Defeasance = lender must release the lien when paid. Subordination = a lien agrees to take a lower priority."},
{x:"N",c:"Financing",q:"A borrower misses three payments and the lender declares the whole loan due. The lender is using the:",o:["Alienation clause","Acceleration clause","Prepayment clause","Escalation clause"],a:1,r:"Loan clauses",e:"Acceleration on default is what makes foreclosure possible for the full balance."},
{x:"N",c:"Financing",m:1,q:"A buyer pays $380,000 with a $304,000 loan. The loan-to-value ratio is:",o:["20%","76%","80%","125%"],a:2,r:"LTV",e:"LTV = loan / value = $304,000 / $380,000 = 80%. Lenders use the lower of price or appraised value."},
{x:"N",c:"Financing",q:"Private mortgage insurance is normally required on a conventional loan when:",o:["The LTV is above 80%","The borrower is self-employed","The loan is an ARM","The property is a condo"],a:0,r:"PMI",e:"PMI protects the lender on conventional loans with less than 20% down. FHA loans use MIP instead."},
{x:"N",c:"Financing",m:1,q:"A lender charges two discount points on a $350,000 loan. The cost is:",o:["$700","$3,500","$7,000","$70,000"],a:2,r:"Points",e:"One point = 1% of the loan amount, not the price. 2% x $350,000 = $7,000. Points are prepaid interest that raise the lender's yield and lower the note rate."},
{x:"N",c:"Financing",q:"PITI stands for:",o:["Principal, interest, taxes and insurance","Payment, income, title and inspection","Points, interest, term and index","Principal, impounds, title and interest"],a:0,r:"PITI",e:"The full monthly housing payment when taxes and insurance are escrowed."},
{x:"N",c:"Financing",q:"A loan with equal monthly payments that pay all interest and principal by the end of the term is:",o:["Fully amortized","A balloon loan","Interest-only","A term loan"],a:0,r:"Loan types",e:"Fully amortized: balance reaches zero. Each payment has more principal and less interest than the last. A partially amortized loan leaves a balloon."},
{x:"N",c:"Financing",q:"On an adjustable-rate mortgage the interest rate equals:",o:["The cap plus the margin","The index plus the margin","The prime rate minus points","The APR"],a:1,r:"ARM",e:"Index (moves with the market) + margin (fixed by the lender). Caps limit periodic and lifetime changes."},
{x:"N",c:"Financing",q:"An FHA loan is:",o:["Made directly by the government","Insured by the FHA and made by approved lenders","Guaranteed by the VA","Available only to first-time buyers"],a:1,r:"Government loans",e:"FHA insures; the borrower pays a mortgage insurance premium. Low down payment, owner-occupants."},
{x:"N",c:"Financing",q:"Which is true of a VA loan?",o:["It requires at least 3.5% down","It is guaranteed by the Department of Veterans Affairs and may be made with no down payment","It is insured by HUD","It may be used for investment property"],a:1,r:"Government loans",e:"VA guarantees part of the loan for eligible veterans. No down payment required up to the appraised value (certificate of reasonable value); a funding fee applies."},
{x:"N",c:"Financing",q:"USDA Rural Development loans are intended for:",o:["Luxury vacation homes","Low to moderate income buyers in eligible rural areas","Commercial farms over 500 acres","Veterans only"],a:1,r:"Government loans",e:"USDA loans can offer zero down for eligible rural properties and income-qualified borrowers."},
{x:"N",c:"Financing",q:"Under a land contract (contract for deed), the buyer:",o:["Receives legal title at signing","Takes possession and holds equitable title while the seller keeps legal title until paid","Has no interest until the last payment","Becomes a tenant"],a:1,r:"Owner financing",e:"Vendee: possession and equitable title. Vendor: legal title until the contract is paid, then delivers the deed.",n:"In Colorado brokers should not draft installment land contracts (CP-23); refer the parties to an attorney."},
{x:"N",c:"Financing",q:"A reverse mortgage:",o:["Requires monthly payments to the lender","Lets a homeowner age 62 or older convert equity to cash with repayment deferred until the owner moves, sells or dies","Is a second mortgage for remodeling","Must be repaid in five years"],a:1,r:"Loan types",e:"A HECM pays the homeowner. The loan comes due when the home is no longer the borrower's principal residence."},
{x:"N",c:"Financing",q:"A short-term loan that lets a buyer close on a new home before the old one sells is a:",o:["Bridge loan","Blanket loan","Package loan","Construction loan"],a:0,r:"Loan types",e:"Bridge (swing) loans are short and interest-only, secured by the equity in the current home."},
{x:"N",c:"Financing",q:"Funds on a construction loan are typically disbursed:",o:["In a lump sum at closing","In draws as stages of work are completed","After the certificate of occupancy only","Monthly regardless of progress"],a:1,r:"Loan types",e:"Draws follow inspections. Construction loans are short-term, higher-rate, and replaced by permanent (take-out) financing."},
{x:"N",c:"Financing",q:"RESPA prohibits:",o:["Charging discount points","Kickbacks and unearned fees for referring settlement service business","Adjustable-rate loans","Seller concessions"],a:1,r:"RESPA",e:"RESPA covers federally related loans on one-to-four family homes: no kickbacks, limits on escrow cushions, and required disclosures including affiliated business arrangements."},
{x:"N",c:"Financing",q:"An ad says only $1,500 per month. Under Regulation Z this trigger term requires the ad to also disclose:",o:["Nothing more","The down payment, terms of repayment and the APR","The lender's license number","The borrower's required credit score"],a:1,r:"TILA / Reg Z",e:"Trigger terms: down payment, payment amount, number of payments, finance charge. Stating one requires all the rest. Stating only the APR or only the price does not trigger."},
{x:"N",c:"Financing",q:"The Truth in Lending Act's three-day right of rescission applies to:",o:["A purchase-money first mortgage on a new home","A refinance or home equity loan on the borrower's principal residence","Any commercial loan","Land contracts"],a:1,r:"TILA / Reg Z",e:"Rescission covers loans secured by a home the borrower already lives in. It does not apply to the loan used to buy the home."},
{x:"N",c:"Financing",q:"Under TRID, a lender must deliver the Loan Estimate within ___ of receiving an application.",o:["24 hours","Three business days","Seven business days","Ten days"],a:1,r:"TRID",e:"Loan Estimate: three business days after application. Closing Disclosure: at least three business days before consummation."},
{x:"N",c:"Financing",q:"Under the Equal Credit Opportunity Act a lender may NOT deny credit because the applicant:",o:["Has insufficient income","Has a poor credit history","Receives public assistance income","Has too much debt"],a:2,r:"ECOA",e:"ECOA protects race, color, religion, national origin, sex, marital status, age, and receipt of public assistance. Lenders can and must weigh ability to repay."},
{x:"N",c:"Financing",q:"Fannie Mae and Freddie Mac operate in the:",o:["Primary mortgage market, lending to consumers","Secondary mortgage market, buying loans from lenders","Appraisal industry","Title insurance market"],a:1,r:"Mortgage markets",e:"Primary market: lenders originate loans. Secondary market: loans are bought, pooled and sold, which returns money to lenders. Conforming loans meet Fannie/Freddie limits."},
{x:"N",c:"Financing",q:"A foreclosure sale brings less than the debt. The lender may seek the shortfall through a:",o:["Deficiency judgment","Lis pendens","Writ of attachment","Satisfaction"],a:0,r:"Foreclosure",e:"A deficiency judgment is a personal judgment against the borrower for the unpaid balance, where state law allows."},
{x:"N",c:"Financing",q:"A loan underwriter evaluating a borrower's ability to repay looks primarily at:",o:["Race and marital status","Debt-to-income ratios, credit history and assets","The listing broker's opinion","The seller's equity"],a:1,r:"Underwriting",e:"Housing ratio (PITI / gross income) and total debt ratio, credit score and history, and collateral value."},
{x:"N",c:"Financing",q:"A prepayment penalty is considered a risky loan feature because it:",o:["Raises the interest rate each year","Charges the borrower for paying the loan off early, which can block a refinance or sale","Requires a balloon payment","Eliminates escrow"],a:1,r:"Risky features",e:"Balloons, prepayment penalties, negative amortization and teaser rates are the features consumers must understand."}
);
